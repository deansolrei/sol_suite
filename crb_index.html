    // (Calendar icon rendered in pure CSS — no image file needed)

    // Eastern-Time date for the calendar icon (computed once on load)

    const _etNow = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/New_York' }));
    const CAL_DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][_etNow.getDay()];
    const CAL_DAY = _etNow.getDate();
    // Human-readable "today" string for the Today button — e.g. "Wed · Jun 18"
    const TODAY_DISPLAY = `${CAL_DOW} · ${['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][_etNow.getMonth()]} ${CAL_DAY}`;

    const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;

    function gsr(fnName, ...args) {
      if (!IS_GAS) return Promise.reject(new Error('Not running in Apps Script context'));
      return new Promise((resolve, reject) => {
        let runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
        runner[fnName](...args);
      });
    }

    /* ═══════════════════════════════════════════════════════════
       COMMENTS TRACKING — ROLE-AWARE
       Tracks both incoming (unread) and outgoing (sent/acked) states
       separately so the chat icon can show the correct color:
         RED   = unread incoming messages for current user
         YELLOW! = current user sent a message not yet acknowledged
         Neutral = no pending activity
       localStorage keys:
         crb-seen-in-{apptId}  → count of incoming messages seen
         crb-sent-ack-{apptId} → count of outgoing messages acknowledged
    ═══════════════════════════════════════════════════════════ */

    /* Filter helpers (use _crbUser.role to determine current role) */
    function getIncomingComms(a) {
      const myRole = _crbUser.role;
      return (a.comms || []).filter(c =>
        c.role !== myRole && (c.to === myRole || c.to === 'all' || !c.to)
      );
    }
    function getOutgoingComms(a) {
      const myRole = _crbUser.role;
      return (a.comms || []).filter(c => c.role === myRole);
    }
    /* Backward-compat: any comment visible to current role */
    function hasUnreadComms(a) {
      const incoming = getIncomingComms(a);
      const seen = getSeenInCount(a.id);
      return incoming.length > seen;
    }

    /* localStorage accessors */
    function getSeenInCount(apptId) {
      try { return parseInt(localStorage.getItem('crb-seen-in-' + apptId) || '0', 10) || 0; } catch { return 0; }
    }
    function getAckedOutCount(apptId) {
      try { return parseInt(localStorage.getItem('crb-sent-ack-' + apptId) || '0', 10) || 0; } catch { return 0; }
    }
    function markIncomingRead(apptId, n) {
      try { localStorage.setItem('crb-seen-in-' + apptId, String(n)); } catch { }
    }
    function ackOutgoing(apptId, n) {
      try { localStorage.setItem('crb-sent-ack-' + apptId, String(n)); } catch { }
    }
    /* Legacy alias still called in old modal useEffects — unifies to new system */
    function markCommsSeen(apptId) {
      /* no-op — superseded; modals now call markAllCommsRead() */
    }
    function markAllCommsRead(appt) {
      // Only marks incoming as locally seen — sender must explicitly dismiss yellow state.
      // ackOutgoing removed: yellow persists until sender clicks to dismiss.
      const incoming = getIncomingComms(appt);
      markIncomingRead(appt.id, incoming.length);
    }

    /* ── Sender-dismiss localStorage helpers (separate from old ackedOut) ── */
    function isYellowDismissed(apptId) {
      try { return localStorage.getItem('crb-ydis-' + apptId) === '1'; } catch { return false; }
    }
    function setYellowDismissed(apptId) {
      try { localStorage.setItem('crb-ydis-' + apptId, '1'); } catch { }
    }
    function clearYellowDismissed(apptId) {
      try { localStorage.removeItem('crb-ydis-' + apptId); } catch { }
    }

    /* markCommsReadPersist — called by modals on open.
       1. Updates localStorage seenIn for instant local feedback.
       2. Adds current user's email to readBy on each incoming comment they can see,
          then persists via onUpdate so the SENDER'S icon can drop the ! badge. */
    function markCommsReadPersist(appt, onUpdate) {
      const incoming = getIncomingComms(appt);
      markIncomingRead(appt.id, incoming.length);   // instant localStorage feedback
      if (!onUpdate || !incoming.length) return;
      const myKey = _crbUser.email || _crbUser.display || '';
      if (!myKey) return;
      let changed = false;
      const updatedComms = (appt.comms || []).map(c => {
        if (incoming.includes(c) && !(c.readBy || []).includes(myKey)) {
          changed = true;
          return { ...c, readBy: [...(c.readBy || []), myKey] };
        }
        return c;
      });
      if (changed) onUpdate({ ...appt, comms: updatedComms });
    }
    /* Legacy helper used in a few places still */
    function _getSeenCount(apptId) { return getSeenInCount(apptId); }

    /* ══ CommChatIcon ═══════════════════════════════════════════════
       States (in priority order):
         RED + count   = receiver has unread incoming
         YELLOW + !    = sender sent ≥1 new-style comment, recipient hasn't read yet
         YELLOW (no !) = all sent comments read by recipient; sender can click to dismiss
         neutral-has   = historical comms, all clear
         empty         = no comms ever

       New-style comments = those that have a readBy[] array (built after this update).
       Old comments (no readBy) are ignored for yellow logic — backward compat.
    ══════════════════════════════════════════════════════════════ */
    function CommChatIcon({ appt, onOpen, style, className }) {
      const myKey = _crbUser.email || _crbUser.display || 'Staff';
      const myRole = _crbUser.role;
      const incoming = getIncomingComms(appt);
      const outgoing = getOutgoingComms(appt);

      // localMarkedRead: instant receiver click feedback before readBy persist round-trips
      const [localMarkedRead, setLocalMarkedRead] = React.useState(false);
      // dismissed: sender explicitly clicked green to clear it back to baseline
      const [dismissed, setDismissedState] = React.useState(() => isYellowDismissed(appt.id));

      // Track previous comms length so we only reset on NEW comments, not on every mount.
      // Using a ref instead of state so the comparison doesn't trigger extra renders.
      const prevCommsLenRef = React.useRef((appt.comms || []).length);
      React.useEffect(() => {
        const currentLen = (appt.comms || []).length;
        if (currentLen > prevCommsLenRef.current) {
          // A genuinely new comment arrived — reset dismissed + read flags
          clearYellowDismissed(appt.id);
          setDismissedState(false);
          setLocalMarkedRead(false);
        }
        prevCommsLenRef.current = currentLen;
      }, [(appt.comms || []).length]);

      // RECEIVER: RED badge only for messages SPECIFICALLY addressed to my role.
      // Messages with to='all' are informational — visible in the popup (→ hasAny)
      // but deliberately do NOT trigger a notification badge, so they cannot inflate
      // the count or prevent the yellow/green sender states from showing.
      // Old-style comments (no readBy) are backward-compat history — treat as seen.
      const unread = localMarkedRead ? 0
        : incoming.filter(c => c.readBy && c.to === myRole && !c.readBy.includes(myKey)).length;

      // SENDER: new-style outgoing (have readBy) where no one ELSE has read yet
      // Old comments without readBy are skipped — they don't affect yellow state
      const newStyleOutgoing = outgoing.filter(c => c.readBy);
      const outPendingRead = newStyleOutgoing.filter(c =>
        c.readBy.filter(k => k !== myKey).length === 0
      ).length;

      const hasAny = (appt.comms || []).length > 0;

      /* State machine — no ackedOut dependency, fully data-driven
         States (priority order):
           red          = receiver: unread incoming messages
           yellow-exclaim = sender: sent but recipient hasn't opened yet
           green        = sender: recipient read it — click to dismiss back to baseline
           has          = comms exist but no action needed
           empty        = no comms at all
      */
      const state = unread > 0 ? 'red'
        : outPendingRead > 0 ? 'yellow-exclaim'
          : newStyleOutgoing.length > 0 && !dismissed ? 'green'
            : hasAny ? 'has'
              : 'empty';

      function handleClick(e) {
        e.stopPropagation();
        if (unread > 0) {
          markIncomingRead(appt.id, incoming.length);
          setLocalMarkedRead(true);
        }
        if (state === 'green') {
          // Sender dismisses: recipient has read the message — clear green back to baseline
          setYellowDismissed(appt.id);
          setDismissedState(true);
        }
        onOpen();
      }

      return (
        <span
          className={`comm-icon-btn comm-icon-${state}${className ? ' ' + className : ''}`}
          style={style}
          onClick={handleClick}
          title={
            state === 'red' ? `${unread} unread comment${unread !== 1 ? 's' : ''}` :
              state === 'yellow-exclaim' ? 'Sent — waiting for recipient to read' :
                state === 'green' ? 'Recipient read your message — click to dismiss' :
                  state === 'has' ? 'View comments' : 'Add comment'
          }>
          {state === 'red' ? <><span className="ci-bubble">💬</span><span className="ci-badge ci-red">{unread > 9 ? '9+' : unread}</span></> :
            state === 'yellow-exclaim' ? <><span className="ci-bubble">💬</span><span className="ci-badge ci-yellow">!</span></> :
              state === 'green' ? <><span className="ci-bubble">💬</span><span className="ci-badge ci-green">!</span></> :
                <span className={`ci-bubble${state === 'has' ? ' ci-has' : ' ci-empty'}`}>💬</span>
          }
        </span>
      );
    }

    /* Backward-compat shim so old <UnreadDot appt={a} /> references still render
       as the new chat icon (red state only, no open handler). */
    function UnreadDot({ appt, style }) {
      if (!hasUnreadComms(appt)) return null;
      const count = Math.max(0, getIncomingComms(appt).length - getSeenInCount(appt.id));
      return (
        <span className="unread-dot" style={style} title={`${count} unread comment${count !== 1 ? 's' : ''}`}>
          {count > 9 ? '9+' : count}
        </span>
      );
    }

    /* ═══════════════════════════════════════════════════════════
       UTILITIES
    ═══════════════════════════════════════════════════════════ */
    function dkey(prov, date) { return `${prov}||${date}`; }
    function fmtYMD(yr, mo, dy) {
      const dt = new Date(yr, mo - 1, dy);
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
    }
    function fmtDate(ds) {
      const [y, m, d] = ds.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      return `${DAYS[dt.getDay()]}, ${MONTHS[dt.getMonth()]} ${d}, ${y}`;
    }
    function fmtShort(ds) {
      const [y, m, d] = ds.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      return `${DAYS[dt.getDay()].slice(0, 3)} ${m}/${d}/${String(y).slice(-2)}`;
    }
    // Screener administration date — plain MM/DD/YYYY, no weekday, since it
    // prefixes a compact chip row (Assistant's Screeners section + the
    // Provider Pre-visit Clinical column).
    function fmtScrDate(ds) {
      if (!ds) return '';
      const [y, m, d] = String(ds).split('-').map(Number);
      if (!y || !m || !d) return '';
      return `${String(m).padStart(2, '0')}/${String(d).padStart(2, '0')}/${y}`;
    }
    function addDays(ds, n) {
      const [y, m, d] = ds.split('-').map(Number);
      return fmtYMD(y, m, d + n);
    }
    function weekStart(ds) {
      const [y, m, d] = ds.split('-').map(Number);
      const dow = new Date(y, m - 1, d).getDay();
      return addDays(ds, dow === 0 ? -6 : 1 - dow);
    }

    // ── Tebra Status badge helpers ───────────────────────────────
    function tsClass(status) {
      if (!status) return 'ts-unknown';
      const s = status.toLowerCase().trim();
      // Handle both human-readable ("No Show") and Tebra CamelCase ("NoShow") formats
      if (s === 'scheduled' || s === 'tentative') return 'ts-scheduled';
      if (s === 'reminder sent' || s === 'remindersent') return 'ts-reminder-sent';
      if (s === 'confirmed') return 'ts-confirmed';
      if (s === 'arrived' || s === 'readytobeseen'
        || s === 'ready to be seen') return 'ts-arrived';
      if (s === 'checked in' || s === 'checkedin'
        || s === 'check-in') return 'ts-checked-in';
      if (s === 'roomed') return 'ts-roomed';
      if (s === 'checked out' || s === 'checkedout'
        || s === 'check-out') return 'ts-checked-out';
      if (s === 'rescheduled' || s === 'needsreschedule'
        || s === 'needs reschedule') return 'ts-rescheduled';
      if (s === 'no show' || s === 'noshow'
        || s === 'no-show') return 'ts-no-show';
      if (s === 'cancelled' || s === 'canceled') return 'ts-cancelled';
      // Row's Tebra ID vanished from the sync feed (see Code.gs.txt
      // importFromTebraApi's _findStaleRows, fixed 2026-07-26) — treat as
      // void/cancelled, same bucket as an explicit Tebra "Cancelled".
      if (s === 'deleted in tebra') return 'ts-cancelled';
      return 'ts-unknown';
    }

    function TBadge({ status }) {
      if (!status) return null;
      return (
        <span className={`ts-badge ${tsClass(status)}`}>
          {status}
        </span>
      );
    }

    /** Returns true for No-show / Rescheduled / Cancelled Tebra statuses.
     *  These are "void" appointments — excluded from Provider/Week views and
     *  from unsigned note counting, but kept visible in Assistant audit section. */
    function isVoidAppt(a) {
      const cls = tsClass(a.tebraStatus || '');
      return cls === 'ts-no-show' || cls === 'ts-rescheduled' || cls === 'ts-cancelled';
    }

    /** Placeholder patients are calendar-block entries (personal day holds, room
     *  blocks, etc.) — they should never appear as needing a signed note. */
    const PLACEHOLDER_PATIENTS = new Set([
      'JODENE BUSY MAC MAIL', 'KR H2 KATIES APPT1', 'JJ BLOCK', 'KR BLOCK', 'LK BLOCK',
      'DEAN TEST',
    ]);
    function isPlaceholderPatient(name) {
      return PLACEHOLDER_PATIENTS.has((name || '').trim().toUpperCase());
    }

    function normCpt(arr) {
      if (!arr || !arr.length) return [];
      return arr.flatMap(c => {
        const s = String(c).trim();
        if (/^\d+$/.test(s) && s.length > 5 && s.length % 5 === 0) {
          return s.match(/.{5}/g);
        }
        return s ? [s] : [];
      });
    }

    /**
     * Normalize a patient name for comparison: lowercase, trim, collapse
     * internal whitespace. Prevents "Bob  Boone" vs "Bob Boone" mismatches.
     */
    function normName(s) {
      return String(s || '').toLowerCase().replace(/\s+/g, ' ').trim();
    }

    function insColor(name) {
      if (!name) return { bg: '#4B5563', fg: '#fff' };
      const n = name.toLowerCase();
      // Oscar — Solrei brand rule: grouped with Optum/UHC, always #F65F28
      if (n.includes('oscar')) return { bg: '#F65F28', fg: '#fff' };
      // Surest (purple — UHC product with distinct brand)
      if (n.includes('surest')) return { bg: '#5C2D91', fg: '#fff' };
      // Meritain Health (Aetna subsidiary — burnt orange)
      if (n.includes('meritain')) return { bg: '#C06000', fg: '#fff' };
      // Carelon — Solrei brand rule, always #5009B1
      if (n.includes('carelon')) return { bg: '#5009B1', fg: '#fff' };
      // Aetna — Solrei brand rule, always #7A3E93
      if (n.includes('aetna')) return { bg: '#7A3E93', fg: '#fff' };
      // Ambetter — Solrei brand rule, always #C4187A
      if (n.includes('ambetter')) return { bg: '#C4187A', fg: '#fff' };
      // Cigna — Solrei brand rule, always #0031F6
      if (n.includes('cigna')) return { bg: '#0031F6', fg: '#fff' };
      // PacificSource
      if (n.includes('pacific')) return { bg: '#006A52', fg: '#fff' };
      // Optum / UHC / Oscar family — Solrei brand rule, always #F65F28
      // (UHC / United / Oxford / UMR / Optum / Medica-UHC — check before generic medica)
      if (n.includes('optum') || n.includes('oxford') || n.includes('umr') ||
        n.includes('unitedhealthcare') || n.includes('united health') || n.includes('uhc'))
        return { bg: '#F65F28', fg: '#fff' };
      // Medica standalone
      if (n.includes('medica')) return { bg: '#005A8B', fg: '#fff' };
      // MBA TPA
      if (n.includes('mba')) return { bg: '#4B5563', fg: '#fff' };
      // Cash Pay
      if (n.includes('cash')) return { bg: '#065F46', fg: '#fff' };
      // BCBS / Blue Cross / Blue Shield / Anthem / Florida Blue / Wellmark / Premera / Regence
      // — Solrei brand rule, always #0287C6
      if (n.includes('florida blue') || n.includes('bcbs') ||
        n.includes('blue cross') || n.includes('blue shield') ||
        n.includes('bluecross') || n.includes('blueshield') ||
        n.includes('anthem') || n.includes('wellmark') ||
        n.includes('premera') || n.includes('regence'))
        return { bg: '#0287C6', fg: '#fff' };
      // Other carriers
      if (n.includes('humana')) return { bg: '#006B3F', fg: '#fff' };
      if (n.includes('magellan')) return { bg: '#003DA5', fg: '#fff' };
      if (n.includes('beacon')) return { bg: '#0070C0', fg: '#fff' };
      if (n.includes('medicaid')) return { bg: '#1A6B3A', fg: '#fff' };
      if (n.includes('medicare')) return { bg: '#1464A8', fg: '#fff' };
      if (n.includes('sunlife') || n.includes('sun life')) return { bg: '#C89B00', fg: '#fff' };
      if (n.includes('molina')) return { bg: '#0F4C81', fg: '#fff' };
      if (n.includes('staywell')) return { bg: '#007B5E', fg: '#fff' };
      if (n.includes('tricare')) return { bg: '#003F87', fg: '#fff' };
      return { bg: '#4B5563', fg: '#fff' };
    }

    function parseTypedDate(v) {
      const m1 = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
      if (m1) {
        let [, mo, dy, yr] = m1;
        if (yr.length === 2) yr = '20' + yr;
        const dt = new Date(parseInt(yr), parseInt(mo) - 1, parseInt(dy));
        if (!isNaN(dt)) return fmtYMD(dt.getFullYear(), dt.getMonth() + 1, dt.getDate());
      }
      if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
      return null;
    }

    /** Normalize any stored unsigned[] value → "YYYY-MM-DD" (null if unparseable). */
    function unsignedToISO(v) {
      if (!v) return null;
      const s = String(v).trim();
      if (!s) return null;
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
      return parseTypedDate(s);
    }

    /**
     * Display-time filter: given an appointment's unsigned[] list and the
     * date that row is being rendered for, return only notes that are
     * strictly BEFORE apptDate.
     *
     * Rules enforced here (sheet col V is never modified — display-only):
     *   1. A note dated the same day as the appointment is hidden (original rule —
     *      the note isn't "outstanding" until the following day).
     *   2. A note dated AFTER apptDate is hidden — future dates can't be
     *      outstanding on a past/present appointment row, and today's view
     *      must never show notes from appointments that haven't happened yet.
     *
     * ISO string comparison works correctly for YYYY-MM-DD (lexicographic
     * order == chronological order).
     */
    function filterDisplayUnsigned(unsigned, apptDate) {
      if (!Array.isArray(unsigned) || !unsigned.length) return [];
      if (!apptDate) return unsigned.slice();
      return unsigned.filter(u => {
        const noteDate = unsignedToISO(u);
        return noteDate !== null && noteDate < apptDate;  // strictly before appointment date
      });
    }

    function fmtUnsignedDate(d) {
      if (!d) return '';
      const s = String(d).trim();
      const p = s.split('/');
      if (p.length === 3 && p.every(x => /^\d+$/.test(x.trim()))) {
        const yr = p[2].trim().length === 4 ? p[2].trim().slice(2) : p[2].trim();
        return `${p[0].trim().padStart(2, '0')}/${p[1].trim().padStart(2, '0')}/${yr}`;
      }
      try {
        const dt = new Date(s);
        if (!isNaN(dt.getTime())) {
          return `${String(dt.getMonth() + 1).padStart(2, '0')}/${String(dt.getDate()).padStart(2, '0')}/${String(dt.getFullYear()).slice(2)}`;
        }
      } catch (e) { }
      return s;
    }

    function methodStatus(appt) {
      if (appt.method === 'alma') return appt.alma || { text: '', valid: null };
      if (appt.method === 'hw') return appt.hw || { text: '', valid: null };
      if (appt.method === 'grow') return appt.grow || { text: '', valid: null };
      return appt.direct || { text: '', valid: null };
    }
    function computeStatus(a) {
      const ms = methodStatus(a);
      // FIX (2026-07-26): this used to treat ANY checklist item that wasn't
      // strictly true — including one simply not yet reviewed (null/'?') — as
      // an "Issue." That's wrong: per clinic policy, an item that's merely
      // unset is "In Process" (could still land on Valid or Issue), NOT a
      // failure. Only an EXPLICIT false (a channel marked invalid, or a
      // checklist item explicitly marked incomplete) means Issue. This was
      // the root cause of appointments that should read "In Process" instead
      // showing up as "Issue" in the Pre-visit window.
      const explicitFail = ms.valid === false || a.intake === false || a.ins === false || a.autopay === false;
      if (explicitFail) return 'issue';
      if (ms.valid === true && a.intake === true && a.ins === true && a.autopay === true) return 'valid';
      return 'pending';
    }
    function methCls(id, cur) {
      if (id !== cur) return 'mthd-btn';
      return `mthd-btn on-${id === 'hw' ? 'hw' : id === 'grow' ? 'grow' : id === 'direct' ? 'direct' : 'alma'}`;
    }
    function newId() { return Math.random().toString(36).slice(2, 11); }
    function newAppt(time, patient, method, directIns, paymentType, paymentRate) {
      const isPercent = paymentRate && paymentRate.includes('%');
      return {
        id: newId(), time, patient, method,
        alma: { text: '', valid: null }, hw: { text: '', valid: null },
        grow: { text: '', valid: null }, direct: { text: directIns || '', valid: null },
        directIns: directIns || '',
        intake: null, ins: null, autopay: null, ccFile: '',
        scr: { 'PHQ-9': null, 'GAD-7': null, 'PCL-5': null },
        scrData: { 'PHQ-9': { score: '' }, 'GAD-7': { score: '' }, 'PCL-5': { score: '' } },
        scrNote: '',
        checklistNote: '',
        ccEhr: '', notes: '', unsigned: [], cpt: [], rxMeds: [], rxBillerAlert: false, billing: 'pending',
        status: 'pending', out: false, comms: [],
        paymentType: paymentType || '',
        paymentRate: paymentRate || '',
        paymentAmount: isPercent ? '' : (paymentRate || ''),
        paymentCollected: false, paymentFailed: false,
        paymentPlatform: '',
      };
    }

    function parseInputTime(raw) {
      if (!raw) return null;
      const s = raw.trim();
      if (!s) return null;
      if (/^\d{3,4}$/.test(s)) {
        const padded = s.padStart(4, '0');
        const h = parseInt(padded.slice(0, 2), 10);
        const m = parseInt(padded.slice(2), 10);
        if (h <= 23 && m <= 59)
          return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
      }
      {
        const mx = s.match(/^(\d{1,2}):(\d{2})$/);
        if (mx) {
          const h = parseInt(mx[1], 10), m = parseInt(mx[2], 10);
          if (h <= 23 && m <= 59)
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        }
      }
      {
        const mx = s.match(/^(\d{1,2}):(\d{2})\s*(am|pm)$/i);
        if (mx) {
          let h = parseInt(mx[1], 10); const m = parseInt(mx[2], 10);
          const pm = mx[3].toLowerCase() === 'pm';
          if (h >= 1 && h <= 12 && m <= 59) {
            if (pm && h !== 12) h += 12; if (!pm && h === 12) h = 0;
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
          }
        }
      }
      {
        const mx = s.match(/^(\d{1,2})\s*(am|pm)$/i);
        if (mx) {
          let h = parseInt(mx[1], 10); const pm = mx[2].toLowerCase() === 'pm';
          if (h >= 1 && h <= 12) {
            if (pm && h !== 12) h += 12; if (!pm && h === 12) h = 0;
            return `${String(h).padStart(2, '0')}:00`;
          }
        }
      }
      return null;
    }

    function timeToMinutes(t) {
      if (!t) return 0;
      const hm24 = t.match(/^(\d{1,2}):(\d{2})$/);
      if (hm24) return parseInt(hm24[1], 10) * 60 + parseInt(hm24[2], 10);
      const hm12 = t.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
      if (hm12) {
        let h = parseInt(hm12[1], 10);
        const m = parseInt(hm12[2], 10);
        const pm = hm12[3].toUpperCase() === 'PM';
        if (pm && h !== 12) h += 12;
        if (!pm && h === 12) h = 0;
        return h * 60 + m;
      }
      return 0;
    }

    function fmtTime(t) {
      if (!t) return '';
      const hm24 = t.match(/^(\d{1,2}):(\d{2})$/);
      if (hm24) {
        let h = parseInt(hm24[1], 10);
        const m = hm24[2];
        const pm = h >= 12;
        if (h === 0) h = 12;
        else if (h > 12) h -= 12;
        return `${h}:${m} ${pm ? 'PM' : 'AM'}`;
      }
      return t.replace(/\s*(AM|PM)/i, ' $1').trim();
    }

    /* ═══════════════════════════════════════════════════════════
       SMALL COMPONENTS
    ═══════════════════════════════════════════════════════════ */
    function StatusDot({ s }) {
      return <span className={`dot ${s}`} style={{ marginRight: 5 }} />;
    }

    // ── Phone-only "Tools" button — replaces a whole row of stacked bottom
    // buttons (which covered appointment info on a narrow screen) with ONE
    // button pinned bottom-right; tapping it opens a drop-up menu listing the
    // same options. Shared by Billing (6 items), Provider (3), and Assistant
    // (1) — each view still renders its normal desktop button row too; CSS
    // (see the mobile media query) shows only one or the other per screen size.
    function MobileToolsMenu({ items }) {
      const [open, setOpen] = useState(false);
      const wrapRef = useRef(null);
      useEffect(() => {
        function h(e) { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); }
        document.addEventListener('mousedown', h);
        return () => document.removeEventListener('mousedown', h);
      }, []);
      const activeItem = items.find(it => it.active);
      return (
        <div className="mtm-wrap" ref={wrapRef}>
          {open && (
            <div className="mtm-menu">
              {items.map(it => (
                <button key={it.key}
                  className={`mtm-item${it.active ? ' on' : ''}`}
                  onClick={() => { it.onClick(); setOpen(false); }}>
                  {it.icon} {it.active ? `Close ${it.label}` : it.label}
                </button>
              ))}
            </div>
          )}
          <button className={`mtm-btn${open ? ' open' : ''}`} onClick={() => setOpen(o => !o)}>
            🧰 {activeItem ? activeItem.label : 'Tools'} {open ? '▾' : '▴'}
          </button>
        </div>
      );
    }

    function UnsignedAlert({ appts, date, onClearPhantom }) {
      // Display-time filter: strip same-day entries and void appointments from each
      // appt's unsigned list before we decide whether/what to show.
      const hits = [...appts]
        .filter(a => !isVoidAppt(a))
        .filter(a => !isPlaceholderPatient(a.patient))
        .map(a => ({ ...a, _displayUnsigned: filterDisplayUnsigned(a.unsigned, date) }))
        .filter(a => a._displayUnsigned.length > 0)
        .sort((a, b) => timeToMinutes(a.time) - timeToMinutes(b.time));
      if (!hits.length) return null;
      const totalNotes = hits.reduce((s, a) => s + a._displayUnsigned.length, 0);
      function urgCls(n) { return n >= 3 ? 'u3p' : n === 2 ? 'u2' : 'u1'; }
      return (
        <div className="una-wrap">
          <div className="una-head">
            <span className="una-head-label">⚠ Action Required · Sign Before Seeing Patient</span>
            <span className="una-head-count">{totalNotes} note{totalNotes !== 1 ? 's' : ''} due · {hits.length} patient{hits.length !== 1 ? 's' : ''}</span>
          </div>
          <div className="una-pills">
            {hits.map(a => {
              const n = a._displayUnsigned.length;
              return (
                <div key={a.id} className="una-pill">
                  <span className="una-pill-time">{fmtTime(a.time)}</span>
                  <span className="una-pill-name">{a.patient}</span>
                  <span className={`una-pill-badge ${urgCls(n)}`}>{n}</span>
                  {a._displayUnsigned.map((d, i) => (
                    <span key={i} className="una-pill-date">
                      {fmtUnsignedDate(d)}
                      {onClearPhantom && (
                        <button
                          className="una-date-dismiss"
                          title={`Remove phantom date ${fmtUnsignedDate(d)} — use only if this date is wrong for this patient`}
                          onClick={e => { e.stopPropagation(); onClearPhantom(a, d); }}
                        >✕</button>
                      )}
                    </span>
                  ))}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function UnsignedWeekAlert({ data, prov, days }) {
      const groups = days.reduce((acc, ds) => {
        const k = dkey(prov, ds);
        // Filter each day's appts against that day's ds so same-day
        // unsigned entries never count in the weekly banner either.
        // Also exclude void appointments (No-show / Rescheduled / Cancelled).
        const dayHits = (data[k] || [])
          .filter(a => !isVoidAppt(a))
          .filter(a => !isPlaceholderPatient(a.patient))
          .map(a => ({ ...a, _displayUnsigned: filterDisplayUnsigned(a.unsigned, ds) }))
          .filter(a => a._displayUnsigned.length > 0)
          .sort((a, b) => timeToMinutes(a.time) - timeToMinutes(b.time));
        if (dayHits.length) acc.push({ ds, appts: dayHits });
        return acc;
      }, []);
      if (!groups.length) return null;
      const totalNotes = groups.reduce((s, g) => s + g.appts.reduce((ss, a) => ss + a._displayUnsigned.length, 0), 0);
      function urgCls(n) { return n >= 3 ? 'u3p' : n === 2 ? 'u2' : 'u1'; }
      function fmtGroupDate(ds) {
        const [y, m, d] = ds.split('-');
        const dow = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][new Date(+y, +m - 1, +d).getDay()];
        return `${dow} ${m}/${d}/${String(y).slice(2)}`;
      }
      return (
        <div className="una-wrap" style={{ marginBottom: 12 }}>
          <div className="una-head">
            <span className="una-head-label">⚠ Action Required · Sign Before Seeing Patient</span>
            <span className="una-head-count">{totalNotes} note{totalNotes !== 1 ? 's' : ''} due this week</span>
          </div>
          {groups.map(({ ds, appts }, gi) => (
            <div key={ds}>
              <div className={`una-day-hdr${gi === 0 ? ' first' : ''}`}>{fmtGroupDate(ds)}</div>
              <div className="una-pills" style={{ paddingTop: 4, paddingBottom: gi === groups.length - 1 ? 10 : 4 }}>
                {appts.map(a => {
                  const n = a._displayUnsigned.length;
                  return (
                    <div key={a.id} className="una-pill">
                      <span className="una-pill-time">{fmtTime(a.time)}</span>
                      <span className="una-pill-name">{a.patient}</span>
                      <span className={`una-pill-badge ${urgCls(n)}`}>{n}</span>
                      {a._displayUnsigned.map((d, i) => (
                        <span key={i} className="una-pill-date">{fmtUnsignedDate(d)}</span>
                      ))}
                    </div>
                  );
                })}
              </div>
            </div>
          ))}
        </div>
      );
    }

    // Two entirely different stat sets depending on Pre-visit vs Post-visit —
    // NOT the same set just hidden/shown. Pre-visit shows appointment-readiness
    // status (Assistant-window input): In Process / Issue / Valid. Post-visit
    // shows claim/billing status (Biller-window input), plus Total and Signed
    // which are available from the provider's own data: Total / Signed / Not
    // Submitted / Pending / Denied / Paid. NOTE: "Pending" means two different
    // things in this app and only ONE of them was renamed — Pre-visit's
    // readiness-not-yet-determined state is now "In Process"; Post-visit's
    // insurance-claim-submitted-awaiting-result state is still "Pending" and
    // stays that way, per clinic terminology.
    function SummaryBar({ appts, date, dayMode = 'pre', onIssueClick, onPendingClick, onSignedClick, onClaimPendClick, onPaidClick }) {
      const total = appts.length;
      // Use computeStatus (live) so counts match day view — avoids stale col Y mismatches.
      const ok = appts.filter(a => computeStatus(a) === 'valid').length;
      const err = appts.filter(a => computeStatus(a) === 'issue').length;
      const pend = appts.filter(a => computeStatus(a) === 'pending').length;
      const out = appts.filter(a => a.out).length;

      // Post-visit set — mirrors BillingView's ClaimDayBanner logic. Dean's
      // requested list has no separate "Resubmitted" stat, so a resubmitted
      // claim is counted under "Pending" (still awaiting final adjudication)
      // rather than silently dropped from every count.
      const notSub = appts.filter(a => a.method !== 'direct' && a.billing !== 'submitted').length;
      const submittedAppts = appts.filter(a => a.billing === 'submitted');
      const claimPaid = submittedAppts.filter(a => a.claimStatus === 'Paid').length;
      const claimDenied = submittedAppts.filter(a => a.claimStatus === 'Denied').length;
      const claimPend = submittedAppts.filter(a => !a.claimStatus || a.claimStatus === 'Pending' || a.claimStatus === 'Resubmitted').length;

      return (
        <div className="summary-row">
          {dayMode === 'pre' ? (
            <>
              {pend > 0 && (
                <button
                  className="scard s-pend scard-btn"
                  onClick={onPendingClick}
                  title="Jump to the appointment still in process">
                  <span className="num">{pend}</span> In Process
                </button>
              )}
              {err > 0 && (
                <button
                  className="scard s-err scard-btn"
                  onClick={onIssueClick}
                  title="Jump to the appointment with an issue">
                  <span className="num">{err}</span> Issues
                </button>
              )}
              <div className="scard s-ok"><span className="num">{ok}</span> Valid</div>
            </>
          ) : (
            <>
              <div className="scard s-all"><span className="num">{total}</span> Total</div>
              {out > 0 ? (
                <button className="scard s-out scard-btn" onClick={onSignedClick} title="Highlight signed appointments">
                  <span className="num">{out}</span> Signed
                </button>
              ) : <div className="scard s-out"><span className="num">{out}</span> Signed</div>}
              {notSub > 0 && <div className="scard s-nosub"><span className="num">{notSub}</span> Not Submitted</div>}
              {claimPend > 0 && (
                <button className="scard s-pend scard-btn" onClick={onClaimPendClick} title="Highlight claims still pending">
                  <span className="num">{claimPend}</span> Pending
                </button>
              )}
              {claimDenied > 0 && <div className="scard s-err"><span className="num">{claimDenied}</span> Denied</div>}
              {claimPaid > 0 && (

                  <span className="num">{claimPaid}</span> Paid
                </button>
              )}
            </>
          )}
          {date && <div className="summary-date-pill">{fmtDate(date)}</div>}
        </div>
      );
    }

    function CalendarPicker({ date, onSelect, onClose }) {
      const [calYM, setCalYM] = useState(date.slice(0, 7));
      const [y, m] = calYM.split('-').map(Number);
      const firstDow = new Date(y, m - 1, 1).getDay();
      const daysInMonth = new Date(y, m, 0).getDate();
      const daysInPrev = new Date(y, m - 1, 0).getDate();
      const cells = [];
      for (let i = firstDow - 1; i >= 0; i--) cells.push({ day: daysInPrev - i, ds: fmtYMD(y, m - 1, daysInPrev - i), other: true });
      for (let i = 1; i <= daysInMonth; i++) cells.push({ day: i, ds: fmtYMD(y, m, i), other: false });
      let next = 1; while (cells.length < 42) { cells.push({ day: next, ds: fmtYMD(y, m + 1, next), other: true }); next++; }
      const prev = () => setCalYM(m === 1 ? `${y - 1}-12` : `${y}-${String(m - 1).padStart(2, '0')}`);
      const fwd = () => setCalYM(m === 12 ? `${y + 1}-01` : `${y}-${String(m + 1).padStart(2, '0')}`);
      return (
        <div className="cal-overlay" onClick={onClose}>
          <div className="cal-popup" onClick={e => e.stopPropagation()}>
            <div className="cal-month-nav">
              <button className="cal-nav-btn" onClick={prev}>‹</button>
              <div className="cal-month-title">{MONTHS[m - 1]} {y}</div>
              <button className="cal-nav-btn" onClick={fwd}>›</button>
            </div>
            <div className="cal-g7">
              {['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'].map(d => <div key={d} className="cal-dh">{d}</div>)}
              {cells.map((c, i) => {
                let cls = 'cal-d';
                if (c.other) cls += ' cal-other';
                if (c.ds === TODAY && c.ds !== date) cls += ' cal-today';
                if (c.ds === date) cls += ' cal-sel';
                return <div key={i} className={cls} onClick={() => onSelect(c.ds)}>{c.day}</div>;
              })}
            </div>
            <div className="cal-tip">Click a date · Click outside to close</div>
          </div>
        </div>
      );
    }

        const r = _crbUser.role || 'assistant';
        const opts = COMM_TO_OPTIONS[r] || COMM_TO_OPTIONS.assistant;
        return (opts[0] && opts[0].v) || 'all';
      });
      const [uDate, setUDate] = useState('');
      const commListRef = React.useRef(null);
      const myRole = _crbUser.role || 'assistant';
      const toOptions = COMM_TO_OPTIONS[myRole] || COMM_TO_OPTIONS.assistant;
      React.useEffect(() => {
        markCommsReadPersist(appt, (u) => {
          setD(p => ({ ...p, comms: u.comms }));
          if (onUpdate) onUpdate(u);
        });
      }, []);
      React.useEffect(() => {
        if (commListRef.current) commListRef.current.scrollTop = commListRef.current.scrollHeight;
      }, [(d.comms || []).length]);
      function upd(k, v) { setD(p => ({ ...p, [k]: v })); }
      function updMs(ms, k, v) { setD(p => ({ ...p, [ms]: { ...p[ms], [k]: v } })); }
      function updScr(k, v) {
        const newScr = { ...(d.scr || {}), [k]: v };
        setD(p => ({ ...p, scr: newScr }));
        if (onUpdate) onUpdate({ ...d, scr: newScr });
      }
      function updScrData(name, score) {
        const newScrData = { ...(d.scrData || {}), [name]: { score } };
        setD(p => ({ ...p, scrData: newScrData }));
        if (onUpdate) onUpdate({ ...d, scrData: newScrData });
      }
      // Date the screener battery was actually administered — stored as a
      // sibling key inside scrData (date: 'YYYY-MM-DD') rather than a new
      // sheet column, since scrData already round-trips as one JSON blob
      // (solboard_code.gs just JSON.stringify/parse's it — no backend
      // change needed to add a key here). One date covers all three
      // screeners; shows up in the Provider Pre-visit Clinical column.
      function updScrDate(val) {
        const newScrData = { ...(d.scrData || {}), date: val };
        setD(p => ({ ...p, scrData: newScrData }));
        if (onUpdate) onUpdate({ ...d, scrData: newScrData });
      }
      // Score fields are typeable immediately — no need to check "Done"
      // first. Typing a score auto-checks Done (unless it's already
      // explicitly set); clearing the field back out does NOT auto-uncheck,
      // so a mis-click on N/A or ? still holds once made deliberately.
      function updScrScore(name, score) {
        const newScrData = { ...(d.scrData || {}), [name]: { score } };
        const shouldAutoCheck = score !== '' && (d.scr || {})[name] !== true;
        const newScr = shouldAutoCheck ? { ...(d.scr || {}), [name]: true } : (d.scr || {});
        setD(p => ({ ...p, scrData: newScrData, scr: newScr }));
        if (onUpdate) onUpdate({ ...d, scrData: newScrData, scr: newScr });
      }
      function syncField(field, val) {
        setD(p => ({ ...p, [field]: val }));
        if (onUpdate) onUpdate({ ...d, [field]: val });
      }
      function _msKeyOf(method) {
        return method === 'alma' ? 'alma' : method === 'hw' ? 'hw' : method === 'grow' ? 'grow' : 'direct';
      }
      function updRequired(field, v) {
        setD(p => {
          const next = { ...p, [field]: v };
          if (next.intake === true && next.ins === true && next.autopay === true) {
            const key = _msKeyOf(p.method);
            next[key] = { ...(p[key] || { text: '', valid: null }), valid: true };
          }
          return next;
        });
      }

      function addComm() {
        if (!commNote.trim()) return;
        const nc = buildComment(commNote, commTo);
        const newComms = [...(d.comms || []), nc];
        setD(p => ({ ...p, comms: newComms }));
        setCommNote('');
        if (onUpdate) onUpdate({ ...d, comms: newComms });
      }
      function addUDate() {
        const v = uDate.trim();
        if (v && !(d.unsigned || []).includes(v)) setD(p => ({ ...p, unsigned: [...(p.unsigned || []), v] }));
        setUDate('');
      }
      function rmUDate(v) { setD(p => ({ ...p, unsigned: p.unsigned.filter(x => x !== v) })); }
      function handleSave() { onSave({ ...d, status: computeStatus(d) }); }
      const msKey = d.method === 'alma' ? 'alma' : d.method === 'hw' ? 'hw' : d.method === 'grow' ? 'grow' : 'direct';
      const ms = d[msKey] || { text: '', valid: null };
      function RadioRow({ label, field, req, onChange: onChangeProp }) {
        return (
          <div className="rrow">
            <div className="rlbl">{label}{req && <span className="rreq">required</span>}</div>
            <div className="ropt">
              {[[true, '✓', 'c-ok'], [false, '✗', 'c-err'], [null, '?', 'c-unk']].map(([v, l, c]) => (
                <label key={String(v)}>
                  <input type="radio" checked={d[field] === v}
                    onChange={() => onChangeProp ? onChangeProp(v) : upd(field, v)} />
                  <span className={c}> {l}</span>
                </label>
              ))}
            </div>
          </div>
        );
      }
      return (
        <div className="overlay" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="m-hdr">
              <div>
                <div className="m-title">{d.patient}</div>
                <div className="m-sub">
                  {fmtTime(d.time)} · {METHOD_LABEL[d.method] || d.method}
                  {d.status === 'valid' && ' · ✅ Valid'}{d.status === 'issue' && ' · 🔴 Issue'}{d.status === 'pending' && ' · ⏳ In Process'}
                </div>
              </div>
              <button className="m-close" onClick={onClose}>×</button>
            </div>
            <div className="m-body">
              {/* ── SECTION 1: APPOINTMENT INFO ── */}
              <div className="step">
                <div className="step-hd"><span className="step-num">1</span> Appointment Info</div>
                <div className="g2 frm">
                  <div><label className="fl">Time</label>
                    <input className="fi" value={d.time}
                      onChange={e => upd('time', e.target.value)}
                      onBlur={e => { const hhmm = parseInputTime(e.target.value); if (hhmm) upd('time', hhmm); }}
                      placeholder="e.g. 9:00 AM, 1pm, 1300" /></div>
                  <div><label className="fl">Patient Name</label>
                    <input className="fi" value={d.patient} onChange={e => upd('patient', e.target.value)} /></div>
                </div>
                <div className="frm">
                  <label className="fl">Billing Channel</label>
                  <div style={{ display: 'flex', gap: 8 }}>
                    {METHODS.map(({ id, label }) => (<div key={id} className={methCls(id, d.method)} onClick={() => upd('method', id)}>{label}</div>))}
                  </div>
                </div>
                {d.method === 'direct' && (
                  <>
                    <div className="frm">
                      <label className="fl">Insurance Carrier / Cost-Share Classification</label>
                      <input className="fi" value={d.directIns}
                        onChange={e => { upd('directIns', e.target.value); updMs('direct', 'text', e.target.value); }}
                        placeholder="e.g. Blue Cross Blue Shield, Cash Pay" />
                    </div>
                    {d.directIns && d.directIns.length > 2 && !d.directIns.toLowerCase().includes('cash') && <BestChannelHint carrier={d.directIns} state={d.patientState || ''} />}
                    <div className="g2 frm">
                      <div><label className="fl">Cost-Share Classification</label>
                        <select className="fi" value={d.paymentType || ''} onChange={e => upd('paymentType', e.target.value)}>
                          <option value="">— Select —</option>
                          <option value="copay">Copay</option>
                          <option value="coinsurance">Coinsurance</option>
                          <option value="cash-pay">Cash-pay</option>
                        </select>
                      </div>
                      <div><label className="fl">Rate{d.paymentType === 'coinsurance' ? ' (%)' : ' ($)'}</label>
                        <input className="fi" value={d.paymentRate || ''} onChange={e => upd('paymentRate', e.target.value)}
                          placeholder={d.paymentType === 'coinsurance' ? 'e.g. 20%' : 'e.g. 30'} /></div>
                    </div>
                  </>
                )}
                {/* Billing status inline — text note + validity radio, now part of Appointment Info */}
                <div style={{ background: '#F8FAFC', borderRadius: 8, padding: '10px 12px', marginTop: 10, border: '1px solid #E2E8F0' }}>
                  <div style={{ fontSize: 11, fontWeight: 800, color: '#64748B', textTransform: 'uppercase', letterSpacing: .4, marginBottom: 6 }}>
                    Billing Status — {METHOD_LABEL[d.method] || d.method}
                  </div>
                  <div className="frm" style={{ marginBottom: 8 }}>
                    <input className="fi" value={ms.text} onChange={e => updMs(msKey, 'text', e.target.value)}
                      placeholder="Status note with initials — e.g. Valid 4/2/26 MA  or  Payment expired JC" />
                  </div>
                  <div className="ropt">
                    {[[true, '🟢 Valid'], [false, '🔴 Issue'], [null, '⏳ In Process']].map(([v, l]) => (
                      <label key={String(v)} style={{ fontSize: 14, gap: 6 }}>
                        <input type="radio" checked={ms.valid === v} onChange={() => {
                          setD(p => {
                            const key = _msKeyOf(p.method);
                            const next = { ...p, [key]: { ...(p[key] || { text: '', valid: null }), valid: v } };
                            if (v === true) { next.intake = true; next.ins = true; next.autopay = true; }
                            return next;
                          });
                        }} /> {l}
                      </label>
                    ))}
                  </div>
                </div>
                <div className="frm" style={{ marginTop: 10 }}>
                  <label className="fl">Unsigned Note Dates</label>
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: 5, marginBottom: 6 }}>
                    {(d.unsigned || []).map(v => (
                      <span key={v} className="uchip">({v}) <span className="uchip-x" onClick={() => rmUDate(v)}>×</span></span>
                    ))}
                    {!(d.unsigned && d.unsigned.length) && <span style={{ fontSize: 12, color: '#777355' }}>No unsigned notes</span>}
                  </div>
                  <div style={{ display: 'flex', gap: 8 }}>
                    <input className="fi" style={{ flex: 1 }} placeholder="e.g. 3/11/26" value={uDate}
                      onChange={e => setUDate(e.target.value)} onKeyDown={e => e.key === 'Enter' && addUDate()} />
                    <button className="btn btn-s btn-sm" onClick={addUDate}>+ Add</button>
                  </div>
                </div>
              </div>
              {/* ── SECTION 2: INTAKE CHECKLIST ── */}
              <div className="step">
                <div className="step-hd"><span className="step-num">2</span> Intake Checklist</div>
                <div style={{ background: '#FBFBF3', borderRadius: 8, padding: '8px 12px', marginBottom: 10, border: '1px solid #F2EDDB' }}>
                  <div style={{ fontSize: 11, fontWeight: 800, color: '#777355', textTransform: 'uppercase', letterSpacing: .4, marginBottom: 4 }}>Required Items</div>
                  <RadioRow label="Intake Paperwork Complete" field="intake" req onChange={v => updRequired('intake', v)} />
                  <RadioRow label="Insurance Verified &amp; Valid" field="ins" req onChange={v => updRequired('ins', v)} />
                  <RadioRow label="Autopay / Credit Card on File" field="autopay" req onChange={v => updRequired('autopay', v)} />
                  <div style={{ marginTop: 10, paddingTop: 8, borderTop: '1px solid #F2EDDB' }}>
                    <div style={{ fontSize: 11, fontWeight: 800, color: '#777355', textTransform: 'uppercase', letterSpacing: .4, marginBottom: 6, display: 'flex', alignItems: 'center', gap: 5 }}>
                      ⚠️ Issue Notes
                      <span style={{ fontSize: 10, fontWeight: 600, color: '#B8B09A', textTransform: 'none', letterSpacing: 0 }}>— reason for any Issue designation</span>
                    </div>
                    <textarea
                      className="scr-note-area"
                      placeholder="Describe any issues with intake paperwork, insurance, or autopay (e.g. insurance expired, card declined, paperwork incomplete)…"
                      value={d.checklistNote || ''}
                      onChange={e => upd('checklistNote', e.target.value)}
                      onBlur={e => syncField('checklistNote', e.target.value)}
                    />
                  </div>
                </div>
                <div style={{ background: '#FBFBF3', borderRadius: 8, padding: '8px 12px', marginBottom: 10, border: '1px solid #F2EDDB' }}>
                  <div style={{ fontSize: 11, fontWeight: 800, color: '#777355', textTransform: 'uppercase', letterSpacing: .4, marginBottom: 4 }}>Screeners</div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
                    <label className="fl" style={{ margin: 0 }}>Date Administered</label>
                    <input
                      type="date"
                      className="fi"
                      style={{ maxWidth: 160 }}
                      value={(d.scrData || {}).date || ''}
                      onChange={e => updScrDate(e.target.value)}
                    />
                  </div>
                  {['PHQ-9', 'GAD-7', 'PCL-5'].map(s => {
                    const cfg = SCR_CONFIG[s];
                    const sd = ((d.scrData || {})[s]) || { score: '' };
                    const result = getScrResult(s, sd.score);
                    const checked = (d.scr || {})[s];
                    return (
                      <div key={s}>
                        <div className="rrow" style={{ borderBottom: 'none' }}>
                          <div className="rlbl" style={{ fontWeight: 700 }}>{s}</div>
                          <div className="ropt">
                            {[[true, '✓ Done', 'c-ok'], [false, '✗ N/A', 'c-err'], [null, '? —', 'c-unk']].map(([v, l, c]) => (
                              <label key={String(v)}>
                                <input type="radio" checked={checked === v} onChange={() => updScr(s, v)} />
                                <span className={c}> {l}</span>
                              </label>
                            ))}
                          </div>
                        </div>
                        {/* Score field is always available — typing a value
                            auto-checks Done above instead of requiring Done
                            to be checked first. */}
                        <div className="scr-score-row">
                          <span className="scr-score-lbl">Score</span>
                          <input
                            className="scr-score-input"
                            type="number"
                            min={0} max={cfg.max}
                            placeholder="—"
                            value={sd.score}
                            onChange={e => updScrScore(s, e.target.value)}
                          />
                          <span className="scr-score-max">/ {cfg.max}</span>
                          {result && (
                            <span
                              className="scr-indicates-chip"
                              style={{ background: result.color + '1A', color: result.color, border: `1px solid ${result.color}40` }}>
                              {result.text}
                            </span>
                          )}
                          {sd.score !== '' && !result && (
                            <span className="scr-indicates-chip" style={{ background: '#fef9c3', color: '#92400e', border: '1px solid #fde68a' }}>
                              Out of range (0–{cfg.max})
                            </span>
                          )}
                        </div>
                      </div>
                    );
                  })}
                  <div style={{ marginTop: 10, paddingTop: 8, borderTop: '1px solid #F2EDDB' }}>
                    <div style={{ fontSize: 11, fontWeight: 800, color: '#777355', textTransform: 'uppercase', letterSpacing: .4, marginBottom: 6, display: 'flex', alignItems: 'center', gap: 5 }}>
                      📝 Provider Notes
                    </div>
                    <textarea
                      className="scr-note-area"
                      placeholder="Additional notes for the provider — patient presentation, safety concerns, context for scores, follow-up items…"
                      value={d.scrNote || ''}
                      onChange={e => upd('scrNote', e.target.value)}
                      onBlur={e => syncField('scrNote', e.target.value)}
                    />
                  </div>
                </div>
                <div style={{ background: '#FBFBF3', borderRadius: 8, padding: '8px 12px', border: '1px solid #F2EDDB' }}>
                  <div style={{ fontSize: 11, fontWeight: 800, color: '#777355', textTransform: 'uppercase', letterSpacing: .4, marginBottom: 6 }}>Credit Card on File in Tebra</div>
                  <div className="ropt" style={{ gap: 16, fontSize: 14 }}>
                    {[['Y', 'Yes ✓'], ['N', 'No ✗'], ['', 'Not Checked ?']].map(([v, l]) => (
                      <label key={v}><input type="radio" checked={d.ccEhr === v} onChange={() => upd('ccEhr', v)} /> {l}</label>
                    ))}
                  </div>
                  {d.ccEhr === 'N' && <div className="cc-warn" style={{ marginTop: 8 }}>⚠️ Send credit card authorization form from Tebra. Update to Yes once received.</div>}
                </div>
              </div>

              {/* ── SECTION 3: COMMENTS ── */}
              <div className="step">
                <div className="step-hd"><span className="step-num">3</span> Comments</div>
                <div style={{ fontSize: 12, color: '#777355', marginBottom: 8, fontStyle: 'italic' }}>
                  Shared staff comments — date, time, and author logged automatically.
                </div>
                <div className="pam-comm-list" ref={commListRef} style={{ marginBottom: 8 }}>
                  {(d.comms || []).length === 0 && (
                    <div style={{ fontSize: 12, color: '#94A3B8', padding: '8px 0', fontStyle: 'italic' }}>No comments yet.</div>
                  )}
                  {(d.comms || []).map((c, i) => <CommItem key={i} c={c} />)}
                </div>
                <div className="pam-comm-input">
                  <select
                    className="pam-to-select"
                    value={commTo}
                    onChange={e => setCommTo(e.target.value)}
                    title="Send to…"
                  >
                    {toOptions.map(o => <option key={o.v} value={o.v}>{o.l}</option>)}
                  </select>
                  <input className="fi" style={{ flex: 1 }} placeholder="Add comment…" value={commNote}
                    onChange={e => setCommNote(e.target.value)} onKeyDown={e => e.key === 'Enter' && addComm()} />
                  <button className="pam-send-btn" onClick={addComm}>Send</button>
                </div>
              </div>
            </div>
            <div className="m-foot">
              {onDelete && !confirmDelete && (
                <button className="btn btn-d" style={{ marginRight: 'auto' }} onClick={() => setConfirmDelete(true)}>🗑 Delete</button>
              )}
              {onDelete && confirmDelete && (
                <span style={{ marginRight: 'auto', display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
                  <span style={{ fontSize: 13, color: '#b91c1c', fontWeight: 700 }}>Remove this appointment?</span>
                  <button className="btn btn-d btn-sm" onClick={() => onDelete(appt.id)}>Yes, Remove</button>
                  <button className="btn btn-s btn-sm" onClick={() => setConfirmDelete(false)}>Cancel</button>
                </span>
              )}
              {!confirmDelete && <button className="btn btn-s" onClick={onClose}>Cancel</button>}
              {!confirmDelete && <button className="btn btn-p" onClick={handleSave}>Save &amp; Update Status</button>}
            </div>
          </div>
        </div>
      );
    }

    /* ── Provider Day View — Direct Pay Summary Card ────────────────
       Uses the same dpSummary() logic as the week view banners so the
       left / right column logic (needs collection vs collected) is identical.
       Read-only for the provider — no payment actions, just visibility.
    ──────────────────────────────────────────────────────────────── */
    function DayDirectPayBanner({ appts, date }) {
      const [expanded, setExpanded] = useState(false);
      const s = dpSummary(appts);
      if (!s) return null;

      const cls = s.allDone ? 'dp-all-done' : s.hasFail ? 'dp-has-failed' : 'dp-has-pending';
      // totalOwed sums the expected paymentRate (col AB) for uncollected patients.
      // numPayRate() skips % entries since they can't be added to dollar totals.
      const totalOwed = s.needActionPts.reduce((sum, a) => sum + numPayRate(a), 0);
      const totalColl = s.collectedPts.filter(a => !a._isZero)
        .reduce((sum, a) => sum + (parseFloat(a.paymentAmount) || 0), 0);
      // FIXED: label used to key off totalOwed > 0, but a patient with a
      // percentage-based rate (not a dollar amount) is skipped by
      // numPayRate() — so totalOwed could read $0 while that patient still
      // needed collection, making the banner wrongly claim "all collected."
      // Key off needActionPts.length (does anyone need action at all)
      // instead, and only fall back to a generic count when no dollar
      // total can be computed.
      const needsAction = s.needActionPts.length > 0;

      // Collapsed by default — Cost Share detail shouldn't take permanent
      // screen space. Click the summary line to reveal the full breakdown.
      return (
        <div className="pvdp-collapsible">
          <button className="pvdp-summary-toggle" onClick={() => setExpanded(e => !e)}>
            {needsAction
              ? (totalOwed > 0
                ? `Cost share: $${totalOwed.toFixed(0)} due`
                : `Cost share: ${s.needActionPts.length} pending`)
              : 'Cost share: all collected'}
            <span className="pvdp-chevron" aria-hidden="true">{expanded ? '▴' : '▾'}</span>
          </button>
          {expanded && (
            <div className={`pvdp-wrap ${cls}`}>
              <div className="pvdp-hdr">
                <span className="pvdp-title">💰 Direct Pay</span>
                <span className="pvdp-date">{fmtDate(date)}</span>
              </div>
              <div className="pvdp-cols">

                {/* Left — needs collection */}
                <div className="pvdp-col">
                  <div className="pvdp-col-hdr">💰 Needs Collection · {s.needActionPts.length}</div>
                  {s.needActionPts.map(a => {
                    return (
                      <div key={a.id} className="pvdp-row">
                        <span className="pvdp-name">
                          {a.paymentFailed ? '❌ ' : '⏳ '}{a.patient}
                        </span>
                        <span className="pvdp-amt">{fmtPayRate(a)}</span>
                      </div>
                    );
                  })}
                  {s.needActionPts.length === 0 && <div className="pvdp-none">All collected ✓</div>}
                  {totalOwed > 0 && (
                    <div className="pvdp-total">
                      <span>Outstanding</span>
                      <span>${totalOwed.toFixed(0)}</span>
                    </div>
                  )}
                </div>

                {/* Right — collected */}
                <div className={`pvdp-col${!s.allDone ? ' pvdp-col-done' : ''}`}>
                  <div className="pvdp-col-hdr">✅ Collected · {s.collectedPts.length}</div>
                  {s.collectedPts.map(a => {
                    const amt = parseFloat(a.paymentAmount) || 0;
                    const isZero = a._isZero;
                    return (
                      <div key={a.id} className="pvdp-row">
                        <span className="pvdp-name">{a.patient}</span>
                        <span className="pvdp-amt">
                          {isZero ? '$0 / $0' : `$${amt.toFixed(0)} / $${amt.toFixed(0)}`}
                        </span>
                      </div>
                    );
                  })}
                  {s.collectedPts.length === 0 && <div className="pvdp-none">None yet</div>}
                  {totalColl > 0 && (
                    <div className="pvdp-total">
                      <span>Collected</span>
                      <span>${totalColl.toFixed(0)}</span>
                    </div>
                  )}
                </div>

              </div>
            </div>
          )}
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════════
       CLAIMS LEDGER — full-screen overlay, view-only reference
       Accessible from both Provider and Billing windows.
    ═══════════════════════════════════════════════════════════ */
    /* ════════════════════════════════════════════════════════════════
       NOTE BOARD PANEL
       Floating panel showing clinic note formatting status for all
       appointments in a rolling 14-back / 28-forward window.
       Assistants can click to cycle through status values.
       Providers and Billers see read-only badges.
    ════════════════════════════════════════════════════════════════ */
    const NS_LABELS = {
      '': { label: 'Not Started', cls: 'ns-none', icon: '—' },
      'in_progress': { label: 'In Progress', cls: 'ns-prog', icon: '⏳' },
      'ready': { label: 'Ready', cls: 'ns-ready', icon: '✓' },
    };
    const NS_CYCLE = ['', 'in_progress', 'ready'];

    /* ── Current user cache (set once on App init, used by addComm) ── */
    let _crbUser = { display: '', email: '', role: '' };

    /* ── Shared comment-builder — returns a new comment object with ET time + author ── */
    function buildComment(noteText, commTo) {
      const now = new Date();
      const ds = `${now.getMonth() + 1}/${now.getDate()}/${String(now.getFullYear()).slice(-2)}`;
      const ts = now.toLocaleTimeString('en-US', {
        hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York',
      }) + ' ET';
      const author = _crbUser.display || _crbUser.email || 'Staff';
      const role = _crbUser.role || 'unknown';
      const to = commTo || 'all';
      // readBy: sender has already "seen" their own message; tracks cross-user receipt
      const myKey = _crbUser.email || _crbUser.display || 'Staff';
      return { date: ds, time: ts, author, role, to, note: noteText.trim(), readBy: [myKey] };
    }

    /* ── TO options per role for the dropdown in comment inputs ── */
    const COMM_TO_OPTIONS = {
      provider: [{ v: 'assistant', l: 'Assistants' }, { v: 'biller', l: 'Biller' }, { v: 'all', l: 'All' }],
      assistant: [{ v: 'provider', l: 'Provider' }, { v: 'biller', l: 'Biller' }, { v: 'all', l: 'All' }],
      biller: [{ v: 'provider', l: 'Provider' }, { v: 'assistant', l: 'Assistant' }, { v: 'all', l: 'All' }],
    };

    /* ── Screener configuration: score ranges + severity colours ──────── */
    const SCR_CONFIG = {
      'PHQ-9': {
        max: 27,
        ranges: [
          [0, 4, 'Minimal or no depression', '#16a34a'],
          [5, 9, 'Mild depression', '#84cc16'],
          [10, 14, 'Moderate depression', '#f59e0b'],
          [15, 19, 'Moderately severe depression', '#f97316'],
          [20, 27, 'Severe depression', '#dc2626'],
        ],
      },
      'GAD-7': {
        max: 21,
        ranges: [
          [0, 4, 'Minimal to no anxiety', '#16a34a'],
          [5, 9, 'Mild anxiety', '#84cc16'],
          [10, 14, 'Moderate anxiety', '#f59e0b'],
          [15, 21, 'Severe anxiety', '#dc2626'],
        ],
      },
      'PCL-5': {
        max: 80,
        ranges: [
          [0, 30, 'Below clinical threshold for PTSD', '#16a34a'],
          [31, 80, 'Probable PTSD diagnosis', '#dc2626'],
        ],
      },
    };

    /* Returns { text, color } for a given screener score, or null if not applicable */
    function getScrResult(name, score) {
      const cfg = SCR_CONFIG[name];
      if (!cfg) return null;
      const n = parseInt(score, 10);
      if (score === '' || score === null || score === undefined || isNaN(n)) return null;
      if (n < 0 || n > cfg.max) return { text: `Out of range (0–${cfg.max})`, color: '#64748b' };
      const r = cfg.ranges.find(([lo, hi]) => n >= lo && n <= hi);
      return r ? { text: r[2], color: r[3] } : null;
    }

    /* ── Render a single comment entry (date · time ET · author, then note text) ── */
    function CommItem({ c }) {
      const meta = [c.date, c.time, c.author || c.init].filter(Boolean).join(' · ');
      return (
        <div className="comm-item">
          <div className="comm-meta" style={{ marginBottom: 3 }}>{meta}</div>
          <div className="comm-note">{c.note}</div>
        </div>
      );
    }

    /* ════════════════════════════════════════════════════════════════
       PROVIDER APPOINTMENT MODAL
       Opened from Provider Week View (click appointment) and Provider
       Day View (💬 button in each row).

    ════════════════════════════════════════════════════════════════ */

      // rather than 'all' so messages are targeted by default.
      const [commTo, setCommTo] = useState(() => {
        const r = _crbUser.role || 'provider';
        const opts = COMM_TO_OPTIONS[r] || COMM_TO_OPTIONS.provider;
        return (opts[0] && opts[0].v) || 'all';
      });
      const [rxModal, setRxModal] = useState(false);
      const [cptModal, setCptModal] = useState(false);
      const commListRef = React.useRef(null);

      // Determine "To" options based on current user's role
      const myRole = _crbUser.role || 'provider';

      // Mark all incoming as read and persist readBy so sender's icon loses the !
      // The parent (WeekView) DOES update appt prop when onUpdate fires, so the
      // appt.comms base in sendComment will stay current. But we also sync local
      // comms state for safety (in case a send fires before the prop cycles).
      React.useEffect(() => {
        markCommsReadPersist(appt, (u) => {
          setComms(u.comms || []);
          if (onUpdate) onUpdate(u);
        });
      }, []);

      // Auto-scroll comment list to bottom when new comments arrive
      React.useEffect(() => {
        if (commListRef.current) {

      function sendComment() {
        if (!commNote.trim()) return;
        const nc = buildComment(commNote, commTo);
        // Use appt.comms (prop) as the base when it is current or ahead of local state —
        // it carries readBy updates from markCommsReadPersist so those aren't overwritten.
        // Fall back to local comms if local state has more entries (user sent multiple

        // Send is FINAL — persist immediately without closing modal

                  </div>
                  <div className="pam-comm-input">
                    <select
                      className="pam-to-select"
                      value={commTo}

                    >
                      {toOptions.map(o => <option key={o.v} value={o.v}>{o.l}</option>)}
                    </select>
                    <input
                      className="fi" style={{ flex: 1 }}

              {/* ── Section 1b: Screener Results (read-only, from assistant) ── */}

                            return (

                      ) : null}
                      {appt.scrNote ? (
                        <div style={{ marginTop: anyData ? 6 : 0, background: '#F7F5ED', borderRadius: 7, padding: '8px 11px', fontSize: 12.5, color: '#1a1a1a', lineHeight: 1.55, borderLeft: '3px solid #09371F', whiteSpace: 'pre-wrap' }}>

                          <span style={{ fontSize: 10, fontWeight: 900, textTransform: 'uppercase', letterSpacing: .5, color: '#92400e', display: 'block', marginBottom: 3 }}>⚠️ Issue Notes</span>
                          {appt.checklistNote}
                        </div>
                      ) : null}
                    </div>
                  </div>
                );
              })()}

              {/* ── Section 2: Rx ── */}
              <div className="pam-section">
                <div className="pam-sec-hdr rx-hdr">
                  💊 Controlled Substances Prescribed
                  {rxMeds.length > 0 && <span style={{ background: '#F2EDDB', color: '#09371F', borderRadius: 20, padding: '1px 8px', fontSize: 10, fontWeight: 900 }}>{rxMeds.length}</span>}
                </div>
                <div className="pam-sec-body">

                    }

                    {rxMeds.length > 0 ? '✎ Edit Rx' : '+ Add Rx'}

              </div>

              {/* ── Section 3: CPT Codes ── */}
              <div className="pam-section">
                <div className="pam-sec-hdr cpt-hdr">
                  📋 CPT Codes
                  {normCpt(cpt).length > 0 && <span style={{ background: '#fff', color: '#1C6FA3', borderRadius: 0, padding: '1px 8px', fontSize: 10, fontWeight: 900 }}>{normCpt(cpt).length}</span>}

          {rxModal && <RxMedModal appt={{ ...appt, rxMeds }} onSave={meds => { setRxMeds(meds); setRxModal(false); }} onClose={() => setRxModal(false)} />}
          {cptModal && <CPTModal appt={{ ...appt, cpt }} onSave={codes => { setCpt(codes); setCptModal(false); }} onClose={() => setCptModal(false)} />}

          .catch(() => { setRows([]); setLoading(false); });

      function cycleStatus(row) {
        if (!canEdit) return;
        const cur = localNs[row.id] !== undefined ? localNs[row.id] : (row.noteStatus || '');
        const next = NS_CYCLE[(NS_CYCLE.indexOf(cur) + 1) % NS_CYCLE.length];

              </select>
              {!provFilter && (
                <select className="nb-filter-sel" value={provFilterLocal} onChange={e => setProvFilterLocal(e.target.value)}>

                </select>
              )}
              <select className="nb-filter-sel" value={signedFilter} onChange={e => setSignedFilter(e.target.value)}>
                <option value="">Signed + Unsigned</option>
                <option value="signed">✓ Signed only</option>
                <option value="unsigned">Unsigned only</option>
              </select>
              <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 8 }}>
                {canEdit
                  ? <span className="nb-role-tag">✏ Assistant — can update</span>

                <div key={ds} className="nb-date-group">

                    const ns = localNs[row.id] !== undefined ? localNs[row.id] : (row.noteStatus || '');
