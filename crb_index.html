    function PSearchResult({ r, active, onPick }) {
      const prov = PROVIDERS.find(p => p.id === r.provID);
      const provName = prov ? prov.name.split(' ').slice(-1)[0] : r.provID;
      const isToday = r.date === TODAY;
      const isPast = r.date < TODAY;
      const sCls = r.status === 'valid' ? 'ok' : r.status === 'issue' ? 'err' : 'pend';
      const sColor = { ok: '#16a34a', err: '#dc2626', pend: '#BE992A' }[sCls];
      const sLabel = { ok: '● Valid', err: '● Issue', pend: '● In Process' }[sCls];
      return (
        <div className={`psearch-result ${isPast ? 'psearch-past' : ''} ${active ? 'psr-active' : ''}`}
          onClick={() => onPick(r)}>
          <div className="psearch-date-col">
            {fmtDate(r.date)}
            {isToday && <span className="psearch-today-tag">TODAY</span>}
          </div>
          <div className="psearch-meta">
            <span className="psearch-time">{fmtTime(r.time)}</span>
            <span className="psearch-prov">{provName}</span>
            {r.method && <span className="psearch-meth">{METHOD_LABEL[r.method] || r.method}</span>}
            <span style={{ fontSize: 10, fontWeight: 700, color: sColor }}>{sLabel}</span>
            {r.out && <span className="psearch-signed">✓ Signed</span>}
          </div>
        </div>
      );
    }

    function GlobalSearch({ onNavigate }) {
      const [query, setQuery] = useState('');
      const [results, setResults] = useState([]);
      const [loading, setLoading] = useState(false);
      const [open, setOpen] = useState(false);
      const [active, setActive] = useState(-1);
      const debounceRef = useRef(null);
      const inputRef = useRef(null);
      const wrapRef = useRef(null);

      useEffect(() => {
        const q = query.trim();
        if (q.length < 2) { setResults([]); setOpen(false); return; }
        clearTimeout(debounceRef.current);
        debounceRef.current = setTimeout(() => {
          setLoading(true);
          gsr('searchPatient', q)
            .then(json => {
              try {
                const r = JSON.parse(json);
                if (Array.isArray(r)) { setResults(r); setOpen(true); setActive(-1); }
              } catch (e) { }
              setLoading(false);
            })
            .catch(() => setLoading(false));
        }, 350);
        return () => clearTimeout(debounceRef.current);
      }, [query]);

      useEffect(() => {
        function handler(e) {
          if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false);
        }
        document.addEventListener('mousedown', handler);
        return () => document.removeEventListener('mousedown', handler);
      }, []);

      function onKey(e) {
        if (e.key === 'Escape') { setOpen(false); inputRef.current?.blur(); return; }
        if (!open || !results.length) return;
        if (e.key === 'ArrowDown') { e.preventDefault(); setActive(a => Math.min(a + 1, results.length - 1)); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(a => Math.max(a - 1, -1)); }
        else if (e.key === 'Enter' && active >= 0) pick(results[active]);
      }

      function pick(r) {
        onNavigate(r.date, r.provID);
        setQuery(''); setResults([]); setOpen(false); setActive(-1);
      }

      function clear() {
        setQuery(''); setResults([]); setOpen(false);
        inputRef.current?.focus();
      }

      const today = TODAY;
      const grouped = [];
      let flatIndex = 0;
      const seen = {};
      results.forEach(r => { if (!seen[r.patient]) { seen[r.patient] = []; grouped.push({ name: r.patient, rows: seen[r.patient] }); } seen[r.patient].push(r); });

      return (
        <div ref={wrapRef} className="psearch-wrap">
          <div className="psearch-row">
            <span className="psearch-icon">🔍</span>
            <input
              ref={inputRef}
              className="psearch-input"
              value={query}
              onChange={e => setQuery(e.target.value)}
              onKeyDown={onKey}
              onFocus={() => { if (query.trim().length >= 2 && results.length) setOpen(true); }}
              placeholder="Search patient…"
              autoComplete="off"
            />
            {loading && <span className="psearch-spin" />}
            {query && !loading && <button className="psearch-clear" onClick={clear}>×</button>}
          </div>

          {open && (
            <div className="psearch-drop">
              {results.length === 0 && !loading && (
                <div className="psearch-empty">No appointments found for "{query}"</div>
              )}
              {grouped.map(group => {
                const upcoming = group.rows.filter(r => r.date >= today);
                const past = group.rows.filter(r => r.date < today);
                return (
                  <div key={group.name}>
                    <div className="psearch-group-hd">
                      <span className="psearch-group-name">{group.name}</span>
                      <span className="psearch-group-count">{group.rows.length} appt{group.rows.length !== 1 ? 's' : ''}</span>
                    </div>
                    {upcoming.length > 0 && (
                      <>
                        <div className="psearch-section-lbl">Upcoming ({upcoming.length})</div>
                        {upcoming.map(r => {
                          const idx = flatIndex++;
                          return <PSearchResult key={r.date + r.time + r.provID} r={r} active={active === idx} onPick={pick} />;
                        })}
                      </>
                    )}
                    {past.length > 0 && (
                      <>
                        <div className="psearch-section-lbl">Past ({past.length})</div>
                        {past.map(r => {
                          const idx = flatIndex++;
                          return <PSearchResult key={r.date + r.time + r.provID} r={r} active={active === idx} onPick={pick} />;
                        })}
                      </>
                    )}
                  </div>
                );
              })}
              {results.length > 0 && (
                <div className="psearch-footer">↑↓ navigate · Enter to jump · Esc to close</div>
              )}
            </div>
          )}
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════════
       APP
    ═══════════════════════════════════════════════════════════ */
    function App() {
      const [data, setData] = useState({});
      const [patientDb, setPatientDb] = useState([]);
      const [providerCounts, setProviderCounts] = useState({});
      const [currentUser, setCurrentUser] = useState('');
      const [logoSrc, setLogoSrc] = useState(EMBEDDED_LOGO);
      const [userRole, setUserRole] = useState('');
      const [userProvID, setUserProvID] = useState('');
      const [userDisplay, setUserDisplay] = useState('');
      const [prov, setProv] = useState('jodene');
      const [date, setDate] = useState(TODAY);
      const [view, setView] = useState('provider');
      const [period, setPeriod] = useState('day');

      const [initLoading, setInitLoading] = useState(true);
      const [initErr, setInitErr] = useState('');
      const [apptLoading, setApptLoading] = useState(false);
      const [saveStatus, setSaveStatus] = useState('idle');
      // ── Per-appointment save queue (race-condition guardrail) ──
      // saveAppointment (full-row overwrite) and signNoteAndClearUnsigned
      // (surgical field update) are separate backend calls. If two of them
      // for the SAME appointment are ever in flight at once — e.g. a notes
      // autosave-on-blur still finishing when "Mark Note Signed" is clicked
      // right after — whichever one's network round-trip happens to land
      // LAST wins, and if that one is a full-row overwrite built from a
      // snapshot taken before the other change, it silently clobbers it.
      // This queue forces every save for a given appointment ID to run
      // strictly in the order it was REQUESTED, not the order it happens to
      // finish, so this class of bug can't occur no matter which button
      // triggered it. See queueApptSave() below, used by persistAppt() and
      // signNote().
      const pendingSaveRef = useRef({});
      function queueApptSave(apptId, run) {
        const key = String(apptId);
        const prior = pendingSaveRef.current[key] || Promise.resolve();
        const next = prior.then(run, run); // run regardless of the prior save's outcome
        pendingSaveRef.current[key] = next;
        return next;
      }
      const [calOpen, setCalOpen] = useState(false);
      const [editing, setEditing] = useState(false);
      const [dateInput, setDateInput] = useState('');
      const [refreshTick, setRefreshTick] = useState(0);
      const [tebraSync, setTebraSync] = useState('idle');
      const [tebraMsg, setTebraMsg] = useState('');
      const [fullTebraSync, setFullTebraSync] = useState('idle');   // 'idle'|'syncing'|'done'|'error'
      const [fullTebraMsg, setFullTebraMsg] = useState('');
      const [tebraApiOn, setTebraApiOn] = useState(true);   // mirrors TEBRA_API_ENABLED Script Property
      const [tebraApiToggling, setTebraApiToggling] = useState(false);

      // ── Admin menu (Billing view only) — combines API toggle, Sync Tebra,
      // and Full Sync under one dropdown so the main header stays clean.
      const [adminOpen, setAdminOpen] = useState(false);
      const adminMenuRef = useRef(null);
      useEffect(() => {
        function handler(e) {
          if (adminMenuRef.current && !adminMenuRef.current.contains(e.target)) setAdminOpen(false);
        }
        document.addEventListener('mousedown', handler);
        return () => document.removeEventListener('mousedown', handler);
      }, []);

      // ── Mobile header layout switch ──
      // The phone header is a genuinely different arrangement (a 4-row
      // grid), not just a reflowed version of the desktop one, so it's
      // rendered from separate JSX below rather than fought into shape with
      // CSS wrapping. Same 768px breakpoint the rest of the app already uses.
      const [isMobile, setIsMobile] = useState(() => window.innerWidth <= 768);
      useEffect(() => {
        function onResize() { setIsMobile(window.innerWidth <= 768); }
        window.addEventListener('resize', onResize);
        return () => window.removeEventListener('resize', onResize);
      }, []);

      // ── Mobile "More" drawer ──
      // Search / provider picker / refresh / theme / admin all move into
      // this collapsible drawer on phone so the always-visible header stays
      // to 2 tight rows instead of stacking every control permanently.
      const [mobileMoreOpen, setMobileMoreOpen] = useState(false);
      const mobileDrawerRef = useRef(null);
      useEffect(() => {
        function handler(e) {
          if (mobileDrawerRef.current && !mobileDrawerRef.current.contains(e.target)
            && !e.target.closest('.hdr-mobile-more-btn')) setMobileMoreOpen(false);
        }
        document.addEventListener('mousedown', handler);
        return () => document.removeEventListener('mousedown', handler);
      }, []);

      // ── Theme (light / dark) ──────────────────────────────────
      const [theme, setTheme] = useState(() => {
        try { return localStorage.getItem('crb-theme') || 'light'; } catch { return 'light'; }
      });
      useEffect(() => {
        document.body.classList.toggle('dark', theme === 'dark');
        try { localStorage.setItem('crb-theme', theme); } catch { }
      }, [theme]);

      // ── Guardrail: warn before closing/refreshing/navigating away mid-save ──
      // This only catches actual browser-level navigation (tab close, refresh,
      // typing a new URL) — it can't catch in-app navigation like switching to
      // a different appointment, since that never fires a real browser
      // navigation event. In-app moves are safe on their own: every save call
      // (google.script.run) keeps running in the background independent of
      // which screen is currently showing, and the CPT-save/sign-note race
      // that caused silently-lost signed statuses is now fixed at the source
      // (see saveCpt in ProviderView) — this listener is a second, belt-and-
      // suspenders layer specifically for the "actually left the page" case.
      useEffect(() => {
        function handleBeforeUnload(e) {
          if (saveStatus === 'saving') {
            e.preventDefault();
            e.returnValue = '';
            return '';
          }
        }
        window.addEventListener('beforeunload', handleBeforeUnload);
        return () => window.removeEventListener('beforeunload', handleBeforeUnload);
      }, [saveStatus]);
      const [allWeekData, setAllWeekData] = useState({});

      // ── Cumulative unsigned notes count for the current provider ──
      const [totalUnsigned, setTotalUnsigned] = useState(null); // null = not yet loaded

      // ── Refresh patientDb after a save so the next modal open shows current values ──
      function refreshPatientDb() {
        if (!IS_GAS) return;
        gsr('getPatients').then(pJson => {
          try { const pts = JSON.parse(pJson); if (Array.isArray(pts)) setPatientDb(pts); } catch (e) { }
        }).catch(() => { });

        gsr('getPatientCountsByProvider').then(countsJson => {
          try { const counts = JSON.parse(countsJson); if (counts && typeof counts === 'object') setProviderCounts(counts); } catch (e) { }
        }).catch(() => { });
      }

      // ── Load Tebra API enabled status on mount ─────────────────────────────
      function loadTebraApiStatus() {
        if (!IS_GAS) return;
        gsr('getTebraApiStatus').then(json => {
          try { const r = JSON.parse(json); setTebraApiOn(!!r.enabled); } catch (e) { }
        }).catch(() => { });
      }

      // ── Toggle Tebra API on/off ────────────────────────────────────────────
      function toggleTebraApi() {
        if (tebraApiToggling) return;
        const next = !tebraApiOn;
        setTebraApiToggling(true);
        gsr('setTebraApiEnabled', next).then(json => {
          try { const r = JSON.parse(json); setTebraApiOn(!!r.enabled); } catch (e) { }
          setTebraApiToggling(false);
        }).catch(() => setTebraApiToggling(false));
      }

      const fetchedRef = useRef(new Set());
      const editingRef = useRef(false);

      // Keep editingRef in sync with editing state so the interval
      // callback always sees the current value without a stale closure.
      useEffect(() => { editingRef.current = editing; }, [editing]);

      useEffect(() => {
        if (!IS_GAS || initLoading) return;
        const id = setInterval(() => {
          // Block refresh whenever any modal / overlay is open
          if (document.querySelector('.overlay, .cal-overlay')) return;
          // Block refresh while the user is actively editing the date field
          if (editingRef.current) return;
          // Block refresh while any form element has keyboard focus
          const tag = document.activeElement && document.activeElement.tagName;
          if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
          // Block refresh while focus is inside any contentEditable element
          if (document.activeElement && document.activeElement.isContentEditable) return;
          const k = period === 'week'
            ? (view === 'provider' ? `week:${prov}:${weekStart(date)}` : `allweek:${weekStart(date)}`)
            : dkey(prov, date);
          fetchedRef.current.delete(k);
          setRefreshTick(t => t + 1);
        }, 900000);   // 15 minutes
        return () => clearInterval(id);
      }, [initLoading, prov, date, period]);

      useEffect(() => {
        if (!IS_GAS) {
          setInitErr('This tool must be opened via its Google Apps Script URL. It cannot run as a standalone HTML file.');
          setInitLoading(false);
          return;
        }
        Promise.all([
          gsr('getCurrentUserWithRole').catch(() => JSON.stringify({ email: '', role: 'unknown', provID: '', displayName: '' })),
          gsr('getPatients'),
          gsr('getPatientCountsByProvider').catch(() => JSON.stringify({})),
        ]).then(([roleJson, pJson, countsJson]) => {
          try {
            const ud = JSON.parse(roleJson);
            setCurrentUser(ud.email || '');
            setUserRole(ud.role || 'unknown');
            setUserDisplay(ud.displayName || '');
            _crbUser = { display: ud.displayName || '', email: ud.email || '', role: ud.role || '' };
            if (ud.role === 'provider' && ud.provID) {
              setUserProvID(ud.provID);
              setProv(ud.provID);
              setView('provider');
            } else if (ud.role === 'biller') {
              setView('billing');
            } else if (ud.role === 'assistant') {
              setView('assistant');
            }
          } catch (e) { setUserRole('unknown'); }
          try { const pts = JSON.parse(pJson); if (Array.isArray(pts)) setPatientDb(pts); } catch (e) { }
          try { const counts = JSON.parse(countsJson); if (counts && typeof counts === 'object') setProviderCounts(counts); } catch (e) { }
          setInitLoading(false);
          loadTebraApiStatus(); // load API on/off state after init
        }).catch(err => {
          setInitErr('Could not connect to Google Sheets. Make sure you\'re logged into your Solrei Google account. (' + err.message + ')');
          setInitLoading(false);
        });
      }, []);

      // ── Fetch cumulative unsigned notes total when provider changes ──
      useEffect(() => {
        if (initLoading || !IS_GAS || !prov) return;
        setTotalUnsigned(null); // reset while loading
        gsr('getTotalUnsignedCount', prov)
          .then(json => {
            try { const r = JSON.parse(json); setTotalUnsigned(typeof r.count === 'number' ? r.count : null); }
            catch (e) { setTotalUnsigned(null); }
          })
          .catch(() => setTotalUnsigned(null));
      }, [prov, initLoading]);

      useEffect(() => {
        if (initLoading || !IS_GAS) return;
        if (period === 'week') return;
        const k = dkey(prov, date);
        if (fetchedRef.current.has(k)) return;
        // Only show the loading spinner on the FIRST load for this date+prov.
        // Background refreshes (auto-refresh, re-sync) update silently so that
        // open panels like Rate Analysis are not dismissed by the re-mount.
        const isFirstLoad = !data[k];
        fetchedRef.current.add(k);
        if (isFirstLoad) setApptLoading(true);
        gsr('getAppointments', prov, date)
          .then(json => {
            try { const a = JSON.parse(json); if (Array.isArray(a)) setData(p => ({ ...p, [k]: a })); } catch (e) { }
            setApptLoading(false);
          })
          .catch(() => setApptLoading(false));
      }, [prov, date, period, initLoading, refreshTick]);

      useEffect(() => {
        if (initLoading || !IS_GAS || period !== 'week') return;
        const ws = weekStart(date);
        const cacheKey = `week:${prov}:${ws}`;
        if (fetchedRef.current.has(cacheKey)) return;
        fetchedRef.current.add(cacheKey);
        setApptLoading(true);
        gsr('getWeekAppointments', prov, ws)
          .then(json => {
            try { const wd = JSON.parse(json); if (wd && !wd.error) setData(p => ({ ...p, ...wd })); } catch (e) { }
            setApptLoading(false);
          })
          .catch(() => setApptLoading(false));
      }, [prov, date, period, initLoading, refreshTick]);

      useEffect(() => {
        if (initLoading || !IS_GAS || period !== 'week' || view === 'provider') return;
        const ws = weekStart(date);
        const cacheKey = `allweek:${ws}`;
        if (fetchedRef.current.has(cacheKey)) return;
        fetchedRef.current.add(cacheKey);
        setApptLoading(true);
        gsr('getAllWeekAppointments', ws)
          .then(json => {
            try { const wd = JSON.parse(json); if (wd && !wd.error) setAllWeekData(p => ({ ...p, ...wd })); } catch (e) { }
            setApptLoading(false);
          })
          .catch(() => setApptLoading(false));
      }, [view, date, period, initLoading, refreshTick]);

      // ===== Sticky header sync =====
      // Dynamically matches every view's sticky "frozen stack" offsets to the
      // main header's ACTUAL rendered height (read via offsetHeight) instead of
      // hand-tuned pixel guesses — this is what keeps every frozen bar gap-free
      // and correctly stacked on both desktop and a narrow phone (where .hdr
      // wraps onto 2-3 rows and its height isn't a fixed 58px anymore).
      // Each view's chain sticks in the same order it renders in the DOM:
      //   Week views:    .hdr -> .wk-week-label -> .wk-grid > .wk-col-hd
      //   Provider Day:  .hdr -> .summary-row -> .pv-tabs
      //   Assistant Day: .hdr -> .tbl-hd -> .asst-hd-sticky
      //   Billing Day:   .hdr -> .billing-frozen-header (single self-contained unit)
      useEffect(() => {
        function syncStickyTop() {
          const header = document.querySelector('.hdr');
          if (!header) return;
          const headerH = header.offsetHeight;

          // Week views (Provider / Assistant / Billing week grids)
          const weekLabel = document.querySelector('.wk-week-label');
          if (weekLabel) weekLabel.style.top = headerH + 'px';
          const afterWeekLabel = (headerH + (weekLabel ? weekLabel.offsetHeight : 0)) + 'px';
          const weekHdr = document.querySelector('.wk-hdr-row'); // legacy, kept for any residual markup
          if (weekHdr) weekHdr.style.top = afterWeekLabel;
          document.querySelectorAll('.wk-grid > .wk-col-hd').forEach(el => { el.style.top = afterWeekLabel; });

          // Provider Day — Summary stat row, then Pre-visit/Post-visit tabs
          const summaryRow = document.querySelector('.summary-row');
          if (summaryRow) summaryRow.style.top = headerH + 'px';
          const pvTabs = document.querySelector('.pv-tabs');
          if (pvTabs) pvTabs.style.top = (headerH + (summaryRow ? summaryRow.offsetHeight : 0)) + 'px';

          // Assistant Day — title bar, then the standalone TIME/METHOD/BILLING…
          // column-header banner (.asst-hd-sticky — a plain sticky div now,
          // not a sticky <thead>/<th>, see AssistantView).
          const tblHd = document.querySelector('.tbl-hd');
          if (tblHd) tblHd.style.top = headerH + 'px';
          const asstHd = document.querySelector('.asst-hd-sticky');
          if (asstHd) asstHd.style.top = (headerH + (tblHd ? tblHd.offsetHeight : 0)) + 'px';

          // Billing Day — Date + Direct-Pay + Claims info, frozen as one unit
          const billingHeader = document.querySelector('.billing-frozen-header');
          if (billingHeader) billingHeader.style.top = headerH + 'px';
        }

        // Run after render (slight delay lets layout settle), then re-check a
        // couple more times shortly after — the web font (Wix Madefor
        // Display) loads asynchronously, and if it swaps in AFTER this first
        // measurement, .hdr's rendered height (and therefore every offset
        // below it) can shift without a resize event firing. These follow-up
        // passes catch that late reflow instead of leaving stale pixel
        // offsets baked into inline styles.
        const t0 = setTimeout(syncStickyTop, 0);
        const t1 = setTimeout(syncStickyTop, 150);
        const t2 = setTimeout(syncStickyTop, 500);
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(syncStickyTop).catch(() => { });
        }

        // Re-run on window resize
        window.addEventListener('resize', syncStickyTop);

        // Watch the header AND every "first link in the chain" bar for size
        // changes — not just window resize. .summary-row's height changes when
        // Pre-visit/Post-visit toggles (different stat sets, no window resize
        // fires), so without observing it directly, .pv-tabs could drift out of
        // alignment after switching modes. Also watch .view-tabs directly (it's
        // the piece of .hdr most likely to wrap onto its own line and change
        // .hdr's total height). The Assistant column header itself no longer
        // needs to be watched here — AssistantView measures and re-syncs its
        // own column widths independently (see colWidths in AssistantView).
        let observer;
        if (window.ResizeObserver) {
          observer = new ResizeObserver(syncStickyTop);
          ['.hdr', '.summary-row', '.tbl-hd', '.wk-week-label', '.view-tabs'].forEach(sel => {
            const el = document.querySelector(sel);
            if (el) observer.observe(el);
          });
        }

        // Cleanup
        return () => {
          clearTimeout(t0);
          clearTimeout(t1);
          clearTimeout(t2);
          window.removeEventListener('resize', syncStickyTop);
          if (observer) observer.disconnect();
        };
      }, [view, period, date, initLoading, apptLoading]);

      function refreshPatients() {
        gsr('getPatients').then(json => {
          try { const pts = JSON.parse(json); if (Array.isArray(pts)) setPatientDb(pts); } catch (e) { }
        });

        gsr('getPatientCountsByProvider').then(countsJson => {
          try { const counts = JSON.parse(countsJson); if (counts && typeof counts === 'object') setProviderCounts(counts); } catch (e) { }
        }).catch(() => { });
      }

      function persistAppt(k, updated) {
        const [pr, dt] = k.split('||');
        // When viewing all-providers (prov=""), the key has no provider segment.
        // Fall back to the appointment's own provID so GAS doesn't corrupt col A.
        const effectivePr = pr || (updated && updated.provID) || '';
        setSaveStatus('saving');
        // Returned so callers that need to SEQUENCE a follow-up save (e.g. the
        // CPT-save → auto-sign-note flow in ProviderView.saveCpt) can await
        // this write finishing before firing a second one. Also queued
        // per-appointment (see queueApptSave above) so it can't land out of
        // order relative to any OTHER pending save for the same appointment,
        // regardless of which UI action triggered either one.
        return queueApptSave(updated && updated.id, () =>
          gsr('saveAppointment', effectivePr, dt, JSON.stringify(updated))
            .then(raw => {
              try {
                const r = raw ? JSON.parse(raw) : {};
                if (r && r.error) {
                  console.error('[CRB] saveAppointment error:', r.error, '| prov:', pr, '| date:', dt, '| id:', updated && updated.id);
                  setSaveStatus('error');
                  return;
                }
              } catch (e) { /* non-JSON response — treat as ok */ }
              setSaveStatus('saved');
              setTimeout(() => setSaveStatus('idle'), 2200);
            })
            .catch(err => {
              console.error('[CRB] saveAppointment GAS failure:', err);
              setSaveStatus('error');
            })
        );
      }

      const key = dkey(prov, date);
      const appts = data[key] || [];

      // Force-refresh the current day from GAS (used by ProviderView when opening PatientInfoModal)
      function forceRefreshDay() {
        fetchedRef.current.delete(key);
        setRefreshTick(t => t + 1);
      }

      function updateAppt(updated) {
        // 1. Patch the day/provider-week cache (data)
        setData(p => ({ ...p, [key]: (p[key] || []).map(a => a.id === updated.id ? updated : a) }));

        // 2. Patch allWeekData (assistant/billing week cache) so the week view
        //    immediately reflects the save without needing a full reload.
        //    allWeekData is keyed by date string (YYYY-MM-DD); find the right day.
        setAllWeekData(prev => {
          const ds = updated.date;                         // YYYY-MM-DD from the appt object
          if (!ds || !prev[ds]) return prev;               // week not loaded — nothing to patch
          const dayAppts = prev[ds];
          const idx = dayAppts.findIndex(a => a.id === updated.id);
          if (idx === -1) return prev;                     // appt not in week cache
          const newDay = dayAppts.slice();
          newDay[idx] = { ...updated, provID: dayAppts[idx].provID }; // preserve provID
          return { ...prev, [ds]: newDay };
        });

        return persistAppt(key, updated);
      }

      /* ────────────────────────────────────────────────────────
         NOTE SIGNED  (fully rewritten — bulletproof banner clearing)
         1. OPTIMISTIC UPDATE
            For the signed appt:
              out = true
              unsigned = unsigned.filter(u => toISO(u) !== signedISO)
            For every other loaded appt belonging to the same patient
            (name normalized: trim + lowercase + collapse whitespace):
              unsigned = unsigned.filter(u => toISO(u) !== signedISO)
            Applies to BOTH `data` and `allWeekData`.
         2. BACKEND CALL
            signNoteAndClearUnsigned() scans every row in the sheet and
            returns { affected: [{ apptId, date, unsigned:[...] }] } so
            we can sync the authoritative list back into our caches.
         3. CACHE CLEAR
            After the backend confirms, clear fetchedRef entirely so any
            future navigation re-fetches fresh data (belt and suspenders).
      ──────────────────────────────────────────────────────── */
      function signNote(appt) {
        // ── Stale-closure fix: require appt.date, no fallback to outer `date` ──
        const signedISOraw = appt.date;
        if (!signedISOraw) {
          console.warn('signNote called without appt.date', appt);
          return;
        }
        const signedISO = unsignedToISO(signedISOraw) || signedISOraw;
        const patientN = normName(appt.patient);
        if (!patientN || !signedISO) return;

        function matches(u) {
          const uIso = unsignedToISO(u);
          return uIso !== null && uIso === signedISO;
        }

        // ── Rollback snapshots: captured inside the updater so we grab
        //    the exact prev state React hands us, not a stale outer ref ──
        let rollbackData = null;
        let rollbackAllWeek = null;

        // ── 1. Optimistic update: data (day + provider week caches) ──
        setData(prev => {
          rollbackData = prev;                          // ← snapshot here
          const next = {};
          Object.keys(prev).forEach(k => {
            if (!Array.isArray(prev[k])) { next[k] = prev[k]; return; }
            let changed = false;
            const updated = prev[k].map(a => {
              if (a.id === appt.id) {
                changed = true;
                const filtered = Array.isArray(a.unsigned) ? a.unsigned.filter(u => !matches(u)) : [];
                return { ...a, out: true, unsigned: filtered };
              }
              if (a.patient && normName(a.patient) === patientN &&
                Array.isArray(a.unsigned) && a.unsigned.some(matches)) {
                changed = true;
                return { ...a, unsigned: a.unsigned.filter(u => !matches(u)) };
              }
              return a;
            });
            next[k] = changed ? updated : prev[k];
          });
          return next;
        });

        // ── 1b. Optimistic update: allWeekData (assistant/billing week) ──
        setAllWeekData(prev => {
          rollbackAllWeek = prev;                       // ← snapshot here
          const next = {};
          Object.keys(prev).forEach(ds => {
            if (!Array.isArray(prev[ds])) { next[ds] = prev[ds]; return; }
            let changed = false;
            const updated = prev[ds].map(a => {
              if (a.id === appt.id) {
                changed = true;
                const filtered = Array.isArray(a.unsigned) ? a.unsigned.filter(u => !matches(u)) : [];
                return { ...a, out: true, unsigned: filtered };
              }
              if (a.patient && normName(a.patient) === patientN &&
                Array.isArray(a.unsigned) && a.unsigned.some(matches)) {
                changed = true;
                return { ...a, unsigned: a.unsigned.filter(u => !matches(u)) };
              }
              return a;
            });
            next[ds] = changed ? updated : prev[ds];
          });
          return next;
        });

        // ── 1c. Optimistic decrement of the cumulative unsigned total ──
        let prevTotalUnsigned = null;
        setTotalUnsigned(prev => { prevTotalUnsigned = prev; return prev !== null ? Math.max(0, prev - 1) : prev; });

        // ── Helper: restore both caches on failure ──
        function rollback() {
          if (rollbackData) setData(rollbackData);
          if (rollbackAllWeek) setAllWeekData(rollbackAllWeek);
          if (prevTotalUnsigned !== null) setTotalUnsigned(prevTotalUnsigned);
        }

        // ── 2. Backend: scans the ENTIRE sheet ──────────────────
        // Queued per-appointment (see queueApptSave above) so this can't
        // land out of order relative to a saveAppointment call for the same
        // appointment that's still in flight (e.g. a notes autosave that
        // fired just before this button was clicked).
        setSaveStatus('saving');
        return queueApptSave(appt.id, () =>
          gsr('signNoteAndClearUnsigned', appt.id, signedISO, appt.patient)
            .then(raw => {
              let res = {};
              try { res = JSON.parse(raw); } catch (e) { }

              // Server returned an error → undo optimistic update
              if (!res || res.ok === false || res.error) {
                rollback();
                setSaveStatus('error');
                setTimeout(() => setSaveStatus('idle'), 3000);
                return;
              }

              // Merge authoritative affected[] list into our caches.
              if (res && Array.isArray(res.affected) && res.affected.length) {
                const byId = {};
                res.affected.forEach(a => { byId[String(a.apptId)] = a.unsigned || []; });

                setData(prev => {
                  const next = {};
                  Object.keys(prev).forEach(k => {
                    if (!Array.isArray(prev[k])) { next[k] = prev[k]; return; }
                    let changed = false;
                    const updated = prev[k].map(a => {
                      if (byId[String(a.id)]) { changed = true; return { ...a, unsigned: byId[String(a.id)] }; }
                      return a;
                    });
                    next[k] = changed ? updated : prev[k];
                  });
                  return next;
                });
                setAllWeekData(prev => {
                  const next = {};
                  Object.keys(prev).forEach(ds => {
                    if (!Array.isArray(prev[ds])) { next[ds] = prev[ds]; return; }
                    let changed = false;
                    const updated = prev[ds].map(a => {
                      if (byId[String(a.id)]) { changed = true; return { ...a, unsigned: byId[String(a.id)] }; }
                      return a;
                    });
                    next[ds] = changed ? updated : prev[ds];
                  });
                  return next;
                });
              }

              setSaveStatus('saved');
              setTimeout(() => setSaveStatus('idle'), 2200);

              // ── 3. Belt-and-suspenders cache clear ──
              fetchedRef.current.clear();
            })
            .catch(() => {
              // Network/transport failure → undo optimistic update
              rollback();
              setSaveStatus('error');
              setTimeout(() => setSaveStatus('idle'), 3000);
            })
        );
      }

      /**
       * Clears a phantom / ghost unsigned date from a patient's records.
       * Called when the provider clicks ✕ on a date pill they know is wrong.
       * The backend verifies the patient has NO real appointment on that date
       * before erasing it — so this can never accidentally dismiss a real note.
       */
      function clearPhantom(appt, rawDate) {
        const dateISO = unsignedToISO(rawDate) || rawDate;
        if (!dateISO) return;

        // Optimistic: remove this date from every cached row for this patient
        const patN = normName(appt.patient);
        function removeDate(arr) {
          return arr.map(a => {
            if (!a.patient || normName(a.patient) !== patN) return a;
            if (!Array.isArray(a.unsigned) || !a.unsigned.some(u => unsignedToISO(u) === dateISO)) return a;
            return { ...a, unsigned: a.unsigned.filter(u => unsignedToISO(u) !== dateISO) };
          });
        }
        setData(prev => {
          const next = {};
          Object.keys(prev).forEach(k => {
            next[k] = Array.isArray(prev[k]) ? removeDate(prev[k]) : prev[k];
          });
          return next;
        });

        // Backend call — safe even with same-name patients
        gsr('clearPhantomUnsignedDate', appt.id, rawDate)
          .then(raw => {
            let res = {};
            try { res = JSON.parse(raw); } catch (e) { }
            if (res && res.ok) {
              // Bust cache so next navigation re-fetches clean data
              fetchedRef.current.delete(dkey(prov, date));
              setRefreshTick(t => t + 1);
            } else {
              // Silently log — optimistic update stays but a refresh will correct it
              console.warn('clearPhantomUnsignedDate:', res && res.error);
            }
          })
          .catch(e => console.warn('clearPhantomUnsignedDate network error', e));
      }

      function updateApptForDate(ds, updated) {
        const k = dkey(prov, ds);
        // Patch day/provider-week cache
        setData(p => ({ ...p, [k]: (p[k] || []).map(a => a.id === updated.id ? updated : a) }));
        // Patch assistant/billing week cache (allWeekData keyed by date string)
        setAllWeekData(prev => {
          if (!prev[ds]) return prev;
          const dayAppts = prev[ds];
          const idx = dayAppts.findIndex(a => a.id === updated.id);
          if (idx === -1) return prev;
          const newDay = dayAppts.slice();
          newDay[idx] = { ...updated, provID: dayAppts[idx].provID };
          return { ...prev, [ds]: newDay };
        });
        persistAppt(k, updated);
      }
      function addAppt(a) {
        setData(p => ({ ...p, [key]: [...(p[key] || []), a] }));
        persistAppt(key, a);
      }
      function deleteAppt(apptId) {
        setData(p => {
          const next = { ...p };
          Object.keys(next).forEach(k => { if (Array.isArray(next[k])) next[k] = next[k].filter(a => a.id !== apptId); });
          return next;
        });
        setSaveStatus('saving');
        gsr('deleteAppointment', apptId)
          .then(() => { setSaveStatus('saved'); setTimeout(() => setSaveStatus('idle'), 2200); })
          .catch(() => setSaveStatus('error'));
      }
      function deleteApptForDate(ds, apptId) { deleteAppt(apptId); }

      function syncFromTebra() {
        var startStr, endStr;
        if (period === 'week') {
          startStr = weekStart(date);
          const ws = _parseYMDjs(startStr);
          // Cover the displayed week PLUS the following week (13 days total Mon→Sun×2)
          // so new patients scheduled next week are always caught by the sync.
          const we = new Date(ws); we.setDate(ws.getDate() + 13);
          endStr = fmtYMD(we.getFullYear(), we.getMonth() + 1, we.getDate());
        } else {
          startStr = date; endStr = date;
        }
        setTebraSync('syncing');
        setTebraMsg('');
        gsr('importFromTebraApi', startStr, endStr, false)
          .then(raw => {
            const r = JSON.parse(raw);
            if (r.error) {
              setTebraSync('error'); setTebraMsg(r.error);
            } else {
              setTebraSync('done');
              const parts = [`✓ ${r.imported} appts imported`];
              if (r.patientsCreated) parts.push(`${r.patientsCreated} new patient${r.patientsCreated !== 1 ? 's' : ''} added`);
              if (r.statusUpdated) parts.push(`${r.statusUpdated} status refreshed`);
              if (r.flagged) parts.push(`${r.flagged} cancelled`);
              setTebraMsg(parts.join(', '));
              const k = period === 'week' ? `week:${prov}:${weekStart(date)}` : dkey(prov, date);
              fetchedRef.current.delete(k);
              setRefreshTick(t => t + 1);
              setTimeout(() => { setTebraSync('idle'); setTebraMsg(''); }, 4000);
            }
          })
          .catch(err => { setTebraSync('error'); setTebraMsg(String(err)); });
      }

      // ── Full / Nuclear Tebra Sync ─────────────────────────────────────────
      // Covers all providers over a broad date range (last 90 days → +8 weeks).
      // Intentionally gated behind a confirm dialog to prevent casual use.
      function fullSyncTebra() {
        const confirmed = window.confirm(
          '⚠️  Full Sync Tebra\n\n' +
          'This will pull ALL appointments across all providers for the last 90 days ' +
          'through 8 weeks into the future. It may take 60–120 seconds.\n\n' +
          'Only use this when you need to backfill or recover data — the regular ' +
          '"Sync Tebra" button handles day-to-day syncing.\n\n' +
          'Continue?'
        );
        if (!confirmed) return;

        const today = _parseYMDjs(date);
        const start = new Date(today); start.setDate(today.getDate() - 90);
        const end = new Date(today); end.setDate(today.getDate() + 56);   // +8 weeks
        const startStr = fmtYMD(start.getFullYear(), start.getMonth() + 1, start.getDate());
        const endStr = fmtYMD(end.getFullYear(), end.getMonth() + 1, end.getDate());

        setFullTebraSync('syncing');
        setFullTebraMsg('');
        gsr('fullSyncTebraApi', startStr, endStr)
          .then(raw => {
            const r = JSON.parse(raw);
            if (r.error) {
              setFullTebraSync('error'); setFullTebraMsg(r.error);
            } else {
              setFullTebraSync('done');
              const parts = [`✓ ${r.imported} appts`];
              if (r.patientsCreated) parts.push(`${r.patientsCreated} new patients`);
              if (r.statusUpdated) parts.push(`${r.statusUpdated} refreshed`);
              setFullTebraMsg(parts.join(' · '));
              fetchedRef.current.clear();           // force full data reload
              setRefreshTick(t => t + 1);
              setTimeout(() => { setFullTebraSync('idle'); setFullTebraMsg(''); }, 6000);
            }
          })
          .catch(err => { setFullTebraSync('error'); setFullTebraMsg(String(err)); });
      }

      function _parseYMDjs(s) {
        const [y, m, d] = s.split('-').map(Number);
        return new Date(y, m - 1, d);
      }

      function navDate(dir) { setDate(d => addDays(d, dir * (period === 'week' ? 7 : 1))); }
      function switchToDay(ds) { setDate(ds); setPeriod('day'); }
      function onCalSelect(ds) { setDate(ds); setCalOpen(false); }

      // Page-reactive calendar icon values — show WHERE you are, not what day it is today.
      // Day view: abbreviated DOW + date number (e.g. "WED" / "18")
      // Week view: abbreviated month of week-start + day range (e.g. "JUN" / "9–15")
      const pageCalVals = (() => {
        if (period === 'week') {
          const ws = weekStart(date);
          const [wy, wm, wd] = ws.split('-').map(Number);
          const wsObj = new Date(wy, wm - 1, wd);
          const weObj = new Date(wy, wm - 1, wd + 6);
          const mo = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'][wsObj.getMonth()];
          return { top: mo, bottom: `${wsObj.getDate()}–${weObj.getDate()}`, isWeek: true };
        }
        const [y, m, d] = date.split('-').map(Number);
        const obj = new Date(y, m - 1, d);
        return {
          top: ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'][m - 1],
          bottom: obj.getDate(),
          dow: ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'][obj.getDay()],
          isWeek: false,
        };
      })();
      function startEdit() {
        const [y, m, d] = date.split('-').map(Number);
        setDateInput(`${m}/${d}/${y}`); setEditing(true);
      }
      function commitEdit() {
        const ds = parseTypedDate(dateInput.trim()); if (ds) setDate(ds); setEditing(false);
      }
      function onDateKey(e) {
        if (e.key === 'Enter') commitEdit();
        if (e.key === 'Escape') setEditing(false);
      }

      const ROLE_VIEWS = {
        provider: ['provider'],
        assistant: ['assistant'],
        biller: ['provider', 'assistant', 'billing'],  // admin (dean) — full access
        unknown: [],
      };
      const allowedViews = ROLE_VIEWS[userRole] || [];
      // isAdmin: biller role = dean@solreibehavioralhealth.com — can toggle API & run Full Sync
      const isAdmin = userRole === 'biller';

      if (initLoading) return (
        <div className="splash">
          {logoSrc
            ? <img src={logoSrc} alt="Solrei Behavioral Health" style={{ height: 64, width: 'auto', marginBottom: 4 }} />
            : <div className="splash-logo">Solrei Behavioral Health</div>
          }
          <div className="splash-sub">SolBoard</div>
          <div className="spinner" />
          <div className="splash-msg">Connecting to Google Sheets…</div>
        </div>
      );
      if (initErr) return (
        <div className="splash">
          <div className="splash-logo">Solrei Behavioral Health</div>
          <div className="splash-sub">SolBoard</div>
          <div className="splash-err">{initErr}</div>
        </div>
      );
      if (userRole === 'unknown') return (
        <div className="splash">
          <div className="splash-logo">Solrei Behavioral Health</div>
          <div className="splash-sub">SolBoard</div>
          <div className="splash-err">
            Access denied. Your account (<strong>{currentUser}</strong>) is not authorized to use this tool.
            <br /><br />
            Contact your administrator to be added to the Staff list.
          </div>
        </div>
      );

      const saveLabel = saveStatus === 'saving' ? '⏳ Saving…' : saveStatus === 'saved' ? '✓ Saved' : saveStatus === 'error' ? '⚠ Error saving' : '';

      // ── Patient count scoped to the currently-selected provider ──
      // The Patients sheet has no direct "assigned provider" column, so this
      // uses each patient's saved Rendering NPI (set via the Claim Submit
      // modal) matched against that provider's known NPI in PROV_NPIS. This
      // undercounts patients who haven't had a claim-submission record saved
      // yet (no renderingNPI on file), but it's the only reliable signal
      // currently in the data — a true fix would need a real provider column
      // on the Patients sheet or a distinct-patients-from-appointments query.
      const providerPatientCount = providerCounts[prov] || 0;

      // ── Admin menu — Sync Tebra / Full Sync / API toggle, combined ──
      // Billing-view + biller-role only ("the biller is the administrator").
      // Assistants previously had their own access to Sync Tebra; that's
      // intentionally folded into this admin-only menu per Dean's request.
      function renderAdminMenu() {
        if (!isAdmin || view !== 'billing') return null;
        return (
          <div className="admin-menu" ref={adminMenuRef}>
            <button className="hdr-btn admin-btn" onClick={() => setAdminOpen(o => !o)}
              title="Admin tools — Tebra API status, Sync Tebra, Full Sync">
              ⚙️ Admin {tebraApiOn ? '🟢' : '🔴'}
            </button>
            {adminOpen && (
              <div className="admin-dropdown">
                <div className="admin-row admin-row-toggle"
                  style={{ cursor: tebraApiToggling ? 'wait' : 'pointer' }}
                  onClick={toggleTebraApi}
                  title={tebraApiOn ? 'Tebra API connected — click to disable' : 'Tebra API disabled — click to enable'}>
                  <span>Tebra API</span>
                  <div className="admin-api-switch" style={{
                    background: tebraApiToggling ? '#9ca3af' : tebraApiOn ? '#16a34a' : '#dc2626',
                  }}>
                    <div className="admin-api-knob" style={{ left: tebraApiOn ? 16 : 2 }} />
                  </div>
                  <span style={{
                    fontSize: 10, fontWeight: 800, textTransform: 'uppercase',
                    color: tebraApiToggling ? '#6b7280' : tebraApiOn ? '#15803d' : '#b91c1c',
                  }}>
                    {tebraApiToggling ? 'Wait…' : tebraApiOn ? 'Live' : 'Off'}
                  </span>
                </div>

                <button className="admin-row admin-action" onClick={syncFromTebra}
                  disabled={tebraSync === 'syncing' || !tebraApiOn}
                  title={!tebraApiOn ? 'Tebra API is currently offline' : period === 'week' ? 'Pull this week + next week from Tebra' : 'Pull today\'s schedule from Tebra'}>
                  {tebraSync === 'syncing' ? '⏳ Syncing…' : '📥 Sync Tebra'}
                </button>
                {tebraMsg && <div className="admin-msg" style={{ color: tebraSync === 'error' ? '#b91c1c' : '#166534' }}>{tebraMsg}</div>}

                <button className="admin-row admin-action admin-action-danger" onClick={fullSyncTebra}
                  disabled={fullTebraSync === 'syncing' || tebraSync === 'syncing' || !tebraApiOn}
                  title={!tebraApiOn ? 'Tebra API is off — use the toggle above to enable' : 'Full Tebra Sync — pulls all providers, last 90 days through 8 weeks ahead. Use sparingly.'}>
                  {fullTebraSync === 'syncing' ? '⏳ Full Syncing…' : '⚡ Full Sync'}
                </button>
                {fullTebraMsg && <div className="admin-msg" style={{ color: fullTebraSync === 'error' ? '#b91c1c' : '#166534' }}>{fullTebraMsg}</div>}
              </div>
            )}
          </div>
        );
      }

      return (
        <div>
          {isMobile ? (
            <div className="hdr hdr-mobile">
              {/* Row 1 — logo · date nav · role/count/date */}
              <span className="hdr-wordmark" style={{ gridRow: 1, gridColumn: 1 }}>
                <img src={SOLREI_S_MARK} alt="Solrei" className="hdr-wordmark-icon" />
                olBoard
              </span>
              <div className="date-nav-cell" style={{ gridRow: 1, gridColumn: 2 }}>
                <button className="date-btn" onClick={() => navDate(-1)} title="Previous">‹</button>
                {editing ? (
                  <input className="date-input" value={dateInput} onChange={e => setDateInput(e.target.value)}
                    onKeyDown={onDateKey} onBlur={commitEdit} autoFocus placeholder="M/D/YYYY" style={{ width: 84 }} />
                ) : (
                  <button className="hdr-cal-btn" onClick={() => setCalOpen(p => !p)}
                    title={period === 'week' ? `Calendar — week of ${pageCalVals.bottom}. Click the date to type one.` : 'Calendar — click the date to type one'}>
                    <span className="hdr-cal-dow">{pageCalVals.top}</span>
                    <span
                      className="hdr-cal-day"
                      style={pageCalVals.isWeek ? { fontSize: 10, fontWeight: 700 } : { top: '30%', bottom: '21%', fontSize: 12 }}
                      onClick={e => { e.stopPropagation(); startEdit(); }}
                    >
                      {pageCalVals.bottom}
                    </span>
                    {!pageCalVals.isWeek && <span className="hdr-cal-wd">{pageCalVals.dow}</span>}
                  </button>
                )}
                <button className="date-btn" onClick={() => navDate(1)} title="Next">›</button>
              </div>
              <div className="hdr-mobile-profile" style={{ gridRow: 1, gridColumn: 3 }}>
                {userRole && <span className="hdr-mobile-role-pill">{userRole}</span>}
                <span className="hdr-mobile-subline">👥{providerPatientCount} · {TODAY_DISPLAY}</span>
                {saveLabel && <div className={`save-ind ${saveStatus}`}>{saveLabel}</div>}
              </div>

              {/* Row 2 — view tabs (one tight row) · Today + Day/Week · ⋯ More */}
              <div className="hdr-mobile-vtabs" style={{ gridRow: 2, gridColumn: 1 }}>
                {allowedViews.includes('provider') && (
                  <button className={`vtab vtab-mobile ${view === 'provider' ? 'on' : ''}`}
                    onClick={() => setView('provider')}>Prov</button>
                )}
                {allowedViews.includes('assistant') && (
                  <button className={`vtab vtab-mobile ${view === 'assistant' ? 'on' : ''}`}
                    onClick={() => setView('assistant')}>✏️ Asst</button>
                )}
                {allowedViews.includes('billing') && (
                  <button className={`vtab vtab-mobile ${view === 'billing' ? 'on' : ''}`}
                    onClick={() => setView('billing')}>💳 Bill</button>
                )}
              </div>
              <div style={{ gridRow: 2, gridColumn: 2, display: 'flex', alignItems: 'center', gap: 4, justifySelf: 'center' }}>
                <button className="hdr-btn hdr-btn-today" onClick={() => { setDate(TODAY); setPeriod('day'); }}
                  title={`Jump to today · ${TODAY_DISPLAY}`}>
                  <span className="hdr-today-label">Today</span>
                </button>
                <div className="period-toggle">
                  <button className={`period-btn ${period === 'day' ? 'on' : ''}`} onClick={() => {
                    fetchedRef.current.delete(dkey(prov, date));
                    setPeriod('day');
                  }}>Day</button>
                  <button className={`period-btn ${period === 'week' ? 'on' : ''}`} onClick={() => {
                    const ws = weekStart(date);
                    fetchedRef.current.delete(`week:${prov}:${ws}`);
                    fetchedRef.current.delete(`allweek:${ws}`);
                    setPeriod('week');
                  }}>Week</button>
                </div>
              </div>
              <button className="hdr-mobile-more-btn" style={{ gridRow: 2, gridColumn: 3 }}
                onClick={() => setMobileMoreOpen(o => !o)} title="More — search, provider, refresh, theme, admin">
                ⋯
              </button>

              {mobileMoreOpen && (
                <div className="hdr-mobile-drawer" ref={mobileDrawerRef}>
                  <div className="hdr-mobile-drawer-row">
                    <span className="hdr-mobile-drawer-label">Search Patient</span>
                    <GlobalSearch onNavigate={(ds, provId) => {
                      if (provId) setProv(provId);
                      switchToDay(ds);
                      setMobileMoreOpen(false);
                    }} />
                  </div>
                  {userRole !== 'provider' && (
                    <div className="hdr-mobile-drawer-row">
                      <span className="hdr-mobile-drawer-label">Provider</span>
                      <select value={prov} onChange={e => setProv(e.target.value)}>
                        {PROVIDERS.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                      </select>
                    </div>
                  )}
                  <div className="hdr-mobile-drawer-row">
                    <button className="hdr-icon-btn" title="Refresh from Sheet" onClick={() => {
                      const ws = weekStart(date);
                      if (period === 'week') {
                        fetchedRef.current.delete(view === 'provider' ? `week:${prov}:${ws}` : `allweek:${ws}`);
                      } else {
                        fetchedRef.current.delete(dkey(prov, date));
                      }
                      setRefreshTick(t => t + 1);
                    }}>⟳ Refresh</button>
                    <button className="theme-toggle" onClick={() => setTheme(t => t === 'dark' ? 'light' : 'dark')}
                      title={theme === 'dark' ? 'Switch to Light Mode' : 'Switch to Dark Mode'}>
                      {theme === 'dark' ? '☀️ Light' : '🌙 Dark'}
                    </button>
                  </div>
                  {isAdmin && view === 'billing' && (
                    <div className="hdr-mobile-drawer-row">
                      {renderAdminMenu()}
                    </div>
                  )}
                </div>
              )}

              {calOpen && <CalendarPicker date={date} onSelect={onCalSelect} onClose={() => setCalOpen(false)} />}
            </div>
          ) : (
            <div className="hdr">
              {/* Wordmark — the Solrei "S" mark icon stands in for the letter
                  "S", immediately followed by "olBoard". Same icon asset is
                  meant to be reused the same way in the other Sol- tools. */}
              <span className="hdr-wordmark">
                <img src={SOLREI_S_MARK} alt="Solrei" className="hdr-wordmark-icon" />
                olBoard
              </span>
              {userRole && (
                <div style={{ fontSize: 10, fontWeight: 800, background: 'rgba(255,255,255,.15)', padding: '3px 9px', borderRadius: 12, color: '#F2EDDB', letterSpacing: '.6px', textTransform: 'uppercase', flexShrink: 0 }}>
                  {userRole}
                </div>
              )}
              {userRole !== 'provider' && (
                <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                  <span style={{ fontSize: 11, opacity: .6, fontWeight: 700 }}>PROVIDER</span>
                  <select value={prov} onChange={e => setProv(e.target.value)}>
                    {PROVIDERS.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                  </select>
                </div>
              )}
              {/* Date control — arrows + calendar icon merged into one group.
                  Click the calendar face to open the picker; click the day
                  number specifically to type a date instead. */}
              <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                <button className="date-btn" onClick={() => navDate(-1)} title="Previous">‹</button>
                {editing ? (
                  <input className="date-input" value={dateInput} onChange={e => setDateInput(e.target.value)}
                    onKeyDown={onDateKey} onBlur={commitEdit} autoFocus placeholder="M/D/YYYY" />
                ) : (
                  <button className="hdr-cal-btn" onClick={() => setCalOpen(p => !p)}
                    title={period === 'week' ? `Calendar — week of ${pageCalVals.bottom}. Click the date to type one.` : 'Calendar — click the date to type one'}>
                    <span className="hdr-cal-dow">{pageCalVals.top}</span>
                    <span
                      className="hdr-cal-day"
                      style={pageCalVals.isWeek ? { fontSize: 11, fontWeight: 700 } : { top: '30%', bottom: '21%', fontSize: 15 }}
                      onClick={e => { e.stopPropagation(); startEdit(); }}
                    >
                      {pageCalVals.bottom}
                    </span>
                    {!pageCalVals.isWeek && <span className="hdr-cal-wd">{pageCalVals.dow}</span>}
                  </button>
                )}
                <button className="date-btn" onClick={() => navDate(1)} title="Next">›</button>
              </div>
              {/* Today — jump shortcut, date itself now shown under the profile block */}
              <button className="hdr-btn hdr-btn-today" onClick={() => { setDate(TODAY); setPeriod('day'); }}
                title={`Jump to today · ${TODAY_DISPLAY}`}>
                <span className="hdr-today-label">Today</span>
              </button>
              <button className="hdr-icon-btn" title="Refresh from Sheet" onClick={() => {
                const ws = weekStart(date);
                if (period === 'week') {
                  // Provider week view uses 'week:prov:ws'; billing/assistant uses 'allweek:ws'
                  fetchedRef.current.delete(view === 'provider' ? `week:${prov}:${ws}` : `allweek:${ws}`);
                } else {
                  fetchedRef.current.delete(dkey(prov, date));
                }
                setRefreshTick(t => t + 1);
              }}>⟳</button>
              <div className="period-toggle">
                <button className={`period-btn ${period === 'day' ? 'on' : ''}`} onClick={() => {
                  // Clear the current day's cache so switching back to Day always shows fresh sheet data
                  fetchedRef.current.delete(dkey(prov, date));
                  setPeriod('day');
                }}>Day</button>
                <button className={`period-btn ${period === 'week' ? 'on' : ''}`} onClick={() => {
                  // Clear both week caches so switching to Week always loads fresh sheet data.
                  // This prevents stale data when appointments are edited directly in the spreadsheet.
                  const ws = weekStart(date);
                  fetchedRef.current.delete(`week:${prov}:${ws}`);
                  fetchedRef.current.delete(`allweek:${ws}`);
                  setPeriod('week');
                }}>Week</button>
              </div>
              <GlobalSearch onNavigate={(ds, provId) => {
                if (provId) setProv(provId);
                switchToDay(ds);
              }} />
              <div className={`save-ind ${saveStatus}`}>{saveLabel}</div>

              {/* Spacer pushes the rest — patient count / profile / theme /
                  admin / view-tabs — into a tight cluster on the right,
                  instead of space-between scattering every item evenly. */}
              <div className="hdr-spacer" />

              {/* Patient count — small pill, scoped to the selected provider
                  (see providerPatientCount above). Moved next to the profile
                  block per Dean's request instead of a prominent standalone
                  button. */}
              <button className="hdr-patient-pill" onClick={refreshPatients}
                title="Reload patient list from Google Sheet — count is specific to the selected provider">
                👥 {providerPatientCount}
              </button>
              {currentUser && (
                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 1 }}>
                  {userDisplay && <div style={{ fontSize: 12, fontWeight: 700, color: '#F2EDDB', lineHeight: 1.2 }}>{userDisplay}</div>}
                  <div className="hdr-user" style={{ color: 'rgba(242,237,219,.65)' }}>Today, {TODAY_DISPLAY}</div>
                </div>
              )}
              <button
                className="theme-toggle"
                onClick={() => setTheme(t => t === 'dark' ? 'light' : 'dark')}
                title={theme === 'dark' ? 'Switch to Light Mode' : 'Switch to Dark Mode'}>
                {theme === 'dark' ? '☀️' : '🌙'}
              </button>
              {renderAdminMenu()}
              <div className="view-tabs">
                {[['provider', 'Provider'], ['assistant', '✏️ Assistant'], ['billing', '💳 Billing']]
                  .filter(([id]) => allowedViews.includes(id))
                  .map(([id, lbl]) => (
                    <button key={id} className={`vtab ${view === id ? 'on' : ''}`} onClick={() => setView(id)}>{lbl}</button>
                  ))
                }
              </div>
              {calOpen && <CalendarPicker date={date} onSelect={onCalSelect} onClose={() => setCalOpen(false)} />}
            </div>
          )}

          <div className="page">
            {apptLoading ? (
              <div className="page-loading"><div className="spinner" /><span>Loading appointments…</span></div>
            ) : (
              <>
                {view === 'provider' && period === 'day' && <ProviderView appts={appts} date={date} prov={prov} onUpdate={updateAppt} onSignNote={signNote} totalUnsigned={totalUnsigned} onClearPhantom={clearPhantom} userRole={userRole} onForceRefresh={forceRefreshDay} patientDb={patientDb} />}
                {view === 'provider' && period === 'week' && <WeekView prov={prov} date={date} data={data} onUpdateForDate={updateApptForDate} onSwitchToDay={switchToDay} onDeleteForDate={deleteApptForDate} totalUnsigned={totalUnsigned} />}
                {view === 'assistant' && period === 'day' && <AssistantView appts={appts} date={date} onUpdate={updateAppt} onAdd={addAppt} onDelete={deleteAppt} patientDb={patientDb} />}
                {view === 'assistant' && period === 'week' && <AllProviderWeekView date={date} allWeekData={allWeekData} onSwitchToDay={switchToDay} prov={prov} onUpdateForDate={updateApptForDate} />}
                {view === 'billing' && period === 'day' && <BillingView appts={appts} date={date} onUpdate={updateAppt} patientDb={patientDb} onRefreshPatients={refreshPatientDb} />}
                {view === 'billing' && period === 'week' && <AllProviderWeekView date={date} allWeekData={allWeekData} onSwitchToDay={switchToDay} prov={prov} view="billing" onUpdateForDate={updateApptForDate} />}
              </>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));


  </script>
</body>
