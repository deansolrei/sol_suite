<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SolBoard — Solrei Behavioral Health</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: 'Wix Madefor Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #8c9aa3;
      color: #2B2716;
      min-height: 100vh
    }

    /* ── Patient Search ─────────────────────────────────────── */
    .psearch-wrap {
      flex: 1;
      max-width: 480px;
      min-width: 100px;
      position: relative;
      margin: 0 8px
    }

    .psearch-row {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, .13);
      border: 1px solid rgba(255, 255, 255, .26);
      border-radius: 8px;
      padding: 0 10px;
      gap: 6px;
      height: 32px;
      transition: background .15s, border-color .15s
    }

    .psearch-row:focus-within {
      background: rgba(255, 255, 255, .22);
      border-color: rgba(255, 255, 255, .52)
    }

    .psearch-icon {
      font-size: 13px;
      opacity: .65;
      flex-shrink: 0;
      pointer-events: none
    }

    .psearch-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: #F2EDDB;
      font-size: 13px;
      font-family: inherit;
      font-weight: 500;
      min-width: 0
    }

    .psearch-input::placeholder {
      color: rgba(242, 237, 219, .48)
    }

    .psearch-clear {
      background: none;
      border: none;
      color: rgba(242, 237, 219, .55);
      cursor: pointer;
      font-size: 17px;
      line-height: 1;
      padding: 0;
      flex-shrink: 0
    }

    .psearch-clear:hover {
      color: #F2EDDB
    }

    .psearch-spin {
      width: 13px;
      height: 13px;
      border: 2px solid rgba(242, 237, 219, .25);
      border-top-color: #F2EDDB;
      border-radius: 50%;
      animation: spin .65s linear infinite;
      flex-shrink: 0
    }

    .psearch-drop {
      position: absolute;
      top: calc(100% + 7px);
      left: 50%;
      transform: translateX(-50%);
      width: 420px;
      background: #fff;
      border-radius: 11px;
      box-shadow: 0 10px 36px rgba(0, 0, 0, .18), 0 2px 8px rgba(0, 0, 0, .09);
      border: 1px solid #e5e7eb;
      z-index: 9999;
      max-height: 500px;
      overflow-y: auto
    }

    .psearch-group-hd {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px 6px;
      border-bottom: 2px solid #f0fdf4;
      background: #f8fffe
    }

    .psearch-group-name {
      font-size: 12px;
      font-weight: 900;
      color: #09371F;
      text-transform: uppercase;
      letter-spacing: .6px
    }

    .psearch-group-count {
      font-size: 10px;
      font-weight: 700;
      color: #777355;
      background: #F2EDDB;
      padding: 2px 7px;
      border-radius: 8px
    }

    .psearch-section-lbl {
      padding: 6px 14px 2px;
      font-size: 9px;
      font-weight: 900;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: .7px
    }

    .psearch-result {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 14px;
      cursor: pointer;
      border-bottom: 1px solid #f9fafb;
      transition: background .1s
    }

    .psearch-result:last-child {
      border-bottom: none
    }

    .psearch-result:hover,
    .psearch-result.psr-active {
      background: #f0fdf4
    }

    .psearch-date-col {
      min-width: 104px;
      font-size: 12px;
      font-weight: 700;
      color: #1e293b;
      line-height: 1.3
    }

    .psearch-past .psearch-date-col {
      color: #94a3b8
    }

    .psearch-today-tag {
      display: inline-block;
      background: #09371F;
      color: #F2EDDB;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .4px;
      margin-left: 5px;
      vertical-align: middle
    }

    .psearch-meta {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      flex: 1
    }

    .psearch-time {
      font-size: 12px;
      font-weight: 800;
      color: #374151;
      min-width: 50px
    }

    .psearch-prov {
      font-size: 11px;
      color: #3D768A;
      font-weight: 600
    }

    .psearch-meth {
      font-size: 10px;
      font-weight: 800;
      color: #777355;
      text-transform: uppercase;
      letter-spacing: .3px
    }

    .psearch-signed {
      font-size: 10px;
      font-weight: 800;
      color: #16a34a
    }

    .psearch-empty {
      padding: 22px 16px;
      color: #9ca3af;
      font-size: 13px;
      text-align: center;
      font-style: italic
    }

    .psearch-footer {
      padding: 7px 14px;
      font-size: 10px;
      color: #9ca3af;
      border-top: 1px solid #f3f4f6;
      text-align: center
    }

    /* ── Loading screen ─────────────────────────────────────── */
    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #777355;
      gap: 14px
    }

    .splash-logo {
      font-size: 36px;
      font-weight: 800;
      color: #F2EDDB;
      letter-spacing: -.5px
    }

    .splash-sub {
      font-size: 14px;
      color: #FBFBF3;
      font-weight: 500
    }

    .splash-msg {
      font-size: 13px;
      color: #FBFBF3;
      margin-top: 4px
    }

    .splash-err {
      font-size: 13px;
      color: #b91c1c;
      background: #fee2e2;
      padding: 12px 20px;
      border-radius: 8px;
      margin-top: 8px;
      max-width: 480px;
      text-align: center;
      line-height: 1.6
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(242, 237, 219, .3);
      border-top-color: #F2EDDB;
      border-radius: 50%;
      animation: spin .7s linear infinite
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    /* ── Header ─────────────────────────────────────────────── */
    .hdr {
      background: #09371F;
      color: #F2EDDB;
      padding: 8px 24px;
      display: flex;
      align-items: center;
      /* flex-start + an .hdr-spacer before the right-hand cluster (patient
         count / profile / theme / admin / view-tabs), rather than
         space-between spreading every item evenly across the full width —
         keeps the left-side controls tightly grouped for a cleaner,
         less-scattered look. */
      justify-content: flex-start;
      gap: 14px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 4px solid #7494AA;
      border-radius: 0;
      min-height: 58px
    }

    .hdr-logo-img {
      height: 42px;
      width: auto;
      display: block;
      object-fit: contain;
      flex-shrink: 0
    }

    .hdr-logo-text {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: .2px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #F2EDDB
    }

    /* Wordmark: Solrei "S" mark icon + "olBoard", flush together as one unit */
    .hdr-wordmark {
      display: flex;
      align-items: center;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0;
      white-space: nowrap;
      color: #F2EDDB;
      flex-shrink: 0;
    }

    .hdr-wordmark-icon {
      height: 34px;
      width: auto;
      display: block;
      object-fit: contain;
      margin-right: 1px;
      flex-shrink: 0;
    }

    .hdr-spacer {
      flex: 1
    }

    .hdr select {
      background: rgba(255, 255, 255, .12);
      border: 1px solid rgba(255, 255, 255, .25);
      color: #F2EDDB;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      outline: none
    }

    .hdr select option {
      background: #7494AA;
      font-family: inherit
    }

    .hdr-user {
      font-size: 11px;
      color: rgba(255, 255, 255, .5);
      font-weight: 500;
      white-space: nowrap
    }

    .save-ind {
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      transition: opacity .3s
    }

    .save-ind.idle {
      opacity: 0
    }

    .save-ind.saving {
      opacity: 1;
      color: #F2EDDB
    }

    .save-ind.saved {
      opacity: 1;
      color: #8AAF9C
    }

    .save-ind.error {
      opacity: 1;
      color: #fca5a5
    }

    .date-nav {
      display: flex;
      align-items: center;
      gap: 5px
    }

    .date-btn {
      background: rgba(242, 237, 219, .15);
      border: 1px solid rgba(242, 237, 219, .4);
      color: #F2EDDB;
      width: 28px;
      height: 28px;
      border-radius: 0;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s
    }

    .date-btn:hover {
      background: rgba(255, 255, 255, .28)
    }

    .date-lbl {
      font-weight: 700;
      font-size: 13px;
      min-width: 130px;
      text-align: center;
      cursor: pointer;
      padding: 3px 6px;
      border-radius: 5px;
      border-bottom: 1px dashed rgba(255, 255, 255, .35);
      transition: background .15s;
      font-family: inherit
    }

    .date-lbl:hover {
      background: rgba(255, 255, 255, .12);
      border-bottom-color: rgba(255, 255, 255, .8)
    }

    .date-input {
      background: rgba(255, 255, 255, .15);
      border: 1.5px solid rgba(255, 255, 255, .6);
      color: #F2EDDB;
      font-size: 13px;
      font-weight: 700;
      width: 120px;
      text-align: center;
      padding: 3px 6px;
      border-radius: 5px;
      outline: none;
      font-family: inherit
    }

    .date-input::placeholder {
      color: rgba(255, 255, 255, .4)
    }

    .hdr-btn {
      background: rgba(242, 237, 219, .12);
      border: 1px solid rgba(242, 237, 219, .35);
      color: #F2EDDB;
      padding: 4px 10px;
      border-radius: 0;
      font-size: 12px;
      cursor: pointer;
      font-weight: 700;
      font-family: inherit;
      transition: background .15s;
      white-space: nowrap
    }

    .hdr-btn:hover {
      background: rgba(255, 255, 255, .28)
    }

    /* Today button — 2-line: "TODAY" label + actual date */
    .hdr-btn-today {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      padding: 4px 12px;
      line-height: 1;
    }

    .hdr-today-label {
      font-size: 8px;
      font-weight: 900;
      letter-spacing: .9px;
      text-transform: uppercase;
      opacity: .6;
      line-height: 1;
    }

    .hdr-today-date {
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
      color: #F2EDDB;
    }

    .hdr-icon-btn {
      background: rgba(242, 237, 219, .12);
      border: 1px solid rgba(242, 237, 219, .35);
      color: #F2EDDB;
      width: 28px;
      height: 28px;
      border-radius: 0;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s
    }

    .hdr-icon-btn:hover {
      background: rgba(255, 255, 255, .28)
    }

    .hdr-cal-btn {
      position: relative;
      width: 44px;
      height: 40px;
      border: 1px solid #F2EDDB;
      padding: 0;
      cursor: pointer;
      border-radius: 0;
      overflow: hidden;
      background: #F2EDDB;
      transition: opacity .15s;
      flex-shrink: 0
    }

    .hdr-cal-btn:hover {
      opacity: .85
    }

    .hdr-cal-dow {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 30%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #09371F;
      color: #F2EDDB;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: .5px;
      line-height: 1;
      pointer-events: none
    }

    .hdr-cal-day {
      position: absolute;
      left: 0;
      right: 0;
      top: 30%;
      bottom: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #09371F;
      font-size: 16px;
      font-weight: 700;
      line-height: 1;
      pointer-events: none
    }

    /* ── Abbreviated day-of-week band, pinned to the bottom of the header calendar icon (Day view only) ── */
    .hdr-cal-wd {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 21%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #09371F;
      color: #F2EDDB;
      font-size: 7px;
      font-weight: 700;
      letter-spacing: .4px;
      line-height: 1;
      pointer-events: none
    }

    .period-toggle {
      display: flex;
      border-radius: 0;
      overflow: hidden;
      border: 1px solid rgba(242, 237, 219, .4)
    }

    .period-btn {
      padding: 4px 11px;
      background: transparent;
      border: none;
      border-radius: 0;
      color: #F2EDDB;
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all .15s
    }

    .period-btn.on {
      background: #F2EDDB;
      color: #09371F
    }

    .period-btn:hover:not(.on) {
      background: rgba(242, 237, 219, .15);
      color: #F2EDDB
    }

    .view-tabs {
      display: flex;
      border-radius: 0;
      overflow: hidden;
      border: 1px solid rgba(242, 237, 219, .4)
    }

    .vtab {
      padding: 6px 13px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      background: transparent;
      border-radius: 0;
      color: #F2EDDB;
      border: none;
      transition: all .15s
    }

    .vtab.on {
      background: #F2EDDB;
      color: #09371F
    }

    .vtab:hover:not(.on) {
      background: rgba(242, 237, 219, .15);
      color: #F2EDDB
    }

    /* ── Patient count pill — small & subtle, provider-scoped ──
       (count itself is computed in App() from PROV_NPIS + patientDb; see
       the providerPatientCount comment there for the caveat on accuracy) */
    .hdr-patient-pill {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(242, 237, 219, .1);
      border: 1px solid rgba(242, 237, 219, .25);
      color: rgba(242, 237, 219, .75);
      padding: 3px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s;
      flex-shrink: 0;
    }

    .hdr-patient-pill:hover {
      background: rgba(242, 237, 219, .22);
      color: #F2EDDB;
    }

    /* ── Admin menu (Billing view, biller-only) — combines the old
       always-visible API toggle / Sync Tebra / Full Sync buttons into one
       dropdown so the main header stays uncluttered. ── */
    .admin-menu {
      position: relative;
      flex-shrink: 0;
    }

    .admin-btn {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .admin-dropdown {
      position: absolute;
      top: calc(100% + 7px);
      right: 0;
      width: 240px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 10px 36px rgba(0, 0, 0, .18), 0 2px 8px rgba(0, 0, 0, .09);
      border: 1px solid #e5e7eb;
      z-index: 60;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .admin-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      color: #2B2716;
      border-radius: 6px;
      padding: 7px 9px;
      border: 1px solid #e5e7eb;
      background: #fff;
      width: 100%;
      text-align: left;
    }

    .admin-row-toggle {
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }

    .admin-action {
      cursor: pointer;
      transition: background .15s;
    }

    .admin-action:hover:not(:disabled) {
      background: #f8fffe;
    }

    .admin-action:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .admin-action-danger {
      color: #b91c1c;
      border-color: #fca5a5;
    }

    .admin-api-switch {
      position: relative;
      width: 32px;
      height: 18px;
      border-radius: 9px;
      flex-shrink: 0;
      transition: background .2s;
    }

    .admin-api-knob {
      position: absolute;
      top: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .3);
      transition: left .18s;
    }

    .admin-msg {
      font-size: 11px;
      font-weight: 600;
      color: #166534;
      padding: 0 2px;
      line-height: 1.3;
    }

    /* ── Page ───────────────────────────────────────────────── */
    .page {
      padding: 14px 16px;
      max-width: 1800px;
      margin: 0 auto
    }

    .page-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 0;
      flex-direction: column;
      gap: 14px;
      color: #F2EDDB;
      font-size: 14px
    }

    /* ── Cumulative Unsigned Notes — compact right-aligned pill ─ */
    .utb-pill-wrap {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 5px
    }

    .utb-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px 3px 7px;
      border-radius: 0;
      border: 1px solid #09371F;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      background: #FFFFFF;
      color: #09371F;
    }

    .utb-pill-num {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1
    }

    .utb-pill.utb-high {
      background: #FFFFFF;
      border-color: #D9383A;
      color: #791F1F
    }

    .utb-pill.utb-med {
      background: #FFFFFF;
      border-color: #09371F;
      color: #09371F
    }

    .utb-pill.utb-low {
      background: #FFFFFF;
      border-color: #09371F;
      color: #09371F
    }

    /* Header-mounted variant — sits on dark header background */
    .utb-hdr-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px 3px 7px;
      border-radius: 20px;
      border: 1.5px solid;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      cursor: default;
      animation: utb-pulse 2.4s ease-in-out infinite;
    }

    .utb-hdr-pill.utb-high {
      background: #7f1d1d;
      border-color: #dc2626;
      color: #fecaca
    }

    .utb-hdr-pill.utb-med {
      background: #78350f;
      border-color: #FBBF24;
      color: #fde68a
    }

    .utb-hdr-pill.utb-low {
      background: #431407;
      border-color: #ea580c;
      color: #fed7aa
    }

    @keyframes utb-pulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(220, 38, 38, 0)
      }

      50% {
        box-shadow: 0 0 0 4px rgba(220, 38, 38, .25)
      }
    }

    /* ── Unsigned Notes Alert — Rail and stile ────────────── */
    .una-wrap {
      background: #FFFFFF;
      border-radius: 0;
      margin-bottom: 14px;
      border: 1px solid #09371F;
      border-left: 6px solid #D9383A;
    }

    .una-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px 7px;
      border-bottom: 1px solid #09371F
    }

    .una-head-label {
      font-size: 11px;
      font-weight: 700;
      color: #09371F;
      text-transform: uppercase;
      letter-spacing: .7px;
      flex: 1
    }

    .una-head-count {
      background: #FFFFFF;
      color: #791F1F;
      border: 1px solid #D9383A;
      border-radius: 0;
      font-size: 11px;
      font-weight: 700;
      padding: 1px 9px;
      white-space: nowrap
    }

    .una-pills {
      display: flex;
      flex-direction: column;
      gap: 0;
      padding: 0
    }

    .una-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #FFFFFF;
      border: none;
      border-bottom: 1px solid #09371F;
      border-radius: 0;
      padding: 7px 14px
    }

    .una-pill-time {
      font-size: 12px;
      font-weight: 700;
      color: #09371F;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      min-width: 58px
    }

    .una-pill-name {
      font-size: 13px;
      font-weight: 500;
      color: #09371F;
      white-space: nowrap
    }

    .una-pill-badge {
      border: 1px solid #09371F;
      border-radius: 0;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 7px;
      white-space: nowrap;
      flex-shrink: 0;
      background: #FFFFFF;
      color: #09371F;
    }

    .una-pill-badge.u1,
    .una-pill-badge.u2,
    .una-pill-badge.u3p {
      background: #FFFFFF;
      color: #791F1F;
      border-color: #D9383A;
    }

    .una-pill-date {
      font-size: 11px;
      font-weight: 500;
      color: #09371F;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 3px
    }

    /* Phantom-clear dismiss button on unsigned date pills */
    .una-date-dismiss {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      border: none;
      background: none;
      color: #9ca3af;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
      border-radius: 3px;
      line-height: 1;
      padding: 0;
      opacity: 0;
      transition: opacity .15s, color .15s, background .15s;
    }

    .una-pill:hover .una-date-dismiss {
      opacity: 1;
    }

    .una-date-dismiss:hover {
      color: #ef4444;
      background: #fee2e2;
    }

    .pv-unote-dismiss {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 13px;
      height: 13px;
      border: none;
      background: none;
      color: #9ca3af;
      font-size: 10px;
      font-weight: 900;
      cursor: pointer;
      border-radius: 3px;
      line-height: 1;
      padding: 0;
      margin-left: 1px;
      opacity: 0;
      transition: opacity .15s, color .15s;
    }

    .pv-row:hover .pv-unote-dismiss,
    .pv-unote:hover .pv-unote-dismiss {
      opacity: 1;
    }

    .pv-unote-dismiss:hover {
      color: #ef4444;
    }

    .una-day-hdr {
      font-size: 10px;
      font-weight: 800;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: .7px;
      padding: 6px 14px 2px;
      border-top: 1px solid #f3f4f6
    }

    .una-day-hdr:first-child {
      border-top: none
    }

    /* ── Summary bar ────────────────────────────────────────── */
    .summary {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap
    }

    .scard {
      background: transparent;
      border-radius: 0;
      padding: 0;
      font-size: 12px;
      font-weight: 500;
      box-shadow: none;
      display: inline-flex;
      align-items: baseline;
      gap: 5px;
      border: none
    }

    .scard .num {
      font-size: 12px;
      font-weight: 700;
      color: #09371F
    }

    .scard.s-all .num,
    .scard.s-ok .num,
    .scard.s-err .num,
    .scard.s-pend .num,
    .scard.s-out .num {
      color: #09371F
    }

    .scard.s-err {
      color: #791F1F
    }

    .scard.s-err .num {
      color: #791F1F
    }

    /* ── "Not Submitted" stat (Post-visit banner) ── */
    .scard.s-nosub {
      color: #3D768A
    }

    .scard.s-nosub .num {
      color: #3D768A
    }

    .scard-btn {
      font-family: inherit;
      cursor: pointer;
      text-decoration: underline;
      text-decoration-style: dotted;
      text-underline-offset: 3px;
    }

    .scard-btn:hover {
      opacity: .7;
    }

    /* ── Provider Day View ──────────────────────────────────── */
    /* CHANGED: overflow clip → visible so sticky .pv-thead doesn't get
       clipped when the user scrolls past the card. Rounded corners are
       preserved on the header itself below. */
    .pv-card {
      background: #fff;
      border-radius: 0;
      border: 1px solid #09371F;
      overflow: visible
    }

    /* Legacy 8-col grid header — no longer rendered (replaced by .pv-tabs),
       left in place as harmless dead CSS in case any other view still refs it. */
    .pv-thead {
      display: grid;
      grid-template-columns: 88px 1fr 170px 110px 150px 160px 60px 100px;
      gap: 10px;
      padding: 11px 20px;
      background: #1e293b;
      position: sticky;
      top: 148px;
      z-index: 16;
      border-radius: 0;
    }

    .pv-th {
      font-size: 10px;
      font-weight: 800;
      color: rgba(255, 255, 255, .5);
      text-transform: uppercase;
      letter-spacing: .9px
    }

    /* ── Rail-and-stile Pre-visit / Post-visit tab switcher ── */
    /* Sticky right below .summary-row (top:88, ~43px tall incl. margin) so the */
    /* Pre-visit/Post-visit buttons stay reachable at any scroll position. */
    .pv-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 0;
      position: sticky;
      top: 130px;
      z-index: 16;
    }

    .pv-tab {
      flex: 0 0 auto;
      padding: 9px 22px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .3px;
      text-transform: uppercase;
      /* Uniform medium border on all sides (was bottom-only) — each tab now
         reads as its own complete bordered chip, still the same Solrei blue. */
      border: 3px solid #1C6FA3;
      border-radius: 0;
      background: #F2EDDB;
      color: #09371F;
      cursor: pointer;
      transition: none;
      box-shadow: 0 3px 6px rgba(28, 111, 163, .35);
    }

    .pv-tab.on {
      background: #09371F;
      color: #F2EDDB;
      border-color: #1C6FA3;
    }

    .pv-row {
      display: flex;
      flex-direction: column;
      padding: 10px 18px;
      border-bottom: 1px solid #09371F;
      transition: background .12s
    }

    .pv-row:hover {
      background: #FBFBF3
    }

    .pv-row:last-child {
      border-bottom: none;
    }

    .pv-row.dim {
      opacity: .55
    }

    /* Pre-visit rows: a bit more breathing room + a heavier divider than
       Post-visit, since Pre-visit is scanned quickly row-by-row. */
    .pv-row-pre {
      padding-top: 13px;
      padding-bottom: 13px;
      padding-left: 22px;
      border-bottom: 2px solid #09371F;
    }

    /* Status "stile" accent — subtle left border, colored to match the
       row's Valid/Issue/In Process state. Uses status colors (not brand
       green) per the rule: never mix brand green with status-green meaning. */
    .pv-stile-ok {
      border-left: 7px solid #059669;
    }

    .pv-stile-err {
      border-left: 7px solid #DC2626;
    }

    .pv-stile-pend {
      border-left: 7px solid #FBBF24;
    }

    /* ── Post-visit card color system ──────────────────────────────────
       Two independent axes, both driven by data the Provider can already
       see (read-only here — no actions live in this view):
         Border (left 6px + thin 1px inner ring) = Assistant's note-prep
           progress: Not Started → In Progress → Ready → Provider signs.
         Background = Billing's claim status: baseline until the Biller
           marks the claim submitted, then pending vs paid.
       Clinic Submit rows also get a constant rollover (not state-based). */
    .pv-post-not-started {
      border-left: 6px solid #DC2626;
      box-shadow: inset 0 0 0 1px #DC2626;
    }

    .pv-post-in-progress {
      border-left: 6px solid #FDB90D;
      box-shadow: inset 0 0 0 1px #FDB90D;
    }

    .pv-post-ready {
      border-left: 6px solid #059669;
      box-shadow: inset 0 0 0 1px #059669;
    }

    .pv-post-signed {
      border-left: 6px solid #065F46;
      box-shadow: inset 0 0 0 1px #065F46;
    }

    .pv-post-bg-baseline {
      background: #FAF8F0;
    }

    .pv-post-bg-pending {
      background: #FDDB87;
    }

    .pv-post-bg-paid {
      background: #ABEDD5;
    }

    .pv-post-direct:hover {
      background: #C7C6C1;
    }

    /* Post-visit banner stat click (Signed / Pending / Paid) — highlights
       every matching row so the count is traceable back to real rows. */
    .pv-row-highlight {
      background: #FBF3D9;
      box-shadow: inset 4px 0 0 #BE992A;
    }

    .pv-row-main {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pv-status-inline {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 0 0 auto;
    }

    .pv-unsigned-badge {
      flex: 0 0 auto;
      background: #fff;
      border: 1px solid #D9383A;
      border-radius: 0;
      color: #791F1F;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      cursor: pointer;
      font-family: inherit;
    }

    .pv-unsigned-zero {
      flex: 0 0 auto;
      font-size: 11px;
      font-weight: 500;
      color: #09371F;
      opacity: .55;
    }

    .pv-details-toggle {
      flex: 0 0 auto;
      background: none;
      border: none;
      color: #09371F;
      opacity: .6;
      font-size: 11px;
      cursor: pointer;
      padding: 2px 4px;
      font-family: inherit;
    }

    .pv-details-toggle:hover {
      opacity: 1;
    }

    .pv-detail-panel {
      margin-top: 8px;
      padding: 10px 12px;
      background: #FBFBF3;
      border: 1px solid #09371F;
      border-radius: 0;
    }

    /* Focal-point content inside an expanded Pre-visit row — the actual
       Issue reason, In-Process checklist, or Provider Notes, front and
       center rather than buried among secondary detail. Everything here is
       centered within the banner per Dean's request, with incomplete
       checklist items called out via a solid highlight bar so they read as
       the reason at a glance instead of blending into the rest of the box. */
    .pv-reason-box {
      padding: 10px 12px;
      margin-bottom: 8px;
      border-radius: 0;
      font-size: 12px;
      font-weight: 600;
      color: #2B2716;
      text-align: center;
    }

    .pv-reason-label {
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 6px;
    }

    .pv-reason-err {
      background: #FEECEC;
      border: 1px solid #D9383A;
    }

    .pv-reason-err .pv-reason-label {
      color: #791F1F;
    }

    .pv-reason-pend {
      background: #FFF7E6;
      border: 1px solid #BE992A;
    }

    .pv-reason-pend .pv-reason-label {
      color: #7A5C0E;
    }

    .pv-notes-box {
      background: #F2EDDB;
      border: 1px solid #09371F;
    }

    .pv-notes-box .pv-reason-label {
      color: #09371F;
    }

    .pv-checklist-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: fit-content;
      margin: 3px auto;
      padding: 3px 12px;
      font-weight: 700;
    }

    /* The item(s) actually holding this appointment back — a solid filled
       bar (not just colored text) so it can't be scanned past. */
    .pv-checklist-incomplete {
      background: #D9383A;
      color: #fff;
      font-weight: 900;
    }

    .pv-reason-note {
      margin-top: 6px;
      text-align: center;
    }

    /* ── Shared 3-column strip — used by BOTH Pre-visit (Channel & Coverage /
       Clinical / Unsigned) and Post-visit (Rx / CPT / Sign) rows so the two
       workflows share one visual language: a status line on top, then a
       fixed 3-column grid strip below. First two columns flex evenly;
       the third is auto-width and holds the row's primary action/indicator. */
    .pv-strip {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      margin-top: 8px;
      background: #FBFBF3;
      border: 1px solid #7494AA;
      border-radius: 0;
    }

    .pv-strip-col {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 10px 12px;
      border-right: 1px solid #E3DFC8;
      min-width: 0;
    }

    .pv-strip-col:last-child {
      border-right: none;
    }

    .pv-strip-col-action {
      flex-direction: row;
      align-items: center;
      gap: 4px;
    }

    .pv-strip-label {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .8px;
      text-transform: uppercase;
      color: #7494AA;
      margin-bottom: 6px;
      flex: 0 0 auto;
    }

    .pv-strip-empty {
      font-size: 11px;
      color: #9ca3af;
    }

    .pv-notes-ta {
      width: 100%;
      min-height: 52px;
      border: 1.5px solid #e2e8f0;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
      font-family: inherit;
      color: #374151;
      resize: vertical;
      outline: none;
      background: #fff;
      line-height: 1.4;
      transition: border-color .15s
    }

    .pv-notes-ta:focus {
      border-color: #09371F;
      box-shadow: 0 0 0 2px rgba(9, 55, 31, .08)
    }

    .pv-notes-ta::placeholder {
      color: #9ca3af
    }

    .pv-sign-btn {
      padding: 6px 12px;
      border-radius: 0;
      border: 1px solid #09371F;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      line-height: 1.3;
      text-align: center;
    }

    .pv-sign-btn.unsigned {
      background: #F2EDDB;
      color: #09371F
    }

    .pv-sign-btn.unsigned:hover {
      background: #09371F;
      color: #F2EDDB
    }

    .pv-sign-btn.signed {
      background: #09371F;
      color: #F2EDDB;
      cursor: default;
    }

    .pv-sign-undo {
      background: none;
      border: 1px solid #777355;
      border-radius: 0;
      font-size: 10px;
      font-weight: 700;
      color: #777355;
      cursor: pointer;
      padding: 4px 9px;
      font-family: inherit;
      white-space: nowrap;
      transition: none
    }

    .pv-sign-undo:hover {
      background: #fef3c7;
      color: #BE992A;
      border-color: #BE992A
    }

    /* Cream backdrop strip so scrolling content doesn't peek around the pill */
    .day-date-banner {
      display: inline-flex;
      align-items: center;
      background: linear-gradient(135deg, #09371F 0%, #1a5c38 100%);
      color: #F2EDDB;
      border-radius: 10px;
      padding: 8px 22px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: .3px;
      box-shadow: 0 2px 10px rgba(9, 55, 31, .22);
      margin-bottom: 16px;
      position: sticky;
      top: 88px;
      z-index: 18;
      align-self: flex-start;
    }

    /* Wrapper strip that sits behind the pill so scrolling rows don't peek around it.
       No longer sticky itself — it's now the first child of .billing-frozen-header,
       which sticks as one unit together with the Direct-Pay + Claims banners below it. */
    .day-date-sticky-wrap {
      position: static;
      background: #FBFBF3;
      padding: 14px 24px 10px 24px;
      /* ↑ top pad = breathing room above banner */
      margin: 0 -24px 8px -24px;
    }

    /* ── Billing Day — frozen header stack (Date + Direct-Pay + Claims info) ── */
    .billing-frozen-header {
      position: sticky;
      top: 88px;
      z-index: 17;
      background: #FBFBF3;
      margin-bottom: 18px;
    }

    .day-date-sticky-wrap .day-date-banner {
      position: static;
      margin-bottom: 0;
    }

    .summary-row {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      position: sticky;
      top: 88px;
      z-index: 15;
      background: #F2EDDB;
      border-bottom: 1px solid #09371F;
      padding: 8px 14px;
      margin-bottom: 10px
    }

    .summary-date-pill {
      margin-left: auto;
      background: transparent;
      color: #09371F;
      opacity: .6;
      border-radius: 0;
      padding: 0;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .2px;
      box-shadow: none;
      white-space: nowrap;
      flex-shrink: 0
    }

    .pv-time {
      font-size: 14px;
      font-weight: 900;
      color: #2B2716;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.2px;
      white-space: nowrap
    }

    .pv-name {
      font-size: 14px;
      font-weight: 800;
      color: #09371F
    }

    .pv-ins {
      font-size: 11px;
      font-weight: 600;
      color: #3D768A;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    /* ── Billing Channel chip (assigned via biller's "Assign Channel" tool) ── */
    .pv-channel {
      display: inline-block;
      background: #fff;
      border: 1px solid #09371F;
      color: #09371F;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 0;
      letter-spacing: .3px;
      margin-top: 3px;
      margin-right: 6px;
    }

    .pv-copay {
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      margin-top: 1px
    }

    .pv-copay.pay-coll {
      color: #16a34a
    }

    .pv-copay.pay-fail {
      color: #dc2626
    }

    .pv-copay.pay-pend {
      color: #BE992A
    }

    .pv-stat-val {
      font-size: 13px;
      font-weight: 800
    }

    .pv-stat-val.ok {
      color: #16a34a
    }

    .pv-stat-val.err {
      color: #dc2626
    }

    .pv-stat-val-link {
      text-decoration: underline;
      text-decoration-style: dotted;
      text-underline-offset: 2px;
    }

    .pv-stat-val.pend {
      color: #BE992A
    }

    .pv-unote {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 6px;
      padding: 3px 8px;
      border-radius: 0;
      background: #09371F;
      font-size: 10px;
      font-weight: 800;
      color: #F2EDDB;
      letter-spacing: .3px;
      font-variant-numeric: tabular-nums
    }

    .pv-unote-icon {
      opacity: .7;
      font-style: normal
    }

    .pv-unote-sep {
      opacity: .35;
      font-weight: 400;
      font-size: 9px
    }

    .pv-status {
      display: flex;
      flex-direction: column;
      gap: 3px
    }

    .pv-method {
      font-size: 10px;
      font-weight: 800;
      color: #777355;
      text-transform: uppercase;
      letter-spacing: .4px;
      margin-top: 1px
    }

    .pv-stxt {
      font-size: 11px;
      font-weight: 600
    }

    .pv-stxt.ok {
      color: #16a34a
    }

    .pv-stxt.err {
      color: #dc2626
    }

    .pv-stxt.pend {
      color: #BE992A
    }

    .pay-badge {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 0;
      display: inline-block;
      margin-top: 3px;
      letter-spacing: .2px;
      border: 1px solid currentColor;
    }

    .pay-badge.pend {
      background: #fff;
      color: #BE992A
    }

    .pay-badge.coll {
      background: #fff;
      color: #16a34a
    }

    .pay-badge.fail {
      background: #fff;
      color: #dc2626
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .25)
    }

    .dot.ok {
      background: #16a34a
    }

    .dot.err {
      background: #dc2626
    }

    .dot.pend {
      background: #BE992A
    }

    .dot-hg {
      font-size: 9px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      flex-shrink: 0
    }

    .cpt-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center
    }

    .cpt-chip {
      background: #7494AA;
      color: #FBFBF3;
      padding: 2px 7px;
      border-radius: 0;
      font-size: 12px;
      font-weight: 700
    }

    .cpt-edit-btn {
      background: none;
      border: 1px dashed #FBFBF3;
      color: #777355;
      padding: 2px 8px;
      border-radius: 0;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      transition: all .15s
    }

    .cpt-edit-btn:hover {
      border-color: #09371F;
      color: #09371F
    }

    /* ── Rx Modal ────────────────────────────────────────────── */
    .rx-modal {
      max-width: 580px
    }

    .rx-section-lbl {
      font-size: 11px;
      font-weight: 800;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: .8px;
      margin-bottom: 8px;
      margin-top: 16px
    }

    .rx-section-lbl:first-child {
      margin-top: 0
    }

    .rx-add-row {
      display: flex;
      gap: 8px;
      align-items: center
    }

    .rx-select {
      flex: 1;
      min-width: 0;
      border: 1.5px solid #e2e8f0;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 13px;
      font-family: inherit;
      color: #374151;
      background: #fff;
      outline: none;
      cursor: pointer
    }

    .rx-select:focus {
      border-color: #09371F;
      box-shadow: 0 0 0 2px rgba(9, 55, 31, .08)
    }

    .rx-dosage-input {
      width: 120px;
      border: 1.5px solid #e2e8f0;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      color: #374151
    }

    .rx-dosage-input:focus {
      border-color: #09371F;
      box-shadow: 0 0 0 2px rgba(9, 55, 31, .08)
    }

    /* ── Rx cell in Provider row ─────────────────────────── */

      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center
    }

    .rx-pv-chip {
      background: #6b3a8a;

      color: #6b3a8a;
      padding: 2px 8px;
      border-radius: 0;

    .rx-edit-btn:hover {

    .rx-btn-wrap {

      display: inline-flex

      position: absolute;
      top: -5px;
      right: -5px;
      width: 12px;

      border-radius: 50%;

      50% {

    /* ── Rx section in Billing row ───────────────────────── */

      color: #6b3a8a;

    }

      gap: 3px

      flex-shrink: 0

      border: 1px solid #c4b5d4;
      color: #6b3a8a;
      padding: 2px 9px;

      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all .15s;

    .rx-b-edit-btn:hover {

      background: #F2EDDB

    .co-btn {

      font-weight: 700;

    /* ── Week View ──────────────────────────────────────────── */
    .wk-wrap {

      gap: 7px

    .wk-col {

      border: 2px solid #7494AA;
      border-top: none

    .wk-col.wk-sel {
      border: 2px solid #09371F;
      border-top: none
    }

    .wk-hdr-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 7px;
      position: sticky;
      top: 58px;
      z-index: 20;
      background: #FBFBF3;
      margin-bottom: 0;
      padding: 4px 0 8px;
    }

    /* ── Unified week grid — eliminates header/body alignment drift ── */
    .wk-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      column-gap: 7px;
      row-gap: 0;
      background: #FBFBF3;
    }

    .wk-grid>.wk-col-hd {

      top: 58px;

    }

    /* ── Billing Week View — Direct Pay Banners ── */
    .wk-dp-banner-cell {

    }

    .wk-dp-banner-empty {

    }

    .wk-dp-banner.dp-has-pending .wk-dp-banner-col-done,

      border-left: 1px solid #16a34a;

    }

    .pvdp-cols {

    }

    .pvdp-col {

    /* ── Assistant Table ────────────────────────────────────── */
    /* overflow: clip (was here before) breaks position:sticky on descendants —
       same issue already fixed once on .pv-card. Changed to visible so the
       standalone sticky column-header banner (.asst-hd-sticky) works. */
    .tbl-wrap {
      background: #fff;
      border-radius: 0;
      border: 1px solid #09371F;
      border-top: none;
      box-shadow: none;
      overflow: visible
    }

    .tbl-hd {
      padding: 13px 20px;
      border-bottom: 1px solid #09371F;
      background: #09371F;
      display: flex;
      justify-content: space-between;

      border-radius: 0;
      box-shadow: none;
      position: sticky;

      letter-spacing: .1px
    }

      font-weight: 600
    }

    /* Only scrolls horizontally, for wide tables on narrow screens — vertical
       scroll is always the page/window. (overflow-y must stay explicitly
       "visible": per spec, if overflow-x is anything other than visible and
       overflow-y is left unset, the browser computes overflow-y as "auto"
       too, silently turning this into its own vertical scroll container.) */
    .tbl-scroll {
      overflow-x: auto;
      overflow-y: visible;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 13px
    }

    thead th {
      background: rgba(9, 55, 31, .92);
      color: rgba(242, 237, 219, .65);
      padding: 9px 12px;
      text-align: left;
      font-weight: 900;
      font-size: 10px;
      letter-spacing: .7px;
      text-transform: uppercase;
      white-space: nowrap;
      font-family: inherit;
    }

    /* ── Assistant Table column header (TIME/PATIENT/METHOD/BILLING…) ──
       FIX (2026-07-26): this used to be a sticky <thead>/<th> living inside
       the same scrolling table as the data rows — sticky positioning on
       table-internal elements is a persistent cross-browser trouble spot and
       kept scrolling away with the page regardless of overflow patches. It's
       now a completely standalone sticky <div> (see AssistantView's render —
       .asst-hd-sticky wraps a tiny header-only <table>), the same proven
       mechanism every other frozen bar in the app already uses. Its own
       "top" offset is synced dynamically by the app's syncStickyTop effect,
       same as .tbl-hd. overflow-x:hidden + the JS scrollLeft mirror (see
       AssistantView's syncHorizScroll) keep it aligned with the real table
       when the table itself needs to scroll sideways on narrow screens. */
    .asst-hd-sticky {
      position: sticky;
      top: 106px;
      z-index: 19;
      overflow-x: hidden;
      border-bottom: 1px solid #09371F;
    }

      white-space: nowrap;
      letter-spacing: .2px;
    }

    body.dark .b-code-inline {
      background: #4A6D82;
    }

    .sub-btn {
      padding: 7px 12px;
      border-radius: 0;
      border: none;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: normal;
      line-height: 1.3;
      text-align: center;
      font-family: inherit;
      transition: all .15s
    }

    .sub-btn.ready {
      background: #09371F;
      color: #F2EDDB
    }

    .sub-btn.ready:hover {
      background: #0f5130
    }

    .sub-btn.done {
      background: #fff;
      border: 1px solid #16a34a;
      color: #16a34a;
      cursor: default
    }

    .sub-btn.plain {
      background: #F2EDDB;
      color: #777355
    }

    .sub-btn.plain:hover {
      background: #FBFBF3;
      color: #2B2716
    }

    /* No bottom margin/border — sits flush against .claim-day-banner right below it,
       inside .billing-frozen-header. The seam between them is a single dark divider
       (see .claim-day-banner's border-top) instead of two separate bordered boxes
       with a gap. */
    .dp-section {
      background: #fff;
      border-radius: 0;
      box-shadow: none;
      border: 1px solid #7494AA;
      border-bottom: none;
      margin-bottom: 0;
      overflow: hidden
    }

    .dp-hdr {
      background: #3D768A;
      color: #fff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px
    }

    .dp-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .2px
    }

    .dp-alert-btn {
      background: rgba(255, 255, 255, .2);
      border: 1px solid rgba(255, 255, 255, .4);
      color: #fff;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap
    }

    .dp-alert-btn:hover {
      background: rgba(255, 255, 255, .35)
    }

    .dp-row {
      display: grid;
      grid-template-columns: 160px minmax(80px, 200px) 140px auto;
      gap: 12px;
      padding: 12px 28px 12px 16px;
      border-bottom: 1px solid #F2EDDB;
      align-items: center;
      transition: background .1s
    }

    .dp-row:last-child {
      border-bottom: none
    }

    .dp-row.coll {
      background: #f0fdf4
    }

    .dp-row.pend {
      background: #fff5f5;
      border-left: 4px solid #ef4444;
      padding-left: 12px
    }

    .dp-row.fail {
      background: #fef2f2
    }

    .dp-chk {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap
    }

    .dp-pay-controls {
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .dp-chks {
      display: flex;
      gap: 14px;
      align-items: center
    }

    .dp-date-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 9px;
      background: #FAFAF4;
      border: 1px solid #E2DFC8;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 700;
      color: #777355
    }

    .dp-date-wrap.coll {
      border-color: #86efac;
      background: #f0fdf4
    }

    .dp-date-wrap.fail {
      border-color: #fca5a5;
      background: #fef2f2
    }

    .dp-date-lbl {
      white-space: nowrap;
      letter-spacing: .2px;
      text-transform: uppercase;
      font-size: 10px
    }

    .dp-date-inp {
      border: none;
      background: transparent;
      font-size: 12px;
      font-weight: 700;
      color: #2B2716;
      font-family: inherit;
      cursor: pointer;
      padding: 0;
      outline: none
    }

    .dp-date-inp::-webkit-calendar-picker-indicator {
      opacity: .5;
      cursor: pointer
    }

    /* Direct Pay — Platform selector */
    .dp-platform-row {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 2px
    }

    .dp-platform-lbl {
      font-size: 10px;
      font-weight: 800;
      color: #777355;
      text-transform: uppercase;
      letter-spacing: .5px;
      white-space: nowrap
    }

    .dp-platform-sel {
      border: 1.5px solid #e2e8f0;
      border-radius: 6px;
      padding: 4px 7px;
      font-size: 12px;
      font-family: inherit;
      color: #374151;
      background: #fff;
      cursor: pointer;
      outline: none;
      font-weight: 600
    }

    .dp-platform-sel:focus {
      border-color: #09371F
    }

    .dp-platform-other {
      border: 1.5px solid #e2e8f0;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      font-family: inherit;
      color: #374151;
      background: #fff;
      width: 110px;
      outline: none;
      font-weight: 600
    }

    .dp-platform-other:focus {
      border-color: #09371F
    }

    /* ── $0 Copay — standalone confirmation (no collection patients) ── */
    /* Flush against .claim-day-banner right below it (see .dp-section for the
       non-zero-copay equivalent) — no bottom border/margin, matches Rail-and-stile. */
    .dp-zero-standalone {
      border: 1px solid #16a34a;
      border-bottom: none;
      background: #fff;
      border-radius: 0;
      padding: 10px 14px 8px;
      margin-bottom: 0;
    }

    .dp-zero-sa-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 800;
      color: #065f46;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 7px;
    }

    .dp-zero-sa-date {
      font-weight: 600;
      opacity: .7;
      text-transform: none;
      letter-spacing: 0
    }

    /* ── $0 Copay — strip appended inside a normal dp-section ── */
    .dp-zero-strip {
      border-top: 1.5px solid #d1fae5;
      background: #f0fdf4;
      border-radius: 0 0 10px 10px;
      padding: 8px 14px 9px;
      margin-top: 4px;
    }

    .dp-zero-strip-hdr {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 800;
      color: #065f46;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 6px;
    }

    .dp-zero-strip-count {
      background: #d1fae5;
      color: #065f46;
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 10px;
      font-weight: 700;
    }

    /* ── $0 Copay — shared row styles ── */
    .dp-zero-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 0;
      border-bottom: 1px solid rgba(209, 250, 229, .6);
      font-size: 12px;
    }

    .dp-zero-row:last-child {
      border-bottom: none
    }

    .dp-zero-name {
      font-weight: 800;
      color: #2B2716;
      min-width: 110px
    }

    .dp-zero-time {
      color: #777355;
      font-size: 11px;
      white-space: nowrap
    }

    .dp-zero-ins {
      background: #d1fae5;
      color: #065f46;
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 10px;
      font-weight: 700
    }

    .dp-zero-confirm {
      margin-left: auto;
      font-size: 10px;
      font-weight: 800;
      color: #16a34a;
      white-space: nowrap
    }

    /* ── $0 Copay badge on b-card ── */
    .b-zero-copay-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: #fff;
      border: 1px solid #16a34a;
      color: #16a34a;
      border-radius: 0;
      padding: 2px 8px;
      font-size: 10px;
      font-weight: 800;
      margin-top: 4px;
    }

    /* .wk-dp-banner-pts removed — replaced by two-column per-patient rows */

    /* Dark mode — $0 copay elements */
    body.dark .dp-zero-standalone {
      background: #052e16;
      border-color: #14532d
    }

    body.dark .dp-zero-sa-hdr {
      color: #4ade80
    }

    body.dark .dp-zero-strip {
      background: #052e16;
      border-color: #14532d
    }

    body.dark .dp-zero-strip-hdr {
      color: #4ade80
    }

    body.dark .dp-zero-strip-count {
      background: #14532d;
      color: #4ade80
    }

    body.dark .dp-zero-row {
      border-color: rgba(20, 83, 45, .5)
    }

    body.dark .dp-zero-name {
      color: #D8D3BF
    }

    body.dark .dp-zero-time {
      color: #8A8265
    }

    body.dark .dp-zero-ins {
      background: #14532d;
      color: #4ade80
    }

    body.dark .dp-zero-confirm {
      color: #4ade80
    }

    body.dark .b-zero-copay-badge {
      background: #14532d;
      color: #4ade80
    }

    /* ── Modals ─────────────────────────────────────────────── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(43, 39, 22, .55);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px
    }

    .modal {
      background: #fff;
      border-radius: 12px;
      width: 100%;
      max-width: 620px;
      max-height: 92vh;
      overflow-y: auto;
      box-shadow: 0 24px 64px rgba(43, 39, 22, .3)
    }

    .modal.sm {
      max-width: 460px
    }

    .modal.md {
      max-width: 560px
    }

    .m-hdr {
      padding: 16px 22px;
      border-bottom: 1px solid #FBFBF3;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      background: #09371F;
      color: #F2EDDB;
      border-radius: 12px 12px 0 0;
      position: sticky;
      top: 0;
      z-index: 1
    }

    .m-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: .2px
    }

    .m-sub {
      font-size: 12px;
      opacity: .7;
      margin-top: 2px
    }

    .m-close {
      background: none;
      border: none;
      color: rgba(255, 255, 255, .7);
      font-size: 24px;
      cursor: pointer;
      line-height: 1;
      padding: 0;
      font-family: inherit
    }

    .m-close:hover {
      color: #fff
    }

    .m-body {
      padding: 18px 22px
    }

    .m-foot {
      padding: 14px 22px;
      border-top: 1px solid #FBFBF3;
      display: flex;
      gap: 9px;
      justify-content: flex-end;
      background: #F2EDDB;
      border-radius: 0 0 12px 12px
    }

    .step {
      margin-bottom: 18px;
      padding-bottom: 18px;
      border-bottom: 1px solid #F2EDDB
    }

    .step:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0
    }

    .step-hd {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 800;
      color: #777355;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 10px
    }

    .step-num {
      background: #09371F;
      color: #F2EDDB;
      width: 19px;
      height: 19px;
      border-radius: 50%;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0
    }

    .fl {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #2B2716;
      margin-bottom: 5px
    }

    .fi {
      width: 100%;
      padding: 8px 10px;
      border: 1.5px solid #FBFBF3;
      border-radius: 7px;
      font-size: 14px;
      outline: none;
      font-family: inherit;
      background: #fff;
      color: #2B2716
    }

    .fi:focus {
      border-color: #09371F;
      box-shadow: 0 0 0 2px rgba(9, 55, 31, .1)
    }

    textarea.fi {
      resize: vertical;
      min-height: 60px
    }

    .g2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    .frm {
      margin-bottom: 13px
    }

    .mthd-btn {
      flex: 1;
      padding: 9px;
      border: 2px solid #8AAF9C;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: #777355;
      font-family: inherit;
      transition: all .15s
    }

    .mthd-btn:hover {
      border-color: #09371F;
      color: #09371F
    }

    /* Selected-state channel colors — Solrei brand rule, always these hex values */
    .mthd-btn.on-alma {
      background: #2D4F33;
      color: #fff;
      border-color: #2D4F33
    }

    .mthd-btn.on-hw {
      background: #16A562;
      color: #fff;
      border-color: #16A562
    }

    .mthd-btn.on-grow {
      background: #BCA9F7;
      color: #2B2716;
      border-color: #BCA9F7
    }

    .mthd-btn.on-direct {
      background: #7494AA;
      color: #fff;
      border-color: #7494AA
    }

    .rrow {
      display: flex;
      align-items: center;
      padding: 7px 0;
      border-bottom: 1px solid #F2EDDB;
      gap: 10px
    }

    .rrow:last-child {
      border-bottom: none
    }

    .rlbl {
      flex: 1;
      font-size: 14px;
      font-weight: 500;
      color: #2B2716
    }

    .rreq {
      font-size: 10px;
      font-weight: 800;
      color: #ef4444;
      text-transform: uppercase;
      margin-left: 5px
    }

    .ropt {
      display: flex;
      gap: 10px
    }

    .ropt label {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600
    }

    .ropt input {
      cursor: pointer;
      accent-color: #09371F
    }

    .c-ok {
      color: #09371F
    }

    .c-err {
      color: #dc2626
    }

    .c-unk {
      color: #FBFBF3
    }

    /* ── Screener Score Entry (Assistant Window) ───────────────────────── */
    .scr-score-row {
      background: linear-gradient(135deg, #F2F9F4, #EDF6F0);
      border-radius: 8px;
      padding: 8px 12px;
      margin: 2px 0 6px 0;
      border-left: 3px solid #09371F;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      animation: scrExpand .15s ease;
    }

    @keyframes scrExpand {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .scr-score-lbl {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: #777355;
    }

    .scr-score-input {
      width: 56px;
      padding: 5px 8px;
      border: 1.5px solid #D4C99A;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 900;
      text-align: center;
      background: #fff;
      color: #09371F;
      outline: none;
      -moz-appearance: textfield;
    }

    .scr-score-input::-webkit-outer-spin-button,
    .scr-score-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .scr-score-input:focus {
      border-color: #09371F;
      box-shadow: 0 0 0 2px rgba(9, 55, 31, .14);
    }

    .scr-score-max {
      font-size: 13px;
      color: #777355;
      font-weight: 700;
    }

    .scr-indicates-chip {
      font-size: 11.5px;
      font-weight: 800;
      padding: 3px 11px;
      border-radius: 20px;
      letter-spacing: .1px;
    }

    .scr-note-area {
      width: 100%;
      box-sizing: border-box;
      min-height: 72px;
      padding: 9px 11px;
      border: 1.5px solid #D4C99A;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      background: #fff;
      color: #09371F;
      resize: vertical;
      outline: none;
      line-height: 1.5;
    }

    .scr-note-area:focus {
      border-color: #09371F;
      box-shadow: 0 0 0 2px rgba(9, 55, 31, .13);
    }

    .scr-note-area::placeholder {
      color: #B8B09A;
      font-style: italic;
    }

    /* ── Patient Info Modal (Provider Day View) ─────────────────────── */
    .pim-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      z-index: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .pim-modal {
      background: #FDFCF7;
      border-radius: 16px;
      width: 100%;
      max-width: 520px;
      max-height: calc(100vh - 32px);
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 72px rgba(0, 0, 0, .3);
      overflow: hidden;
    }

    .pim-hdr {
      background: linear-gradient(135deg, #09371F, #0d5c33);
      color: #F2EDDB;
      padding: 18px 20px 14px;
      border-radius: 16px 16px 0 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .pim-title {
      font-size: 19px;
      font-weight: 900;
      margin-bottom: 3px;
    }

    .pim-sub {
      font-size: 12px;
      opacity: .75;
      font-weight: 600;
    }

    .pim-close {
      background: rgba(255, 255, 255, .15);
      border: none;
      color: #F2EDDB;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .pim-close:hover {
      background: rgba(255, 255, 255, .28);
    }

    .pim-body {
      overflow-y: auto;
      padding: 16px 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .pim-sec-hdr {
      font-size: 10.5px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: #777355;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .scr-result-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #F7F5ED;
      border-radius: 10px;
      padding: 11px 14px;
      margin-bottom: 7px;
      border-left: 4px solid #D4C99A;
    }

    .scr-result-card:last-child {
      margin-bottom: 0;
    }

    .scr-result-name {
      font-size: 13px;
      font-weight: 900;
      min-width: 50px;
      color: #09371F;
    }

    .scr-result-score {
      font-size: 24px;
      font-weight: 900;
      line-height: 1;
    }

    .scr-result-of {
      font-size: 11px;
      color: #777355;
      font-weight: 700;
      margin-left: 1px;
    }

    .scr-result-tag {
      font-size: 12px;
      font-weight: 800;
      padding: 3px 11px;
      border-radius: 20px;
      flex-shrink: 0;
    }

    .pim-note-box {
      background: #F7F5ED;
      border-radius: 9px;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.6;
      color: #1a1a1a;
      border-left: 3px solid #09371F;
      white-space: pre-wrap;
    }

    .pim-checklist-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .pim-check-item {
      display: flex;
      align-items: center;
      gap: 7px;
      background: #F7F5ED;
      border-radius: 7px;
      padding: 7px 11px;
      font-size: 13px;
    }

    .pim-check-icon {
      font-size: 15px;
      font-weight: 900;
      flex-shrink: 0;
    }

    .pim-foot {
      padding: 10px 18px 14px;
      border-top: 1px solid #F2EDDB;
      display: flex;
      justify-content: flex-end;
    }

    /* Clickable patient name in provider day row */
    .pv-name-link {
      cursor: pointer;
      color: inherit;
      text-decoration: underline;
      text-decoration-style: dotted;
      text-underline-offset: 2px;
    }

    .pv-name-link:hover {
      color: #09371F;
      text-decoration-style: solid;
    }

    .cpt-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin: 10px 0
    }

    .cpt-tile {
      padding: 9px 7px;
      border: 2px solid #FBFBF3;
      border-radius: 7px;
      background: #fff;
      cursor: pointer;
      text-align: center;
      transition: all .15s;
      user-select: none
    }

    .cpt-tile:hover {
      border-color: #09371F;
      background: #F2EDDB
    }

    .cpt-tile.on {
      border-color: #09371F;
      background: #dcfce7
    }

    .cpt-code {
      font-size: 14px;
      font-weight: 800;
      color: #09371F
    }

    .cpt-desc {
      font-size: 10px;
      color: #777355;
      margin-top: 2px;
      line-height: 1.3
    }

    .cpt-sel-area {
      margin-top: 10px;
      padding: 10px 12px;
      background: #dcfce7;
      border-radius: 7px
    }

    .cpt-sel-lbl {
      font-size: 11px;
      font-weight: 800;
      color: #09371F;
      margin-bottom: 6px;

    /* ── Theme toggle button ─────────────────────────────────── */
    /* Made smaller + lower-contrast than the other header controls — this is
       rarely used, so it shouldn't compete visually with things staff touch
       every day. Full opacity/border return on hover so it's still easy to
       find when needed. */
    .theme-toggle {
      background: transparent;
      border: 1px solid rgba(242, 237, 219, .2);
      border-radius: 50%;
      width: 24px;
      height: 24px;
      font-size: 12px;
      cursor: pointer;

      align-items: center;
      justify-content: center;
      opacity: .55;
      transition: background .15s, opacity .15s;
      flex-shrink: 0

      background: rgba(255, 255, 255, .2);
      opacity: 1

    /* ── CPT Rate Reference Card ────────────────────────────── */
    /* Floating action button */
    .rate-fab {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 140;
      background: #09371F;
      color: #F2EDDB;
      border: none;
      border-radius: 50px;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 22px rgba(9, 55, 31, .38);
      display: flex;
      align-items: center;
      gap: 7px;
      transition: background .15s, transform .15s, box-shadow .15s;
      font-family: inherit;
      letter-spacing: .2px;
    }

    .rate-fab:hover {
      background: #16a34a;
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(9, 55, 31, .42);
    }

    .rate-fab.open {
      background: #3D768A
    }

    .rate-fab.open:hover {
      background: #09371F
    }

    /* The panel */
    .rate-panel {
      position: fixed;
      bottom: 82px;
      right: 28px;
      z-index: 140;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 44px rgba(43, 39, 22, .28);
      width: 340px;
      max-height: 72vh;
      overflow-y: auto;
      border: 1.5px solid #FBFBF3;
      animation: rate-slide-up .18s ease
    }

    @keyframes rate-slide-up {
      from {
        opacity: 0;
        transform: translateY(12px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .rate-panel-hdr {
      padding: 12px 16px;
      background: #09371F;
      color: #F2EDDB;
      border-radius: 10px 10px 0 0;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1;
      letter-spacing: .2px;
    }

    .rate-panel-sub {
      font-size: 10px;
      opacity: .65;
      font-weight: 600;
      margin-top: 2px
    }

    .rate-close-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, .65);
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
      padding: 0;
      font-family: inherit;
      transition: color .12s
    }

    .rate-close-btn:hover {
      color: #fff
    }

    .rate-section-lbl {
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: #3D768A;
      padding: 10px 16px 4px;
    }

    .rate-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-bottom: 1px solid #F2EDDB;
      cursor: pointer;
      transition: background .1s;
      user-select: none;
    }

    .rate-row:last-child {
      border-bottom: none
    }

    .rate-row:hover {
      background: #F5F5E8
    }

    .rate-row.copied {
      background: #d1fae5
    }

    .rate-code {
      font-size: 13px;
      font-weight: 800;
      color: #09371F;
      min-width: 42px;
      flex-shrink: 0
    }

    .rate-alt-badge {
      font-size: 9px;
      font-weight: 800;
      color: #fff;
      background: #3D768A;
      border-radius: 3px;
      padding: 1px 5px;
      white-space: nowrap;
      flex-shrink: 0
    }

    .rate-desc {
      font-size: 11px;
      color: #777355;
      flex: 1;
      line-height: 1.3
    }

    .rate-amt {
      font-size: 15px;
      font-weight: 800;
      color: #2B2716;
      white-space: nowrap;
      letter-spacing: -.3px
    }

    .rate-copy-icon {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: #F2EDDB;
      border: 1.5px solid #FBFBF3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      flex-shrink: 0;
      transition: all .12s;
      color: #09371F;
      cursor: pointer;
    }

    .rate-row:hover .rate-copy-icon {
      background: #09371F;
      color: #F2EDDB;
      border-color: #09371F
    }

    .rate-row.copied .rate-copy-icon {
      background: #16a34a;
      color: #fff;
      border-color: #16a34a
    }

    .rate-panel-footer {

    ══════════════════════════════════════════════════════════════ */
    .comm-icon-btn {
      display: inline-flex;
      align-items: center;
      position: relative;
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
      line-height: 1;
    }

    .ci-bubble {
      font-size: 16px;
      line-height: 1;
      display: block;
    }

    .ci-bubble.ci-empty {
      opacity: .28;
      filter: grayscale(1);
    }

    .ci-bubble.ci-has {
      opacity: .55;
    }

    .comm-icon-red .ci-bubble {
      filter: none;
      opacity: 1;
    }

    .comm-icon-yellow-exclaim .ci-bubble {
      filter: none;
      opacity: 1;
    }

    .comm-icon-yellow .ci-bubble {
      filter: none;
      opacity: 1;
      text-shadow: 0 0 7px rgba(245, 158, 11, .9);
    }

    .comm-icon-green .ci-bubble {
      filter: none;
      opacity: 1;
      text-shadow: 0 0 7px rgba(34, 197, 94, .9);
    }

    .ci-badge {
      position: absolute;
      top: -6px;
      right: -7px;
      min-width: 16px;
      height: 16px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 900;
      padding: 0 3px;
      border: 1.5px solid #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .25);
      pointer-events: none;
    }

    .ci-red {
      background: #DC2626;
      color: #fff;
      animation: ci-pulse 2s ease-in-out infinite;
    }

    .ci-yellow {
      background: #F59E0B;
      color: #fff;
    }

    .ci-green {
      background: #22C55E;
      color: #fff;
      animation: ci-green-pulse 2s ease-in-out infinite;
    }

    @keyframes ci-green-pulse {

      0%,
      100% {
        box-shadow: 0 1px 4px rgba(34, 197, 94, .4);
      }

      50% {
        box-shadow: 0 1px 8px rgba(34, 197, 94, .8);
      }
    }

    @keyframes ci-pulse {

      0%,
      100% {
        box-shadow: 0 1px 4px rgba(220, 38, 38, .4);
      }

      50% {
        box-shadow: 0 1px 9px rgba(220, 38, 38, .7);
      }
    }

    /* border-collapse: separate is required for position:sticky on <td> to work
       reliably across all browsers. border-spacing:0 keeps the look identical. */
    .cl-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 12px;
      table-layout: fixed
    }

    .cl-table thead th {
      background: #F1F5F9;
      color: #64748B;
      font-size: 9px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .7px;
      padding: 7px 10px;
      text-align: left;
      height: 36px;
      border-right: 1px solid rgba(30, 41, 59, .13);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      position: sticky;
      top: 0;
      z-index: 3;
      box-shadow: 0 1.5px 0 #CBD5E1, 0 2px 6px rgba(0, 0, 0, .07);
    }

    .cl-table thead th:last-child {
      border-right: none
    }

    /* Carrier group header — sticks just below the frozen thead (top = 36px = thead height).
       background must be opaque so data rows scrolling underneath are hidden. */
    .cl-carrier-group-td {
      padding: 0;
      border-right: none !important;
      background: #0D5C33;
      position: sticky;
      top: 36px;
      z-index: 2;
      box-shadow: 0 2px 8px rgba(15, 37, 55, .22);
    }

    /* With border-collapse:separate, border-bottom on <tr> is ignored — put it on <td>.
       Keep background on <tr> so that background:inherit on child cells works correctly. */
    .cl-table tbody tr {
      transition: background .1s
    }

    .cl-table tbody tr:hover {
      background: #F2EDDB
    }

    .cl-table tbody td {
      border-bottom: 1px solid #E8EFF7
    }

    .cl-table tbody tr.cl-complete {
      background: #8AAF9C
    }

    .cl-table tbody tr.cl-complete td {
      border-bottom: 1px solid #7A9E8D
    }

    .cl-table tbody tr.cl-complete:hover {
      background: #82A894
    }

    /* Patient separator — darker top border on first row of each patient group */
    .cl-table tbody tr.cl-pt-sep td {

    }

    .cl-table tbody tr.cl-pt-sep.cl-complete td {
      border-top: 2px solid #6B9E8A
    }

    body.dark .cl-table tbody tr.cl-pt-sep td {

    }

    body.dark .cl-table tbody tr.cl-pt-sep.cl-complete td {

    }

    /* Date collected / PPC / CSC lines — lighter weight than the Amount line
       so Amount reads as the headline of the block. No color set here on
       purpose: they inherit from .cl-copay-line / .cl-copay-line-owed /

    .cl-copay-row {

       Blue = data missing entirely.  Red = data present, action required.

    .cl-copay-owed {
      background: #FFF1F2 !important;

    /* ── Per-cell completion shading ──────────────────────────────────────
       Cool steel-blue = awaiting input / not yet complete.
       Applied per-column individually so each cell tracks its own status.
       Overridden on cl-complete rows (green takes priority).
    ────────────────────────────────────────────────────────────────────── */
    .cl-td-incomplete {
      background: #E6EFF8;
      /* cool steel-blue — pending / needs input */
    }

    .cl-table tbody tr:hover .cl-td-incomplete {

    /* Complete rows stay full green — no per-cell blue override */

       Sticky headers now use the same scrolling standard as desktop. Every
       "top" offset below is a pre-JS fallback only — the "Sticky header
       sync" effect in App() measures each real, currently-rendered
       header's height (including a wrapped multi-row .hdr on a narrow
       phone) and sets the correct offset in JS, so the frozen stacks stay
       gap-free and correctly stacked at any screen size or zoom level.

      .rate-panel,
