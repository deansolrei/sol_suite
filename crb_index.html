                          const paidAmt = clSt === 'Paid' && a.claimPaidAmount ? ` $${parseFloat(a.claimPaidAmount).toFixed(0)}` : '';
                          return <div className={`wk-claim-stamp ${stCls}`}>{stIcon} {clSt}{paidAmt}</div>;
                        })()}
                        <div className="wk-bottom-row">
                          <span className="wk-ins-badge" style={{ background: METHOD_COLOR[a.method] || '#4B5563', color: '#fff' }}>
                            {isDirect ? 'Clinic Submit' : (METHOD_LABEL[a.method] || a.method)}
                          </span>
                          {/* Non-billing (assistant) week: chat icon stays in bottom row */}
                          {!isBilling && onUpdateForDate && (
                            <CommChatIcon
                              appt={a}
                              onOpen={() => setCommPopup({ appt: a, ds })}
                              style={{ marginLeft: 'auto' }}
                            />
                          )}
                        </div>
                      </div>
                    );
                  })}
                  {/* Void / cancelled slots — dimmed audit entries, not counted */}
                  {dVoidAppts.map(a => {
                    const provName = (PROVIDERS.find(p => p.id === a.provID) || {}).name || '';
                    return (
                      <div key={a.id} className="wk-appt wk-void-audit" title="Excluded from counts — audit only">
                        <div className="wk-r1">
                          <span className="wk-time" style={{ textDecoration: 'line-through' }}>{fmtTime(a.time)}</span>
                          <TBadge status={a.tebraStatus} />
                        </div>
                        <div className="wk-pat" style={{ textDecoration: 'line-through', opacity: 0.6 }}>{a.patient}</div>
                        {provName && <div className="wk-prov">{provName}</div>}
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>

          {/* ── Comments Popup (assistant/biller week view) ── */}
          {commPopup && (
            <CommentsPopup
              appt={commPopup.appt}
              onUpdate={u => {
                onUpdateForDate(commPopup.ds, u);
                setCommPopup(prev => prev ? { ...prev, appt: { ...prev.appt, comms: u.comms } } : prev);
              }}
              onClose={() => setCommPopup(null)}
            />
          )}
        </div>
      );
    }

    function AssistantView({ appts, date, onUpdate, onAdd, onDelete, patientDb }) {
      const [modal, setModal] = useState(null);
      const [selectedIds, setSelectedIds] = useState(new Set());
      const [bulkAction, setBulkAction] = useState('valid');
      const [voidOpen, setVoidOpen] = useState(false);
      const [showNoteBoard, setShowNoteBoard] = useState(false);

      // ── FIX (2026-07-26): the column header row used to be a sticky <thead>
      // inside the SAME scrolling table as the data rows — sticky positioning
      // on table-internal elements (<thead>/<th>) is a notorious cross-browser
      // trouble spot (border-collapse quirks, implicit overflow computation,
      // Safari-specific bugs) and kept scrolling away with the page no matter
      // how the surrounding CSS was patched. This pulls the header out into its
      // OWN standalone sticky <div> — the exact same proven mechanism every
      // other frozen bar in this app already uses (.tbl-hd, .summary-row,
      // .pv-tabs, .wk-col-hd, .billing-frozen-header are all plain sticky
      // divs, never table elements). To keep its columns pixel-aligned with
      // the real data table below, both tables share one measured column-width
      // array (measured off the data table's own first row) applied via a
      // <colgroup> + table-layout:fixed on both, and horizontal scroll is kept
      // in sync between the two via a scroll-mirroring handler.
      const [colWidths, setColWidths] = useState(null);
      const bodyTableRef = useRef(null);
      const hdScrollRef = useRef(null);
      const bodyScrollRef = useRef(null);

      // Re-measure from scratch whenever the underlying row set changes shape
      // (new date, appointments loaded/added/removed) — reset first so the
      // table briefly goes back to natural auto-layout for one frame, then
      // the measurement effect below captures fresh natural widths.
      React.useLayoutEffect(() => {
        setColWidths(null);
      }, [date, appts.length]);

      React.useLayoutEffect(() => {
        if (colWidths) return;
        const tbl = bodyTableRef.current;
        if (!tbl) return;
        const firstRow = tbl.querySelector('tbody tr');
        if (!firstRow) return;
        const widths = Array.from(firstRow.children).map(td => td.getBoundingClientRect().width);
        if (widths.length && widths.every(w => w > 0)) setColWidths(widths);
      });

      useEffect(() => {
        function onResize() { setColWidths(null); }
        window.addEventListener('resize', onResize);
        return () => window.removeEventListener('resize', onResize);
      }, []);

      function syncHorizScroll() {
        if (hdScrollRef.current && bodyScrollRef.current) {
          hdScrollRef.current.scrollLeft = bodyScrollRef.current.scrollLeft;
        }
      }

      // Split into active appointments and void (No-show / Rescheduled / Cancelled).
      // Void slots are removed from the main table and shown in a collapsed audit
      // section at the bottom — they cannot be edited and never count as unsigned.
      // Placeholder patients (calendar blocks) are excluded entirely from all views.
      const allSorted = [...appts].sort((a, b) => timeToMinutes(a.time) - timeToMinutes(b.time));
      const sorted = allSorted.filter(a => !isVoidAppt(a) && !isPlaceholderPatient(a.patient));   // active → main table
      const voidAppts = allSorted.filter(a => isVoidAppt(a));   // void   → audit archive

      function save(updated) {
        onUpdate(updated);
        setModal(null);
      }
      function cellCls(v) { return v === true ? 'cv' : v === false ? 'ce' : 'cp'; }

      function toggleSelect(id, e) {
        e.stopPropagation();
        setSelectedIds(prev => {
          const next = new Set(prev);
          if (next.has(id)) next.delete(id); else next.add(id);
          return next;
        });
      }

      function toggleAll(e) {
        e.stopPropagation();
        // Only select/deselect active appointments — void rows are read-only.
        if (selectedIds.size === sorted.length) {
          setSelectedIds(new Set());
        } else {
          setSelectedIds(new Set(sorted.map(a => a.id)));
        }
      }

      function applyBulk() {
        const selected = sorted.filter(a => selectedIds.has(a.id));
        if (!selected.length) return;
        if (bulkAction === 'delete') {
          if (!onDelete) return;
          selected.forEach(a => onDelete(a.id));
        } else if (bulkAction === 'valid') {
          // Valid: set method.valid=true AND auto-check all 3 required items,
          // matching the behaviour of the 🟢 Valid button inside the appointment modal.
          selected.forEach(a => {
            const method = a.method || 'direct';
            const next = {
              ...a,
              [method]: { ...(a[method] || {}), valid: true },
              intake: true,
              ins: true,
              autopay: true,
            };
            onUpdate({ ...next, status: computeStatus(next) });
          });
        } else {
          // Issue: set method.valid=false, leave the 3 checkboxes as-is.
          selected.forEach(a => {
            const method = a.method || 'direct';
            const next = { ...a, [method]: { ...(a[method] || {}), valid: false } };
            onUpdate({ ...next, status: computeStatus(next) });
          });
        }
        setSelectedIds(new Set());
      }

      const allSelected = sorted.length > 0 && selectedIds.size === sorted.length;
      const someSelected = selectedIds.size > 0 && selectedIds.size < sorted.length;

      return (
        <div>
          <div className="act-bar">
            {selectedIds.size > 0 && (
              <div className="bulk-bar">
                <span className="bulk-bar-count">{selectedIds.size} selected</span>
                <select value={bulkAction} onChange={e => setBulkAction(e.target.value)}>
                  <option value="valid">✅ Valid</option>
                  <option value="issue">🔴 Issue</option>
                  <option value="delete">🗑 Delete</option>
                </select>
                <button
                  className={`bulk-apply${bulkAction === 'delete' ? ' del' : ''}`}
                  onClick={applyBulk}>
                  Apply
                </button>
                <button className="bulk-clear-btn" onClick={() => setSelectedIds(new Set())}>✕ Clear</button>
              </div>
            )}
            <button className="add-btn" onClick={() => setModal('add')}>+ Add Appointment</button>
          </div>
          <div className="tbl-hd">
            <div className="tbl-title">Assistant View — {fmtDate(date)}</div>
            <div className="tbl-hint">Click any row to edit · {sorted.length} appointment{sorted.length !== 1 ? 's' : ''}</div>
          </div>
          {/* ── Standalone sticky column-header banner — see the block comment
              at the top of AssistantView for why this is a plain div now
              instead of a sticky <thead>/<th>. overflow-x:hidden + the
              scrollLeft mirror below keep it in horizontal lockstep with the
              real data table when the table needs to scroll sideways. ── */}
          <div className="asst-hd-sticky" ref={hdScrollRef}>
            <table className="asst-table" style={{ tableLayout: colWidths ? 'fixed' : 'auto' }}>
              {colWidths && (
                <colgroup>
                  {colWidths.map((w, i) => <col key={i} style={{ width: w }} />)}
                </colgroup>
              )}
              <thead className="asst-thead">
                <tr>
                  <th className="cb-col">
                    <input
                      type="checkbox"
                      className="bulk-chk"
                      checked={allSelected}
                      ref={el => { if (el) el.indeterminate = someSelected; }}
                      onChange={toggleAll}
                      title="Select all"
                    />
                  </th>
                  <th>Time</th><th>Patient</th><th>Method</th>
                  <th>Billing</th><th>Intake</th><th>Ins.</th><th>Autopay</th>
                  <th>PHQ-9</th><th>GAD-7</th><th>PCL-5</th>
                  <th>Unsigned</th><th title="Clinic note formatting status — click badge to cycle">Note Status</th><th title="Comments">💬</th><th>Tebra</th><th>Signed</th>
                </tr>
              </thead>
            </table>
          </div>
          <div className="tbl-wrap">
            <div className="tbl-scroll" ref={bodyScrollRef} onScroll={syncHorizScroll}>
              <table ref={bodyTableRef} className="asst-table" style={{ tableLayout: colWidths ? 'fixed' : 'auto' }}>
                {colWidths && (
                  <colgroup>
                    {colWidths.map((w, i) => <col key={i} style={{ width: w }} />)}
                  </colgroup>
                )}
                <tbody>
                  {sorted.length === 0 && (
                    <tr><td colSpan={16} style={{ textAlign: 'center', padding: 32, color: '#777355' }}>No appointments for this date.</td></tr>
                  )}
                  {sorted.map(a => {
                    const ms = methodStatus(a);
                    const displayUnsigned = filterDisplayUnsigned(a.unsigned, date);
                    const isSelected = selectedIds.has(a.id);
                    const rowCls = [a.out ? 'dim' : '', isSelected ? 'row-sel' : ''].filter(Boolean).join(' ');
                    return (
                      <tr key={a.id} className={rowCls} onClick={() => setModal(a)}>
                        <td className="cb-col" onClick={e => e.stopPropagation()}>
                          <input
                            type="checkbox"
                            className="bulk-chk"
                            checked={isSelected}
                            onChange={e => toggleSelect(a.id, e)}
                          />
                        </td>
                        <td style={{ fontWeight: 800, whiteSpace: 'nowrap', fontSize: 13 }}>{fmtTime(a.time)}</td>
                        <td className="td-patient" style={{ fontWeight: 700 }}>
                          {a.patient}
                          {a.directIns && <div className="td-ins-name" style={{ fontSize: 11, fontWeight: 600, marginTop: 2 }}>{a.directIns}</div>}
                        </td>
                        <td><span className="td-method-lbl" style={{ fontSize: 10, fontWeight: 800, textTransform: 'uppercase', letterSpacing: .4 }}>{METHOD_LABEL[a.method] || a.method}</span>
                          {ms.text && <div className={`td-method-status${ms.valid === true ? ' tm-ok' : ms.valid === false ? ' tm-err' : ' tm-pend'}`} style={{ fontSize: 11, fontWeight: 600, marginTop: 2 }}>{ms.text}</div>}
                        </td>
                        <td className={ms.valid === true ? 'cv' : ms.valid === false ? 'ce' : 'cp'}>{ms.valid === true ? '✓ Valid' : ms.valid === false ? '✗ Issue' : '⏳'}</td>
                        <td className={cellCls(a.intake)}>{a.intake === true ? '✓' : a.intake === false ? '✗' : '?'}</td>
                        <td className={cellCls(a.ins)}>{a.ins === true ? '✓' : a.ins === false ? '✗' : '?'}</td>
                        <td className={cellCls(a.autopay)}>{a.autopay === true ? '✓' : a.autopay === false ? '✗' : '?'}</td>
                        {['PHQ-9', 'GAD-7', 'PCL-5'].map(s => {
                          const v = a.scr?.[s];
                          const sc = a.scrData?.[s]?.score;
                          const r = (v === true && sc !== '' && sc !== undefined) ? getScrResult(s, sc) : null;
                          return (
                            <td key={s} className={cellCls(v)} style={{ whiteSpace: 'nowrap' }}>
                              {v === true
                                ? r
                                  ? <span title={r.text} style={{ fontWeight: 800, color: r.color }}>{sc}</span>
                                  : '✓'
                                : v === false ? '✗' : '?'}
                            </td>
                          );
                        })}
                        <td>{displayUnsigned.map((u, i) => <span key={i} className="uns-tag">{fmtUnsignedDate(u)}</span>)}</td>
                        {/* NOTE STATUS — inline click-to-cycle for assistants */}
                        <td style={{ whiteSpace: 'nowrap' }} onClick={e => e.stopPropagation()}>
                          {(() => {
                            const ns = a.noteStatus || '';
                            const info = NS_LABELS[ns] || NS_LABELS[''];
                            function cycleNs() {
                              const next = NS_CYCLE[(NS_CYCLE.indexOf(ns) + 1) % NS_CYCLE.length];
                              onUpdate({ ...a, noteStatus: next });
                            }
                            return (
                              <button
                                className={`ns-badge ${info.cls}`}
                                style={{ cursor: 'pointer', border: 'none', font: 'inherit', padding: '3px 8px' }}
                                onClick={cycleNs}
                                title="Click to advance note status">
                                {info.icon} {info.label}
                              </button>
                            );
                          })()}
                        </td>
                        <td style={{ textAlign: 'center' }} onClick={e => e.stopPropagation()}>
                          <CommChatIcon appt={a} onOpen={() => setModal(a)} />
                        </td>
                        <td style={{ whiteSpace: 'nowrap' }}>
                          {a.tebraStatus
                            ? <TBadge status={a.tebraStatus} />
                            : <span className="ts-none-cell">—</span>}
                        </td>
                        <td style={{ textAlign: 'center', whiteSpace: 'nowrap' }}>
                          {a.out
                            ? <span style={{ background: '#fff', border: '1px solid #16a34a', color: '#16a34a', borderRadius: 0, padding: '3px 9px', fontSize: 11, fontWeight: 800 }}>✓ Signed</span>
                            : <span style={{ color: '#94a3b8', fontSize: 12 }}>—</span>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          {/* ── Void Appointment Audit Archive ─────────────────────────────
              Collapsed by default. No-show / Rescheduled / Cancelled slots are
              shown here for audit purposes and excluded from all counts/edits. */}
          {voidAppts.length > 0 && (
            <div className="void-archive-wrap">
              <button
                className="void-archive-toggle"
                onClick={() => setVoidOpen(o => !o)}
                title="Void appointments are excluded from unsigned counts and Provider view"
              >
                <span className={`va-chevron${voidOpen ? ' open' : ''}`}>▶</span>
                Void / Cancelled Archive
                <span className="void-archive-count">{voidAppts.length}</span>
                <span style={{ marginLeft: 'auto', fontSize: 10, fontWeight: 600, letterSpacing: 0, textTransform: 'none', color: '#9CA3AF' }}>
                  Excluded from counts · read-only
                </span>
              </button>
              {voidOpen && (
                <div className="void-archive-table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>Time</th>
                        <th>Patient</th>
                        <th>Tebra Status</th>
                        <th>Method</th>
                        <th>Notes</th>
                      </tr>
                    </thead>
                    <tbody>
                      {voidAppts.map(a => (
                        <tr key={a.id}>
                          <td>{fmtTime(a.time)}</td>
                          <td><span className="void-archive-name">{a.patient}</span></td>
                          <td><TBadge status={a.tebraStatus} /></td>
                          <td>{METHOD_LABEL[a.method] || a.method || '—'}</td>
                          <td style={{ maxWidth: 200, fontSize: 11 }}>{a.notes || '—'}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          )}

          {modal && modal !== 'add' && <PatientModal appt={modal} onSave={save} onUpdate={onUpdate} onClose={() => setModal(null)} onDelete={onDelete ? (id) => { onDelete(id); setModal(null); } : undefined} />}
          {modal === 'add' && <AddModal onSave={a => { onAdd(a); setModal(null); }} onClose={() => setModal(null)} patientDb={patientDb} />}

          {/* ── Note Board panel ── */}
          {showNoteBoard && <NoteBoardPanel onClose={() => setShowNoteBoard(false)} role="assistant" provFilter="" />}

          {/* Note Board FAB */}
          <button
            className={`nb-fab${showNoteBoard ? ' open' : ''}`}
            style={{ right: 24 }}
            onClick={e => { e.stopPropagation(); setShowNoteBoard(o => !o); }}
            title="Note Board — clinic note formatting status">
            📝 {showNoteBoard ? 'Close Notes' : 'Note Board'}
          </button>

          {/* Phone-only equivalent of the button above (see MobileToolsMenu) */}
          <MobileToolsMenu items={[
            { key: 'notes', label: 'Note Board', icon: '📝', active: showNoteBoard, onClick: () => setShowNoteBoard(o => !o) },
          ]} />
        </div>
      );
    }

    /* ════════════════════════════════════════════════════════════════
       CPT RATE REFERENCE CARD
       Floating panel — accessible from Billing View at all times.
       Click any row to copy the charge to clipboard.
    ════════════════════════════════════════════════════════════════ */
    const RATE_GROUPS = [
      {
        label: 'New Patient (E&M)', rows: [
          { code: '99205', alt: '98003', desc: '60 min', amount: 484.18 },
          { code: '99204', alt: '98002', desc: '45 min', amount: 375.99 },
        ]
      },
      {
        label: 'Follow-up (E&M)', rows: [
          { code: '99215', alt: '98007', desc: '40 min', amount: 362.60 },
          { code: '99214', alt: '98006', desc: '30 min', amount: 258.72 },
        ]
      },
      {
        label: 'Psychotherapy Add-ons', rows: [
          { code: '90833', alt: null, desc: '+16–37 min', amount: 173.38 },
          { code: '90836', alt: null, desc: '+38–52 min', amount: 230.44 },
          { code: '90838', alt: null, desc: '+53+ min', amount: 274.15 },
        ]
      },
      {
        label: 'Complexity', rows: [
          { code: '90785', alt: null, desc: 'Interactive Complexity', amount: 30.48 },
        ]
      },
    ];

    function RateCardPanel({ onClose }) {
      const [copiedCode, setCopiedCode] = useState(null);

      function handleCopy(code, amount) {
        copyToClipboard(amount.toFixed(2), () => {
          setCopiedCode(code);
          setTimeout(() => setCopiedCode(c => c === code ? null : c), 2200);
        });
      }

      return (
        <div className="rate-panel">
          <div className="rate-panel-hdr">
            <div>
              <div>💲 CPT Charge Reference</div>
              <div className="rate-panel-sub">Click any row to copy the charge amount</div>
            </div>
            <button className="rate-close-btn" onClick={onClose}>×</button>
          </div>

          {RATE_GROUPS.map(g => (
            <div key={g.label}>
              <div className="rate-section-lbl">{g.label}</div>
              {g.rows.map(r => (
                <div
                  key={r.code}
                  className={`rate-row${copiedCode === r.code ? ' copied' : ''}`}
                  onClick={() => handleCopy(r.code, r.amount)}
                  title={`Click to copy $${r.amount.toFixed(2)}`}>
                  <div className="rate-code">{r.code}</div>
                  {r.alt && <div className="rate-alt-badge">={r.alt}</div>}
                  <div className="rate-desc">{r.desc}</div>
                  <div className="rate-amt">${r.amount.toFixed(2)}</div>
                  <div className="rate-copy-icon">
                    {copiedCode === r.code ? '✓' : '📋'}
                  </div>
                </div>
              ))}
            </div>
          ))}

          <div className="rate-panel-footer">
            <strong>BH Alt codes</strong> share the same charge as their E&amp;M equivalents:<br />
            <strong>98002</strong> = 99204 · <strong>98003</strong> = 99205 · <strong>98006</strong> = 99214 · <strong>98007</strong> = 99215
          </div>
        </div>
      );
    }

    /* ════════════════════════════════════════════════════════════════
       BILLING CHANNELS PANEL — BillingChannelsPanel
       Biller-only tool for setting each patient's Platform (Alma /
       Headway / Grow / Direct / Unknown) on the Patients tab. This is
       the "going forward" claim-submission channel: every Tebra Sync
       reads this value to stamp Method onto NEWLY CREATED appointment
       rows. It does not touch any appointment already on the calendar
       — the biller edits an individual past appointment's channel
       separately via the per-appointment selector in that appointment's
       modal.
       Props:
         patientDb       — full patient list (already loaded in BillingView)
         onClose          — close handler
         onRefreshPatients — re-fetch patientDb from the sheet after a save,
                             so the panel (and every other open view) shows
                             the current value
    ════════════════════════════════════════════════════════════════ */
    function BillingChannelsPanel({ patientDb, onClose, onRefreshPatients }) {
      const [q, setQ] = useState('');
      const [savingKey, setSavingKey] = useState(null);   // `${nameLower}:${channelId}` currently in flight
      const [localPlatform, setLocalPlatform] = useState({}); // optimistic overrides, keyed by nameLower
      const [errKey, setErrKey] = useState(null);

      const CHANNELS = [
        { id: 'Alma', cls: 'on-alma' },
        { id: 'Headway', cls: 'on-hw' },
        { id: 'Grow', cls: 'on-grow' },
        { id: 'Direct', cls: 'on-direct' },
        { id: 'Unknown', cls: 'on-unknown' },
      ];

      const list = (patientDb || [])
        .filter(p => p.firstName || p.lastName)
        .filter(p => {
          if (!q.trim()) return true;
          const full = `${p.firstName} ${p.lastName}`.toLowerCase();
          return full.includes(q.trim().toLowerCase());
        })
        .sort((a, b) => `${a.lastName}${a.firstName}`.localeCompare(`${b.lastName}${b.firstName}`));

      function currentPlatform(p) {
        const key = `${p.firstName} ${p.lastName}`.trim().toLowerCase();
        return key in localPlatform ? localPlatform[key] : (p.platform || '');
      }

      function setPlatform(p, channelId) {
        const fullName = `${p.firstName} ${p.lastName}`.trim();
        const key = fullName.toLowerCase();
        const value = channelId === 'Unknown' ? '' : channelId;
        setSavingKey(`${key}:${channelId}`);
        setErrKey(null);
        gsr('setPatientBillingChannel', fullName, value)
          .then(json => {
            const r = JSON.parse(json);
            if (r.ok) {
              setLocalPlatform(prev => ({ ...prev, [key]: r.channel }));
              if (onRefreshPatients) onRefreshPatients();
            } else {
              setErrKey(key);
              alert('Could not update billing channel for ' + fullName + ': ' + (r.error || 'unknown error'));
            }
          })
          .catch(e => {
            setErrKey(key);
            alert('Could not update billing channel for ' + fullName + ': ' + e.message);
          })
          .finally(() => setSavingKey(null));
      }

      return (
        <div className="bc-panel" onClick={e => e.stopPropagation()}>
          <div className="rate-panel-hdr">
            <div>
              <div>🔀 Billing Channels</div>
              <div className="rate-panel-sub">Sets each patient's channel going forward — applies to appointments created by future Tebra Syncs</div>
            </div>
            <button className="rate-close-btn" onClick={onClose}>×</button>
          </div>
          <div className="bc-search-wrap">
            <input
              className="fi"
              value={q}
              onChange={e => setQ(e.target.value)}
              placeholder="Search patient name…"
              autoFocus
            />
          </div>
          <div className="bc-hint">Leave "Unknown" if the channel isn't confirmed yet — appointments will show with no channel selected rather than defaulting to any platform.</div>
          {list.length === 0 && (
            <div style={{ padding: 20, textAlign: 'center', color: '#777355', fontSize: 13 }}>
              {patientDb && patientDb.length ? 'No patients match your search.' : 'No patients loaded.'}
            </div>
          )}
          {list.map(p => {
            const fullName = `${p.firstName} ${p.lastName}`.trim();
            const key = fullName.toLowerCase();
            const cur = currentPlatform(p);
            const curId = cur || 'Unknown';
            const rowSaving = savingKey && savingKey.startsWith(key + ':');
            return (
              <div className="bc-row" key={key}>
                <div className="bc-row-name">
                  <div className="bc-row-fullname">{fullName}</div>
                  {p.insurance && <div className="bc-row-ins">{p.insurance}</div>}
                </div>
                <div className="bc-row-btns">
                  {CHANNELS.map(c => {
                    const isSavingThis = savingKey === `${key}:${c.id}`;
                    return (
                      <button
                        key={c.id}
                        className={`bc-btn${curId === c.id ? ' ' + c.cls : ''}${isSavingThis ? ' saving' : ''}`}
                        disabled={!!rowSaving}
                        onClick={() => setPlatform(p, c.id)}
                        title={`Set billing channel to ${c.id === 'Direct' ? 'Clinic Submit' : c.id}`}
                      >
                        {isSavingThis ? '…' : (c.id === 'Headway' ? 'HW' : c.id === 'Direct' ? 'Clinic Submit' : c.id)}
                      </button>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    // Priority CPT display order used in Rate Analysis panel dropdowns and table rows.
    // Top 7 codes appear first (in this exact sequence); all others follow numerically.
    const RA_CPT_PRIORITY = ['99214', '99215', '90833', '90836', '90838', '99205', '99204'];

    /* ════════════════════════════════════════════════════════════════
       RATE ANALYSIS PANEL
       Props:
         onClose        — close handler
         showProviderDim — true in Billing View only; unlocks the
                           "👤 By Provider" toggle. Omit/false in
                           Provider View for the clean simple view.
    ════════════════════════════════════════════════════════════════ */
    function RateAnalysisPanel({ onClose, showProviderDim }) {
      // ── Simple (carrier-only) view state ─────────────────────────────────
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [generating, setGenerating] = useState(false);
      const [genMsg, setGenMsg] = useState('');
      const [filterCarrier, setFilterCarrier] = useState('');
      const [filterState, setFilterState] = useState('');
      const [filterCpt, setFilterCpt] = useState('');

      // ── By-Provider view state (Billing View only) ────────────────────────
      const [byProvider, setByProvider] = useState(false);
      const [provData, setProvData] = useState(null);   // null = not yet loaded
      const [provLoading, setProvLoading] = useState(false);
      const [provGenerating, setProvGenerating] = useState(false);
      const [provGenMsg, setProvGenMsg] = useState('');
      const [filterProvider, setFilterProvider] = useState('');
      const [fpCarrier, setFpCarrier] = useState('');
      const [fpState, setFpState] = useState('');
      const [fpCpt, setFpCpt] = useState('');

      // ── Load simple data on mount ─────────────────────────────────────────
      function loadData() {
        setLoading(true);
        gsr('getRateAnalysisData').then(json => {
          try { const r = JSON.parse(json); setData(Array.isArray(r) ? r : []); }
          catch (e) { setData([]); }
          setLoading(false);
        }).catch(() => { setData([]); setLoading(false); });
      }
      useEffect(() => { loadData(); }, []);

      // ── Load provider data (lazy — only on first toggle) ──────────────────
      function loadProvData() {
        setProvLoading(true);
        gsr('getProviderRateAnalysisData').then(json => {
          try { const r = JSON.parse(json); setProvData(Array.isArray(r) ? r : []); }
          catch (e) { setProvData([]); }
          setProvLoading(false);
        }).catch(() => { setProvData([]); setProvLoading(false); });
      }

      function handleToggleProvider() {
        const next = !byProvider;
        setByProvider(next);
        if (next && provData === null) loadProvData();   // lazy first load
      }

      // ── Generate handlers ─────────────────────────────────────────────────
      function handleGenerate() {
        setGenerating(true); setGenMsg('');
        gsr('generateRateAnalysis').then(json => {
          try {
            const r = JSON.parse(json);
            if (r.ok) setGenMsg(`✅ ${r.rows} rows from ${r.paidClaims} paid claims`);
            else if (r.error) setGenMsg('❌ ' + r.error);
          } catch (e) { setGenMsg('✅ Done.'); }
          setGenerating(false); loadData();
        }).catch(err => { setGenMsg('❌ ' + (err.message || 'Error')); setGenerating(false); });
      }

      function handleProvGenerate() {
        setProvGenerating(true); setProvGenMsg('');
        gsr('generateProviderRateAnalysis').then(json => {
          try {
            const r = JSON.parse(json);
            if (r.ok) setProvGenMsg(`✅ ${r.rows} rows from ${r.paidClaims} paid claims`);
            else if (r.error) setProvGenMsg('❌ ' + r.error);
          } catch (e) { setProvGenMsg('✅ Done.'); }
          setProvGenerating(false); loadProvData();
        }).catch(err => { setProvGenMsg('❌ ' + (err.message || 'Error')); setProvGenerating(false); });
      }

      // ── Priority CPT sort ─────────────────────────────────────────────────
      function raCptSortKey(cpt) {
        const idx = RA_CPT_PRIORITY.indexOf(cpt);
        return idx >= 0 ? `0_${String(idx).padStart(2, '0')}` : `1_${cpt}`;
      }

      // ── Simple view derived data ──────────────────────────────────────────
      // Valid US state/territory codes — filter guard so subscriber names or other bad data never pollute the State dropdown.
      const VALID_US_STATES_SET = new Set([
        'AL', 'AK', 'AZ', 'AR', 'CA', 'CO', 'CT', 'DE', 'FL', 'GA', 'HI', 'ID', 'IL', 'IN', 'IA',
        'KS', 'KY', 'LA', 'ME', 'MD', 'MA', 'MI', 'MN', 'MS', 'MO', 'MT', 'NE', 'NV', 'NH', 'NJ',
        'NM', 'NY', 'NC', 'ND', 'OH', 'OK', 'OR', 'PA', 'RI', 'SC', 'SD', 'TN', 'TX', 'UT', 'VT',
        'VA', 'WA', 'WV', 'WI', 'WY', 'DC', 'PR', 'VI', 'GU', 'AS', 'MP'
      ]);
      const isValidState = s => !!s && VALID_US_STATES_SET.has(String(s).trim().toUpperCase());

      const carriers = [...new Set((data || []).map(r => r.carrier).filter(Boolean))].sort();
      const states = [...new Set((data || []).map(r => r.state).filter(isValidState))].sort();
      const cpts = [...new Set((data || []).map(r => r.cpt).filter(Boolean))]
        .sort((a, b) => raCptSortKey(a).localeCompare(raCptSortKey(b)));
      const filtered = (data || [])
        .filter(r =>
          (!filterCarrier || r.carrier === filterCarrier) &&
          (!filterState || r.state === filterState) &&
          (!filterCpt || r.cpt === filterCpt)
        )
        .sort((a, b) => {
          const cc = a.carrier.localeCompare(b.carrier); if (cc) return cc;
          const cs = (a.state || '').localeCompare(b.state || ''); if (cs) return cs;
          return raCptSortKey(a.cpt).localeCompare(raCptSortKey(b.cpt));
        });

      // ── Provider view derived data ────────────────────────────────────────
      const provProviders = [...new Set((provData || []).map(r => r.provider).filter(Boolean))].sort();
      const provCarriers = [...new Set((provData || []).map(r => r.carrier).filter(Boolean))].sort();
      const provStates = [...new Set((provData || []).map(r => r.state).filter(isValidState))].sort();
      const provCpts = [...new Set((provData || []).map(r => r.cpt).filter(Boolean))]
        .sort((a, b) => raCptSortKey(a).localeCompare(raCptSortKey(b)));
      const filteredProv = (provData || [])
        .filter(r =>
          (!filterProvider || r.provider === filterProvider) &&
          (!fpCarrier || r.carrier === fpCarrier) &&
          (!fpState || r.state === fpState) &&
          (!fpCpt || r.cpt === fpCpt)
        )
        .sort((a, b) => {
          const cp = a.provider.localeCompare(b.provider); if (cp) return cp;
          const cc = a.carrier.localeCompare(b.carrier); if (cc) return cc;
          const cs = (a.state || '').localeCompare(b.state || ''); if (cs) return cs;
          return raCptSortKey(a.cpt).localeCompare(raCptSortKey(b.cpt));
        });

      const generatedAt = (data || []).length > 0 ? (data[0].generated || '') : '';
      const provGeneratedAt = (provData || []).length > 0 ? (provData[0].generated || '') : '';
      const isProvView = byProvider && showProviderDim;

      return (
        <div className="ra-panel" onClick={e => e.stopPropagation()}>

          {/* ── Header ── */}
          <div className="rate-panel-hdr">
            <div>
              <div>📊 Rate Analysis{isProvView ? ' — By Provider' : ''}</div>
              <div className="rate-panel-sub">
                {isProvView
                  ? 'Actual payments · Provider × Carrier × CPT × State'
                  : 'Actual insurance payments · Carrier × CPT × State'}
                {!isProvView && generatedAt && <span style={{ marginLeft: 8, opacity: .65 }}>Generated {generatedAt}</span>}
                {isProvView && provGeneratedAt && <span style={{ marginLeft: 8, opacity: .65 }}>Generated {provGeneratedAt}</span>}
              </div>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
              {showProviderDim && (
                <button
                  onClick={handleToggleProvider}
                  style={{
                    fontSize: 11, fontFamily: 'inherit', cursor: 'pointer', borderRadius: 0,
                    padding: '3px 9px', border: 'none', fontWeight: 700,
                    background: byProvider ? '#1C6FA3' : 'rgba(255,255,255,0.18)',
                    color: byProvider ? '#fff' : '#F2EDDB',
                    transition: 'background 0.18s',
                  }}
                  title={byProvider ? 'Switch back to Carrier view' : 'Break down rates by individual provider'}>
                  👤 By Provider
                </button>
              )}
              <button className="rate-close-btn" onClick={onClose}>×</button>
            </div>
          </div>

          {/* ── Toolbar ── */}
          <div className="ra-toolbar">
            {!isProvView ? (<>
              <button className="ra-gen-btn" onClick={handleGenerate} disabled={generating}>
                {generating ? '⏳ Generating…' : '🔄 Refresh Rate Data'}
              </button>
              {genMsg && <span style={{ fontSize: 11, color: genMsg.startsWith('✅') ? '#065F46' : '#dc2626', fontWeight: 600 }}>{genMsg}</span>}
              {!genMsg && filtered.length > 0 && <span className="ra-toolbar-info">{filtered.length} rate{filtered.length !== 1 ? 's' : ''}</span>}
            </>) : (<>
              <button className="ra-gen-btn" onClick={handleProvGenerate} disabled={provGenerating}
                style={{ background: '#1E3A8A' }}>
                {provGenerating ? '⏳ Generating…' : '🔄 Refresh Provider Data'}
              </button>
              {provGenMsg && <span style={{ fontSize: 11, color: provGenMsg.startsWith('✅') ? '#065F46' : '#dc2626', fontWeight: 600 }}>{provGenMsg}</span>}
              {!provGenMsg && filteredProv.length > 0 && <span className="ra-toolbar-info">{filteredProv.length} rate{filteredProv.length !== 1 ? 's' : ''}</span>}
            </>)}
          </div>

          {/* ── Filters: simple view ── */}
          {!isProvView && (
            <div className="ra-panel-filters">
              <select className="ra-sel" value={filterCarrier} onChange={e => setFilterCarrier(e.target.value)}>
                <option value="">All Carriers</option>
                {carriers.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
              <select className="ra-sel" value={filterState} onChange={e => setFilterState(e.target.value)}>
                <option value="">All States</option>
                {states.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
              <select className="ra-sel" value={filterCpt} onChange={e => setFilterCpt(e.target.value)}>
                <option value="">All CPT</option>
                {cpts.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
          )}

          {/* ── Filters: provider view ── */}
          {isProvView && (
            <div className="ra-panel-filters">
              <select className="ra-sel" value={filterProvider} onChange={e => setFilterProvider(e.target.value)}>
                <option value="">All Providers</option>
                {provProviders.map(p => <option key={p} value={p}>{p}</option>)}
              </select>
              <select className="ra-sel" value={fpCarrier} onChange={e => setFpCarrier(e.target.value)}>
                <option value="">All Carriers</option>
                {provCarriers.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
              <select className="ra-sel" value={fpState} onChange={e => setFpState(e.target.value)}>
                <option value="">All States</option>
                {provStates.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
              <select className="ra-sel" value={fpCpt} onChange={e => setFpCpt(e.target.value)}>
                <option value="">All CPT</option>
                {provCpts.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
          )}

          {/* ── Table: simple view ── */}
          {!isProvView && (<>
            {loading && <div className="ra-empty">Loading rate data…</div>}
            {!loading && filtered.length === 0 && (
              <div className="ra-empty">
                {(data || []).length === 0
                  ? <>No rate data yet.<br />Click <strong>Refresh Rate Data</strong> to generate<br />(requires paid claims with CPT codes in the sheet).</>
                  : 'No results match the current filters.'}
              </div>
            )}
            {!loading && filtered.length > 0 && (
              <div style={{ overflowX: 'auto' }}>
                <table className="ra-table">
                  <thead>
                    <tr>
                      <th>Carrier</th><th>ST</th><th>CPT</th>
                      <th className="ra-right">#</th>
                      <th className="ra-right">Avg Paid</th>
                      <th className="ra-right">Min</th>
                      <th className="ra-right">Max</th>
                      <th>Last Paid</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filtered.map((r, i) => (
                      <tr key={i}>
                        <td className="ra-carrier-cell" title={r.carrier}>{r.carrier}</td>
                        <td style={{ fontWeight: 700 }}>{r.state || '—'}</td>
                        <td className="ra-cpt-cell">{r.cpt}</td>
                        <td className="ra-right" style={{ color: '#666' }}>{r.count}</td>
                        <td className="ra-right ra-avg-cell">${r.avg.toFixed(2)}</td>
                        <td className="ra-right ra-minmax-cell">${r.min.toFixed(2)}</td>
                        <td className="ra-right ra-minmax-cell">${r.max.toFixed(2)}</td>
                        <td style={{ color: '#888', fontSize: 10 }}>{r.lastDate || '—'}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </>)}

          {/* ── Table: by-provider view ── */}
          {isProvView && (<>
            {provLoading && <div className="ra-empty">Loading provider rate data…</div>}
            {!provLoading && filteredProv.length === 0 && (
              <div className="ra-empty">
                {(provData || []).length === 0
                  ? <>No provider rate data yet.<br />Click <strong>Refresh Provider Data</strong> to generate<br />(requires paid direct-pay claims with CPT codes).</>
                  : 'No results match the current filters.'}
              </div>
            )}
            {!provLoading && filteredProv.length > 0 && (
              <div style={{ overflowX: 'auto' }}>
                <table className="ra-table">
                  <thead>
                    <tr>
                      <th>Provider</th><th>Carrier</th><th>ST</th><th>CPT</th>
                      <th className="ra-right">#</th>
                      <th className="ra-right">Avg Paid</th>
                      <th className="ra-right">Min</th>
                      <th className="ra-right">Max</th>
                      <th>Last Paid</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filteredProv.map((r, i) => (
                      <tr key={i}>
                        <td style={{ fontWeight: 700, color: '#1C6FA3', whiteSpace: 'nowrap' }}>{r.provider}</td>
                        <td className="ra-carrier-cell" title={r.carrier}>{r.carrier}</td>
                        <td style={{ fontWeight: 700 }}>{r.state || '—'}</td>
                        <td className="ra-cpt-cell">{r.cpt}</td>
                        <td className="ra-right" style={{ color: '#666' }}>{r.count}</td>
                        <td className="ra-right ra-avg-cell">${r.avg.toFixed(2)}</td>
                        <td className="ra-right ra-minmax-cell">${r.min.toFixed(2)}</td>
                        <td className="ra-right ra-minmax-cell">${r.max.toFixed(2)}</td>
                        <td style={{ color: '#888', fontSize: 10 }}>{r.lastDate || '—'}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </>)}

        </div>
      );
    }

    /* ════════════════════════════════════════════════════════════════
       CLAIM SUBMIT MODAL
       Powerhouse biller window for method='direct' appointments.
       Opens when a Clinic Submit row is clicked in Billing Day View.
    ════════════════════════════════════════════════════════════════ */
    function ClaimSubmitModal({ appt, patientDb, onUpdate, onPaymentSave, onClose, onRefreshPatients }) {
      const ptRec = (patientDb || []).find(p =>
        `${p.firstName} ${p.lastName}`.toLowerCase() === (appt.patient || '').toLowerCase()
      ) || {};

      // Provider-specific NPI options for this appointment's provider.
      // Lookup is case-insensitive; also checks provID against provider name fragments
      // as a fallback for appointments where the ID may not be an exact key match.
      const _resolveProvNpis = () => {
        if (!appt.provID) return { rendering: [], billing: [] };
        const key = appt.provID.toLowerCase().trim();
        if (PROV_NPIS[key]) return PROV_NPIS[key];
        // Try partial match (e.g. "Jodene Jensen" → "jodene")
        const matched = Object.keys(PROV_NPIS).find(k => key.includes(k) || k.includes(key));
        return matched ? PROV_NPIS[matched] : { rendering: [], billing: [] };
      };
      const provNpis = _resolveProvNpis();

      // Parse saved best-channel recommendation (used for pre-selection + mismatch banner)
      const _savedChannel = (() => {
        try { return ptRec.bestChannel ? JSON.parse(ptRec.bestChannel) : null; }
        catch (e) { return null; }
      })();

      // ── Static patient fields ─────────────────────────────────
      // claimPlatform: use saved value; fall back to portal bundled in savedChannel JSON
      const [claimPlatform, setClaimPlatform] = useState(
        ptRec.claimPlatform || (_savedChannel && _savedChannel.claimPlatform) || ''
      );
      const [insurance, setInsurance] = useState(appt.directIns || ptRec.insurance || '');
      const [memberID, setMemberID] = useState(ptRec.memberID || '');
      const [memberDOB, setMemberDOB] = useState(ptRec.memberDOB || '');
      const [pcn, setPcn] = useState(ptRec.pcn || '');
      const [groupNumber, setGroupNumber] = useState(ptRec.groupNumber || '');
      const [primarySubscriber, setPrimarySubscriber] = useState(ptRec.primarySubscriber || '');
      const [patientState, setPatientState] = useState(ptRec.patientState || '');
      const [renderingNPI, setRenderingNPI] = useState(ptRec.renderingNPI || provNpis.rendering[0] || '');
      const [billingNPI, setBillingNPI] = useState(ptRec.billingNPI || provNpis.billing[0] || '');
      const [xCode, setXCode] = useState(ptRec.xCode || '');
      const [paymentPlatform, setPaymentPlatform] = useState(ptRec.paymentPlatform || '');
      const [paymentType, setPaymentType] = useState(appt.paymentType || ptRec.patientPortion || '');
      const [paymentRate, setPaymentRate] = useState(appt.paymentRate || ptRec.rate || '');

      // ── Claim tracking & payout (per-appointment, saved with the appointment) ──
      const [claimSubmittedDate, setClaimSubmittedDate] = useState(appt.claimSubmittedDate || '');
      const [claimID, setClaimID] = useState(appt.claimID || '');
      const [claimStatus, setClaimStatus] = useState(appt.claimStatus || '');
      const [claimStatusNotes, setClaimStatusNotes] = useState(appt.claimStatusNotes || '');
      const [claimPaidDate, setClaimPaidDate] = useState(appt.claimPaidDate || '');
      const [claimPaidAmount, setClaimPaidAmount] = useState(appt.claimPaidAmount || '');
      const [claimCheckID, setClaimCheckID] = useState(appt.claimCheckID || '');
      const [claimDepositBank, setClaimDepositBank] = useState(appt.claimDepositBank || '');
      const [claimDepositDate, setClaimDepositDate] = useState(appt.claimDepositDate || '');
      const [claimERA, setClaimERA] = useState(appt.claimERA || '');
      const [claimBundled, setClaimBundled] = useState(!!appt.claimBundled);
      const [claimBundledAmount, setClaimBundledAmount] = useState(appt.claimBundledAmount || '');
      const [claimDepositAmount, setClaimDepositAmount] = useState(appt.claimDepositAmount || '');

      const [savingPt, setSavingPt] = useState(false);
      const [ptSaved, setPtSaved] = useState(false);

      // ── Appointment-level fields (local copy) ─────────────────
      const [bestChannel, setBestChannel] = React.useState(null);
      const [bestChannelLoading, setBestChannelLoading] = React.useState(false);
      const [savingChannel, setSavingChannel] = React.useState(false);
      const [channelSaved, setChannelSaved] = React.useState(false);
      const [localAppt, setLocalAppt] = useState({ ...appt });

      React.useEffect(() => {
        if (!insurance || !patientState || insurance.toLowerCase().includes('cash')) { setBestChannel(null); return; }
        setBestChannelLoading(true); setBestChannel(null);
        fetch('http://192.168.88.178:8000/api/best-channel?carrier=' + encodeURIComponent(insurance) +
          '&state=' + encodeURIComponent(patientState) + '&cpts=' + encodeURIComponent(normCpt(localAppt.cpt).join(',') || '99214'))
          .then(r => r.json()).then(d => { setBestChannelLoading(false); setBestChannel(d); })
          .catch(() => setBestChannelLoading(false));
      }, [insurance, patientState]);

      // ── Inner modal state ─────────────────────────────────────
      const [cptOpen, setCptOpen] = useState(false);
      const [rxOpen, setRxOpen] = useState(false);
      const [copiedCpt, setCopiedCpt] = useState(null);

      function copyCptRate(code, e) {
        e.stopPropagation();
        const rate = CPT_RATES[code];
        if (rate == null) return;
        copyToClipboard(rate.toFixed(2), () => {
          setCopiedCpt(code);
          setTimeout(() => setCopiedCpt(c => c === code ? null : c), 2200);
        });
      }

      function saveChannelToPatient() {
        if (!bestChannel || !bestChannel.overall_best_channel) return;
        const ch = bestChannel.overall_best_channel;
        const r99 = (bestChannel.cpt_results || []).find(r => r.cpt_code === '99214');
        const payload = JSON.stringify({
          channel: ch,
          payer: bestChannel.canonical_payer || '',
          state: bestChannel.state || '',
          rate: r99 ? r99.best_rate : null,
          cpts: normCpt(localAppt.cpt).join(',') || '99214',
          updatedAt: new Date().toISOString().slice(0, 10),
          claimPlatform: claimPlatform || '',   // remember which portal was selected at save time
        });
        setSavingChannel(true);
        setChannelSaved(false);
        gsr('savePatientBestChannel', appt.patient, payload)
          .then(() => {
            setSavingChannel(false);
            setChannelSaved(true);
            setTimeout(() => setChannelSaved(false), 3500);
            if (onRefreshPatients) onRefreshPatients();
          })
          .catch(() => setSavingChannel(false));
      }

      function savePatientRecord() {
        setSavingPt(true);
        setPtSaved(false);
        gsr('savePatientClaimRecord', appt.patient, JSON.stringify({
          claimPlatform, insurance, memberID, memberDOB, pcn,
          groupNumber, primarySubscriber, patientState,
          renderingNPI, billingNPI, xCode,
          paymentPlatform
        })).then(raw => {
          setSavingPt(false);
          try {
            const r = JSON.parse(raw);
            if (r && r.ok === false) {
              console.error('savePatientClaimRecord failed:', r.error);
              // Still show saved — GAS may return ok:false on minor issues
            }
          } catch (e) { }
          setPtSaved(true);
          setTimeout(() => setPtSaved(false), 3500);
          // Refresh the in-memory patient database so the next modal open shows current data
          if (onRefreshPatients) onRefreshPatients();
        }).catch(() => setSavingPt(false));
      }

      // Merge local appt edits + billing fields and call onUpdate
      function buildFinalAppt(overrides) {
        return {
          ...localAppt,
          directIns: insurance,
          paymentType,
          paymentRate,
          // Claim tracking fields
          claimSubmittedDate,
          claimID,
          claimStatus,
          claimStatusNotes,
          claimPaidDate,
          claimPaidAmount,
          claimCheckID,
          claimDepositBank,
          claimDepositDate,
          claimERA,
          claimBundled,
          claimBundledAmount,
          claimDepositAmount,
          ...overrides,
        };
      }

      const hasCpt = normCpt(localAppt.cpt).length > 0;
      const isSigned = !!localAppt.out;
      const canSubmit = hasCpt && isSigned && localAppt.billing !== 'submitted';
      const isSubmitted = localAppt.billing === 'submitted';

      function handleSubmit() {
        // Auto-stamp submitted date and default status on first submission
        const today = new Date().toISOString().slice(0, 10);
        const submittedDate = claimSubmittedDate || today;
        const status = claimStatus || 'Pending';
        if (!claimSubmittedDate) setClaimSubmittedDate(submittedDate);
        if (!claimStatus) setClaimStatus(status);
        onUpdate(buildFinalAppt({
          billing: 'submitted',
          claimSubmittedDate: submittedDate,
          claimStatus: status,
        }));
        onClose();
      }
      function handleSave() {
        const billing = hasCpt && isSigned ? 'ready' : localAppt.billing;
        onUpdate(buildFinalAppt({ billing }));
        onClose();
      }

      const prov = PROVIDERS.find(p => p.id === appt.provID);
      const provName = prov ? prov.name.split(' ').slice(-1)[0] : appt.provID;

      return (
        <>
          <div className="overlay csm-overlay" onClick={onClose}>
            <div className="modal csm-modal" onClick={e => e.stopPropagation()}>

              {/* ── Header ── */}
              <div className="m-hdr">
                <div>
                  <div className="m-title">📋 Clinic Submit</div>
                  <div className="csm-header-meta">
                    <span style={{ fontWeight: 700 }}>{appt.patient}</span>
                    <span>·</span>
                    <span>{fmtTime(appt.time)}</span>
                    <span>·</span>
                    <span>{fmtDate(appt.date)}</span>
                    <span>·</span>
                    <span>{provName}</span>
                    {appt.tebraStatus && <TBadge status={appt.tebraStatus} />}
                  </div>
                </div>
                <button className="m-close" onClick={onClose}>×</button>
              </div>

              <div className="csm-body">

                {/* ── Mismatch banner: saved recommendation is NOT Clinic Submit ── */}
                {_savedChannel && _savedChannel.channel && _savedChannel.channel !== 'Clinic Submit' && (() => {
                  const BC = {
                    'Headway': { bg: '#16A562', bd: '#16A562', tx: '#fff', lb: 'Headway' },
                    'Alma': { bg: '#2D4F33', bd: '#2D4F33', tx: '#fff', lb: 'Alma' },
                    'Grow Therapy': { bg: '#BCA9F7', bd: '#BCA9F7', tx: '#2B2716', lb: 'Grow Therapy' },
                  };
                  const bc = BC[_savedChannel.channel] || { bg: '#fef9c3', bd: '#ca8a04', tx: '#713f12', lb: _savedChannel.channel };
                  const rate = _savedChannel.rate ? ` · $${parseFloat(_savedChannel.rate).toFixed(2)}/99214` : '';
                  return (
                    <div style={{ marginBottom: 12, padding: '10px 14px', background: bc.bg, border: `1.5px solid ${bc.bd}`, borderRadius: 8, display: 'flex', alignItems: 'center', gap: 10 }}>
                      <span style={{ fontSize: '1.1rem' }}>⚠</span>
                      <div>
                        <span style={{ color: bc.tx, fontWeight: 800, fontSize: '.78rem' }}>
                          Saved recommendation: {bc.lb} pays best{rate}
                        </span>
                        <span style={{ color: bc.tx, opacity: .7, fontSize: '.72rem', marginLeft: 8 }}>
                          Clinic Submit billing may pay less for this patient
                        </span>
                      </div>
                    </div>
                  );
                })()}

                {/* ── Section 1: Patient Claim Record ── */}
                <div className="csm-section csm-static">
                  <div className="csm-section-title">🗂 Patient Claim Record</div>
                  {/* ── Insurance Carrier & Subscriber ── */}
                  <div className="csm-fields-group-lbl">Insurance Carrier &amp; Subscriber</div>
                  <div className="csm-grid-2">
                    <div className="csm-field">
                      <label>Claim Submission Gateway</label>
                      <select value={claimPlatform} onChange={e => setClaimPlatform(e.target.value)}>
                        <option value="">— Select —</option>
                        {CLAIM_PLATFORMS.map(p => <option key={p} value={p}>{p}</option>)}
                      </select>
                    </div>
                    <div className="csm-field">
                      <label>Insurance Carrier</label>
                      <input value={insurance} onChange={e => setInsurance(e.target.value)} placeholder="e.g. Ambetter" />
                    </div>
                  </div>
                  {/* ── Best Channel Badge ── */}
                  {(bestChannelLoading || bestChannel) && (
                    <div style={{ margin: '2px 0 10px', padding: '10px 14px', background: '#f8fafc', border: '1px solid #e2e8f0', borderRadius: '8px', fontSize: '.78rem' }}>
                      <div style={{ fontWeight: 700, fontSize: '.68rem', letterSpacing: '.5px', textTransform: 'uppercase', color: '#64748b', marginBottom: '6px' }}>💰 Best Billing Channel</div>
                      {bestChannelLoading && <span style={{ color: '#94a3b8' }}>Checking rates…</span>}
                      {bestChannel && !bestChannel.error && bestChannel.mapped && (bestChannel.cpt_results || []).length > 0 && (() => {
                        const ch = bestChannel.overall_best_channel;
                        const C = {
                          'Clinic Submit': { bg: '#7494AA', bd: '#7494AA', tx: '#fff', lb: 'CLINIC' },
                          'Headway': { bg: '#16A562', bd: '#16A562', tx: '#fff', lb: 'HEADWAY' },
                          'Alma': { bg: '#2D4F33', bd: '#2D4F33', tx: '#fff', lb: 'ALMA' },
                          'Grow Therapy': { bg: '#BCA9F7', bd: '#BCA9F7', tx: '#2B2716', lb: 'GROW' },
                        };
                        const c = C[ch] || { bg: '#f1f5f9', bd: '#cbd5e1', tx: '#475569', lb: ch };
                        const r99 = (bestChannel.cpt_results || []).find(r => r.cpt_code === '99214');
                        return (
                          <div>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '8px', flexWrap: 'wrap' }}>
                              <span style={{ background: c.bg, border: `1.5px solid ${c.bd}`, color: c.tx, padding: '3px 10px', borderRadius: '20px', fontSize: '.72rem', fontWeight: 700 }}>
                                ★ {c.lb} pays best
                              </span>
                              <span style={{ color: '#475569', fontSize: '.75rem' }}>
                                {bestChannel.canonical_payer} · {bestChannel.state}
                                {r99 && r99.best_rate ? ` · $${r99.best_rate.toFixed(2)}/99214` : ''}
                              </span>
                            </div>
                            <div style={{ marginTop: '8px' }}>
                              {channelSaved
                                ? <span style={{ color: '#16a34a', fontSize: '.72rem', fontWeight: 700 }}>✓ Saved to patient record</span>
                                : <button
                                  onClick={saveChannelToPatient}
                                  disabled={savingChannel}
                                  style={{ background: c.bg, border: `1px solid ${c.bd}`, color: c.tx, padding: '4px 12px', borderRadius: '6px', fontSize: '.7rem', fontWeight: 700, cursor: savingChannel ? 'default' : 'pointer', opacity: savingChannel ? .6 : 1 }}>
                                  {savingChannel ? 'Saving…' : `→ Save ${c.lb} as recommended channel`}
                                </button>
                              }
                            </div>
                          </div>
                        );
                      })()}
                      {bestChannel && (!bestChannel.mapped || !(bestChannel.cpt_results || []).length) && (
                        <span style={{ color: '#94a3b8' }}>No rates on file — check CPT Dashboard</span>
                      )}
                    </div>
                  )}
                  <div className="csm-grid-2">
                    <div className="csm-field">
                      <label>Group #</label>
                      <input value={groupNumber} onChange={e => setGroupNumber(e.target.value)} placeholder="Group number" />
                    </div>
                    <div className="csm-field">
                      <label>Primary Subscriber</label>
                      <input value={primarySubscriber} onChange={e => setPrimarySubscriber(e.target.value)} placeholder="Subscriber name" />
                    </div>
                  </div>

                  {/* ── Member Info ── */}
                  <div className="csm-fields-group-lbl">Member Info</div>
                  <div className="csm-grid-2">
                    <div className="csm-field">
                      <label>Member ID</label>
                      <input value={memberID} onChange={e => setMemberID(e.target.value)} placeholder="Member ID" />
                    </div>
                    <div className="csm-field">
                      <label>Member DOB</label>
                      <input type="date" value={memberDOB} onChange={e => setMemberDOB(e.target.value)} />
                    </div>
                    <div className="csm-field">
                      <label>Patient's State</label>
                      <select value={patientState} onChange={e => setPatientState(e.target.value)}>
                        <option value="">— Select —</option>
                        {US_STATES.map(s => <option key={s} value={s}>{s}</option>)}
                      </select>
                    </div>
                    <div className="csm-field">
                      <label>PCN</label>
                      <input value={pcn} onChange={e => setPcn(e.target.value)} placeholder="PCN from Tebra" />
                    </div>
                  </div>

                  {/* ── Provider & Billing ── */}
                  <div className="csm-fields-group-lbl">Provider &amp; Billing</div>
                  <div className="csm-grid-2">
                    <div className="csm-field">
                      <label>Rendering Provider NPI</label>
                      {provNpis.rendering.length > 0 ? (
                        <select value={renderingNPI} onChange={e => setRenderingNPI(e.target.value)}>
                          <option value="">— Select —</option>
                          {provNpis.rendering.map(n => <option key={n} value={n}>{n}</option>)}
                        </select>
                      ) : (
                        <input value={renderingNPI} onChange={e => setRenderingNPI(e.target.value)} placeholder="10-digit NPI" />
                      )}
                    </div>
                    <div className="csm-field">
                      <label>Billing NPI</label>
                      {provNpis.billing.length > 0 ? (
                        <select value={billingNPI} onChange={e => setBillingNPI(e.target.value)}>
                          <option value="">— Select —</option>
                          {provNpis.billing.map(n => <option key={n} value={n}>{n}</option>)}
                        </select>
                      ) : (
                        <input value={billingNPI} onChange={e => setBillingNPI(e.target.value)} placeholder="10-digit NPI" />
                      )}
                    </div>
                    <div className="csm-field">
                      <label>xCode</label>
                      <input value={xCode} onChange={e => setXCode(e.target.value)} placeholder="xCode" />
                    </div>
                    <div className="csm-field">
                      <label>💳 Payment Processing Channel</label>
                      {(() => {
                        const isPreset = PAYMENT_PLATFORMS.includes(paymentPlatform);
                        const dropVal = isPreset ? paymentPlatform : (paymentPlatform ? 'Other' : '');
                        const isOther = dropVal === 'Other';
                        const otherTxt = isOther && paymentPlatform !== 'other' ? paymentPlatform : '';
                        return (
                          <>
                            <select value={dropVal} onChange={e => {
                              const v = e.target.value;
                              setPaymentPlatform(v === 'Other' ? 'other' : v);
                            }}>
                              <option value="">— Select —</option>
                              {PAYMENT_PLATFORMS.map(p => <option key={p} value={p}>{p}</option>)}
                              <option value="Other">Other…</option>
                            </select>
                            {isOther && (
                              <input style={{ marginTop: 4 }} placeholder="Describe…" value={otherTxt}
                                onChange={e => setPaymentPlatform(e.target.value || 'other')} />
                            )}
                          </>
                        );
                      })()}
                    </div>
                    <div className="csm-field">
                      <label>Cost-Share Classification</label>
                      <select value={paymentType} onChange={e => setPaymentType(e.target.value)}>
                        <option value="">— Select —</option>
                        <option value="copay">Copay</option>
                        <option value="coinsurance">Coinsurance</option>
                        <option value="cash-pay">Cash-pay</option>
                        <option value="deductible">Deductible</option>
                      </select>
                    </div>
                    <div className="csm-field">
                      <label>Rate {paymentType === 'coinsurance' ? '(%)' : '($)'}</label>
                      <input value={paymentRate} onChange={e => setPaymentRate(e.target.value)}
                        placeholder={paymentType === 'coinsurance' ? 'e.g. 20%' : 'e.g. 30'} />
                    </div>
                  </div>
                  <div className="csm-save-row">
                    <button className="csm-save-pt-btn" onClick={savePatientRecord} disabled={savingPt}>
                      {savingPt ? '⏳ Saving…' : '💾 Save Patient Record'}
                    </button>
                    {ptSaved
                      ? <span className="csm-pt-saved">✅ Saved to patient record</span>
                      : <span className="csm-save-note">Persists across all appointments</span>}
                  </div>
                </div>

                {/* ── Section 2: This Appointment ── */}
                <div className="csm-section csm-appt">
                  <div className="csm-section-title">📅 This Appointment</div>

                  {/* Note status */}
                  <div style={{ marginBottom: 14 }}>
                    {isSigned
                      ? <span className="csm-signed">✓ Note Signed</span>
                      : <span className="csm-unsigned">⚠ Awaiting Provider Signature</span>}
                  </div>

                  {/* CPT Codes */}
                  <div className="csm-row-field">
                    <div className="csm-row-label">CPT Codes</div>
                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, alignItems: 'center' }}>
                      {normCpt(localAppt.cpt).length === 0
                        ? <span className="csm-none">No codes yet</span>
                        : normCpt(localAppt.cpt).map(c => {
                          const rate = CPT_RATES[c];
                          const isCopied = copiedCpt === c;
                          return (
                            <span key={c} className="cpt-rate-chip" title={rate ? `Click $${rate.toFixed(2)} to copy` : ''}>
                              <span className="b-code" style={{ cursor: 'default' }}>{c}
                                <span className="b-code-desc">{CPT_MAP[c] || ''}</span>
                              </span>
                              {rate != null
                                ? <span
                                  className={`cpt-rate-amt${isCopied ? ' just-copied' : ''}`}
                                  onClick={e => copyCptRate(c, e)}
                                  title="Click to copy charge amount">
                                  {isCopied ? '✓ Copied' : `$${rate.toFixed(2)}`}
                                </span>
                                : <span className="cpt-rate-no-rate">no rate</span>}
                            </span>
                          );
                        })}
                      <button className="csm-edit-btn" onClick={() => setCptOpen(true)}>
                        {normCpt(localAppt.cpt).length > 0 ? '✎ Edit Codes' : '+ Add Codes'}
                      </button>
                    </div>
                  </div>

                  {/* Controlled Substances */}
                  <div className="csm-row-field">
                    <div className="csm-row-label">Controlled Substances Prescribed</div>
                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, alignItems: 'center' }}>
                      {(localAppt.rxMeds || []).length === 0
                        ? <span className="csm-none">None prescribed</span>
                        : (localAppt.rxMeds || []).map((m, i) => <span key={i} className="rx-b-chip">{m}</span>)}
                      <button className="csm-edit-btn" onClick={() => setRxOpen(true)}>
                        {(localAppt.rxMeds || []).length > 0 ? '✎ Edit Rx' : '+ Add Rx'}
                      </button>
                    </div>
                  </div>

                  {/* Provider Note removed — use Comments in the appointment popup instead */}

                  {/* Payment */}
                  <div className="csm-payment-row">
                    <div className="csm-field" style={{ maxWidth: 130 }}>
                      <label>Collect ($)</label>
                      <input className="fi" value={localAppt.paymentAmount || ''} placeholder="0"
                        onChange={e => {
                          const v = e.target.value;
                          setLocalAppt({ ...localAppt, paymentAmount: v });
                          if (onPaymentSave) onPaymentSave(buildFinalAppt({ paymentAmount: v }));
                        }} />
                    </div>
                    <div className="csm-chks">
                      <label className="dp-chk" style={{ color: localAppt.paymentCollected ? '#16a34a' : '#3D768A' }}>
                        <input type="checkbox" checked={!!localAppt.paymentCollected}
                          onChange={e => {
                            const checked = e.target.checked;

                              paymentCollected: checked,

                              paymentDate: checked && !localAppt.paymentDate

                            setLocalAppt(newLocal);

                      </label>
                      <label className="dp-chk" style={{ color: localAppt.paymentFailed ? '#dc2626' : '#3D768A' }}>
                        <input type="checkbox" checked={!!localAppt.paymentFailed}
                          onChange={e => {

                              ...localAppt,

                            <option value="Other">Other…</option>
                          </select>
                          {isOther && (
                            <input className="dp-platform-other" placeholder="describe…"
                              value={otherTxt}
                              onChange={e => {
                                const newPlatform = e.target.value || 'other';
                                setLocalAppt({ ...localAppt, paymentPlatform: newPlatform });
                                if (onPaymentSave) onPaymentSave(buildFinalAppt({ paymentPlatform: newPlatform }));
                              }} />
                          )}

                    })()}
                    {(localAppt.paymentCollected || localAppt.paymentFailed) && (
                      <div className={`dp-date-wrap ${localAppt.paymentCollected ? 'coll' : 'fail'}`}>
                        <span className="dp-date-lbl">
                          {localAppt.paymentCollected ? '📅 Date Received' : '📅 Date Attempted'}
                        </span>
                        <input type="date" className="dp-date-inp"
                          value={localAppt.paymentDate || ''}
                          onChange={e => {
                            const newDate = e.target.value;
                            setLocalAppt({ ...localAppt, paymentDate: newDate });
                            if (onPaymentSave) onPaymentSave(buildFinalAppt({ paymentDate: newDate }));
                          }} />
                      </div>
                    )}
                  </div>
                </div>

                {/* ── Section 3: Claim Tracking & Payout ── */}
                {(() => {
                  const statusPillCls = claimStatus ? `st-${claimStatus}` : 'st-none';
                  const statusLabel = claimStatus || 'No Status';
                  const showPayment = claimStatus === 'Paid' || claimPaidAmount || claimPaidDate || claimCheckID;
                  const showDeposit = claimDepositBank || claimDepositDate || showPayment;
                  return (
                    <div className="csm-claim-wrap">

                      {/* Title row with live status pill */}
                      <div className="csm-claim-title">
                        <div className="csm-claim-title-left">
                          📊 Claim Tracking &amp; Payout
                        </div>
                        <span className={`csm-claim-status-pill ${statusPillCls}`}>
                          {claimStatus === 'Paid' ? '✅ ' :
                            claimStatus === 'Denied' ? '❌ ' :
                              claimStatus === 'Resubmitted' ? '🔄 ' :
                                claimStatus === 'Pending' ? '⏳ ' : '○ '}
                          {statusLabel}
                        </span>
                      </div>

                      {/* ── Submission ── */}
                      <div className="csm-claim-grp">📤 Submission</div>
                      <div className="csm-grid-2">
                        <div className="csm-field">
                          <label>Submitted Date</label>
                          <input type="date" value={claimSubmittedDate}

                      <div className="csm-claim-grp">📋 Claim Status</div>
                      <div className="csm-grid-2" style={{ marginBottom: 8 }}>
                        <div className="csm-field">
                          <label>Status</label>
                          <select value={claimStatus} onChange={e => setClaimStatus(e.target.value)}>

                            <option value="Pending">⏳ Pending</option>
                            <option value="Paid">✅ Paid</option>
                            <option value="Denied">❌ Denied</option>
                            <option value="Resubmitted">🔄 Resubmitted</option>
                          </select>
                        </div>
                        <div className="csm-field" />
                      </div>
                      <div className="csm-field">
                        <label>Status Notes</label>
                        <textarea className="csm-claim-notes"
                          value={claimStatusNotes}
                          onChange={e => setClaimStatusNotes(e.target.value)}
                          placeholder="e.g. Denied — missing modifier. Resubmitting with 59 modifier…" />
                      </div>

                      {/* ── Payment Received ── */}
                      <div className="csm-claim-grp">💵 Payment Received</div>
                      <div className="csm-grid-3">
                        <div className="csm-field">
                          <label>Paid Date</label>
                          <input type="date" value={claimPaidDate}
                            onChange={e => setClaimPaidDate(e.target.value)} />
                        </div>
                        <div className="csm-field">
                          <label>Paid Amount ($)</label>
                          <input value={claimPaidAmount}
                            onChange={e => {
                              const v = e.target.value;
                              setClaimPaidAmount(v);
                              if (v && v.trim() !== '' && parseFloat(v) > 0) {
                                setClaimStatus('Paid');
                              }
