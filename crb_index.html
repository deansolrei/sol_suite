                            placeholder="e.g. 125.00" />
                        </div>
                        <div className="csm-field">
                          <label>Check / EFT ID</label>
                          <input value={claimCheckID}
                            onChange={e => setClaimCheckID(e.target.value)}

                      <div className="csm-grid-2" style={{ marginTop: 8 }}>
                        <div className="csm-field">
                          <label>ERA Number</label>
                          <input value={claimERA}

                            placeholder="e.g. ERA-12345" />

                        <div className="csm-field">
                          <label style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                            <input type="checkbox" checked={claimBundled}
                              onChange={e => setClaimBundled(e.target.checked)}
                              style={{ width: 'auto', margin: 0, cursor: 'pointer' }} />
                            Bundled Check
                          </label>
                          {claimBundled && (
                            <input value={claimBundledAmount}
                              onChange={e => setClaimBundledAmount(e.target.value)}
                              placeholder="Total bundle amt ($)"
                              style={{ marginTop: 4 }} />

                        </div>
                      </div>

                      {/* ── Deposit ── */}
                      <div className="csm-claim-grp">🏦 Deposit Confirmation</div>
                      <div className="csm-grid-3">
                        <div className="csm-field">

                        <div className="csm-field">
                          <label>Deposit Amount ($)</label>
                          <input value={claimDepositAmount}
                            onChange={e => setClaimDepositAmount(e.target.value)}

                    </div>

              </div>{/* /csm-body */}

              {/* ── Footer ── */}

                <button className="csm-cancel-btn" onClick={onClose}>Cancel</button>

                  {isSubmitted
                    ? <button className="csm-submit-btn done" onClick={() => {
                      onUpdate(buildFinalAppt({ billing: 'pending' }));
                      setLocalAppt(a => ({ ...a, billing: 'pending' }));

    function DirectPaySection({ appts, date, onUpdate, patientDb }) {
      const pts = [...appts].filter(a => a.method === 'direct').sort((a, b) => timeToMinutes(a.time) - timeToMinutes(b.time));
      const healedRef = useRef(new Set());
      // Collapsed by default — same pattern as the Provider Day view's
      // DayDirectPayBanner (pvdp-collapsible / pvdp-summary-toggle), so Cost
      // Share Collection doesn't permanently eat screen space in the
      // Billing Day view's frozen header. Click the summary line to reveal
      // the full per-patient collection UI.
      const [expanded, setExpanded] = useState(false);

      function ptInfo(a) {
        const rec = (patientDb || []).find(p =>
          `${p.firstName} ${p.lastName}`.toLowerCase() === (a.patient || '').toLowerCase()
        );
        // Explicit non-empty checks — numeric/string '0' is a valid $0 copay rate
        // and must not be dropped by the falsy `|| ''` pattern.
        const sv = v => (v !== null && v !== undefined && v !== '') ? String(v) : '';
        const aRate = sv(a.paymentRate);
        const recRate = rec ? sv(rec.rate) : '';
        return {
          insurance: a.directIns || (rec && rec.insurance) || '',
          paymentType: a.paymentType || (rec && rec.patientPortion) || '',
          paymentRate: aRate !== '' ? aRate : recRate,
          // paymentPlatform: use appointment value if already set (override); else patient record default
          paymentPlatform: a.paymentPlatform || (rec && rec.paymentPlatform) || '',
        };
      }

      useEffect(() => {
        if (!patientDb || !patientDb.length || !pts.length) return;
        pts.forEach(a => {
          if (healedRef.current.has(a.id)) return;
          const info = ptInfo(a);
          const sv = v => (v !== null && v !== undefined && v !== '') ? String(v) : '';
          const needsType = !a.paymentType && info.paymentType;
          const needsRate = sv(a.paymentRate) === '' && info.paymentRate !== '';
          const needsPlatform = !a.paymentPlatform && info.paymentPlatform;
          if (!needsType && !needsRate && !needsPlatform) return;
          healedRef.current.add(a.id);
          onUpdate({
            ...a,
            paymentType: info.paymentType || a.paymentType,
            paymentRate: info.paymentRate !== '' ? info.paymentRate : sv(a.paymentRate),
            paymentPlatform: info.paymentPlatform || a.paymentPlatform,
          });
        });
      }, [patientDb, pts.length]);

      if (!pts.length) return null;

      // Split: $0 copay patients (confirmed, no collection) vs. those needing collection
      const ptsInfo = pts.map(a => ({ a, info: ptInfo(a) }));
      const collectionPts = ptsInfo.filter(({ info }) => !isZeroRate(info.paymentRate));
      const zeroPts = ptsInfo.filter(({ info }) => isZeroRate(info.paymentRate));

      function sendAlert() {
        const lines = collectionPts.map(({ a, info }) => {
          const st = a.paymentCollected ? '✅ COLLECTED' : a.paymentFailed ? '❌ FAILED' : '⏳ PENDING';
          const rate = info.paymentRate ? ` | Rate: ${info.paymentRate}` : '';
          const amt = a.paymentAmount ? ` | Collect: $${a.paymentAmount}` : '';
          return `• ${a.patient} (${fmtTime(a.time)}) | ${info.insurance || 'Clinic Submit'} | ${info.paymentType || '—'}${rate}${amt} | ${st}`;
        }).join('\n');
        const sub = encodeURIComponent(`Cost-Share Collection Alert — ${fmtDate(date)}`);
        const body = encodeURIComponent(`Cost-Share Collection Report\n${fmtDate(date)}\n${'─'.repeat(48)}\n\n${lines}\n\n${'─'.repeat(48)}\nFrom: SolBoard — Solrei Behavioral Health`);
        window.location.href = `mailto:dean@solreibehavioralhealth.com?subject=${sub}&body=${body}`;
      }

      // All patients are $0 copay — show compact confirmation only, no collection UI
      if (!collectionPts.length) {
        return (
          <div className="dp-zero-standalone">
            <div className="dp-zero-sa-hdr">
              <span>💚 $0 Copay — No Collection Needed</span>
              <span className="dp-zero-sa-date">{fmtDate(date)}</span>
            </div>
            {zeroPts.map(({ a, info }) => (
              <div key={a.id} className="dp-zero-row">
                <span className="dp-zero-name">{a.patient}</span>
                <span className="dp-zero-time">{fmtTime(a.time)}</span>
                {info.insurance && <span className="dp-zero-ins">{info.insurance}</span>}
                <span className="dp-zero-confirm">✓ Confirmed</span>
              </div>
            ))}
          </div>
        );
      }

      // Normal collection section — collapsed by default. The summary line
      // mirrors DayDirectPayBanner's wording ("Cost share: $X due" / "N
      // pending" / "all collected") so both Day views read consistently.
      const needActionPts = collectionPts.filter(({ a }) => !a.paymentCollected);
      const totalOwed = needActionPts.reduce((sum, { info }) => {
        const raw = info.paymentRate;
        if (!raw || String(raw).includes('%')) return sum;
        const n = parseFloat(String(raw).replace(/[$,\s]/g, ''));
        return sum + (isNaN(n) ? 0 : n);
      }, 0);
      const summaryLabel = needActionPts.length > 0
        ? (totalOwed > 0 ? `Cost share: $${totalOwed.toFixed(0)} due` : `Cost share: ${needActionPts.length} pending`)
        : 'Cost share: all collected';

      return (
        <div className="pvdp-collapsible">
          <button className="pvdp-summary-toggle" onClick={() => setExpanded(e => !e)}>
            {summaryLabel}
            <span className="pvdp-chevron" aria-hidden="true">{expanded ? '▴' : '▾'}</span>
          </button>
          {expanded && (
            <div className="dp-section">
              <div className="dp-hdr">
                <div>
                  <div className="dp-title">💰 Cost-Share Collection</div>
                  <div style={{ fontSize: 11, opacity: .8, marginTop: 2 }}>{collectionPts.length} patient{collectionPts.length !== 1 ? 's' : ''} · {fmtDate(date)}</div>
                </div>
                <button className="dp-alert-btn" onClick={sendAlert}>📧 Send Alert</button>
              </div>
              {collectionPts.map(({ a, info }) => {
                const rc = a.paymentCollected ? 'coll' : a.paymentFailed ? 'fail' : 'pend';
                const isPercent = info.paymentRate && info.paymentRate.includes('%');
                const fromRec = (!a.paymentType && info.paymentType) || (!a.paymentRate && info.paymentRate);
                return (
                  <div key={a.id} className={`dp-row ${rc}`}>
                    <div>
                      <div style={{ fontWeight: 800, fontSize: 14, color: '#2B2716' }}>{a.patient}</div>
                      <div style={{ fontSize: 11, color: '#777355' }}>{fmtTime(a.time)} · {info.insurance || '—'}</div>
                    </div>
                    <div>
                      {info.paymentType
                        ? <span style={{ background: fromRec ? '#e0f2fe' : '#F2EDDB', color: fromRec ? '#0369a1' : '#2B2716', padding: '2px 8px', borderRadius: 5, fontWeight: 700, fontSize: 12 }}>
                          {info.paymentType}{fromRec && <span style={{ fontSize: 9, marginLeft: 4, opacity: .7 }}>↑ record</span>}
                        </span>
                        : <span style={{ fontSize: 11, color: '#FBFBF3', fontStyle: 'italic' }}>No type set</span>}
                      {info.paymentRate
                        ? <div style={{ fontSize: 11, color: fromRec ? '#0369a1' : '#777355', marginTop: 3, fontWeight: fromRec ? 700 : 400 }}>
                          Rate: <strong>{info.paymentRate}</strong>{isPercent && ' — enter $ below'}
                        </div>
                        : <div style={{ fontSize: 11, color: '#FBFBF3', fontStyle: 'italic', marginTop: 3 }}>No rate set</div>}
                    </div>
                    <div>
                      <div style={{ fontSize: 10, fontWeight: 800, color: '#777355', marginBottom: 3 }}>COLLECT ($)</div>
                      <input className="fi" style={{ width: 90, padding: '5px 8px', fontSize: 14, fontWeight: 700 }}
                        value={a.paymentAmount || ''} placeholder="0"
                        onChange={e => onUpdate({ ...a, paymentAmount: e.target.value })} />
                    </div>
                    <div className="dp-pay-controls">
                      <div className="dp-chks">
                        <label className="dp-chk" style={{ color: a.paymentCollected ? '#16a34a' : '#3D768A' }}>
                          <input type="checkbox" checked={!!a.paymentCollected}
                            onChange={e => {
                              const checked = e.target.checked;
                              onUpdate({
                                ...a,
                                paymentCollected: checked,
                                paymentFailed: checked ? false : a.paymentFailed,
                                paymentDate: checked && !a.paymentDate
                                  ? new Date().toISOString().slice(0, 10)
                                  : (!checked && !a.paymentFailed ? '' : a.paymentDate),
                              });
                            }} />
                          Collected
                        </label>
                        <label className="dp-chk" style={{ color: a.paymentFailed ? '#dc2626' : '#3D768A' }}>
                          <input type="checkbox" checked={!!a.paymentFailed}
                            onChange={e => {
                              const checked = e.target.checked;
                              onUpdate({
                                ...a,
                                paymentFailed: checked,
                                paymentCollected: checked ? false : a.paymentCollected,
                                paymentDate: checked && !a.paymentDate
                                  ? new Date().toISOString().slice(0, 10)
                                  : (!checked && !a.paymentCollected ? '' : a.paymentDate),
                              });
                            }} />
                          Failed
                        </label>
                      </div>
                      {(() => {
                        const pp = a.paymentPlatform || '';
                        const isPreset = PAYMENT_PLATFORMS.includes(pp);
                        const dropVal = isPreset ? pp : (pp ? 'Other' : '');
                        const isOther = dropVal === 'Other';
                        const otherTxt = (isOther && pp !== 'other') ? pp : '';
                        return (
                          <div className="dp-platform-row">
                            <span className="dp-platform-lbl">💳 Payment Processing Channel</span>
                            <select className="dp-platform-sel" value={dropVal}
                              onChange={e => {
                                const v = e.target.value;
                                onUpdate({ ...a, paymentPlatform: v === 'Other' ? 'other' : v });
                              }}>
                              <option value="">—</option>
                              {PAYMENT_PLATFORMS.map(p => <option key={p} value={p}>{p}</option>)}
                              <option value="Other">Other…</option>
                            </select>
                            {isOther && (
                              <input
                                className="dp-platform-other"
                                placeholder="describe…"
                                value={otherTxt}
                                onChange={e => onUpdate({ ...a, paymentPlatform: e.target.value || 'other' })}
                              />
                            )}
                          </div>
                        );
                      })()}
                      {(a.paymentCollected || a.paymentFailed) && (
                        <div className={`dp-date-wrap ${a.paymentCollected ? 'coll' : 'fail'}`}>
                          <span className="dp-date-lbl">
                            {a.paymentCollected ? '📅 Date Received' : '📅 Date Attempted'}
                          </span>
                          <input
                            type="date"
                            className="dp-date-inp"
                            value={a.paymentDate || ''}
                            onChange={e => onUpdate({ ...a, paymentDate: e.target.value })}
                          />
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}

              {/* ── $0 Copay — compact confirmation strip ── */}
              {zeroPts.length > 0 && (
                <div className="dp-zero-strip">
                  <div className="dp-zero-strip-hdr">
                    <span>💚 $0 Copay — No Collection</span>
                    <span className="dp-zero-strip-count">{zeroPts.length}</span>
                  </div>
                  {zeroPts.map(({ a, info }) => (
                    <div key={a.id} className="dp-zero-row">
                      <span className="dp-zero-name">{a.patient}</span>
                      <span className="dp-zero-time">{fmtTime(a.time)}</span>
                      {info.insurance && <span className="dp-zero-ins">{info.insurance}</span>}
                      <span className="dp-zero-confirm">✓ Confirmed</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    /* ════════════════════════════════════════════════════════════════
       BILLER APPOINTMENT MODAL
       Allows the biller to view and edit any appointment — not just
       Direct-pay / Claim Submit cards. Provides access to:
         · Insurance / billing method info (editable)
         · Comments log (viewable + addable by biller)
         · Clinic note status (read-only badge)
       Does NOT replace ClaimSubmitModal for direct-pay claim entry.
    ════════════════════════════════════════════════════════════════ */
    function BillerApptModal({ appt, onSave, onUpdate, onClose, patientDb, onRefreshPatients }) {
      const [d, setD] = React.useState(() => ({ ...appt }));
      const ptRec = (patientDb || []).find(p =>
        `${p.firstName} ${p.lastName}`.toLowerCase() === (appt.patient || '').toLowerCase()
      ) || {};
      const [insurance, setInsurance] = React.useState(ptRec.insurance || appt.insuranceCarrier || '');
      const [commNote, setCommNote] = React.useState('');
      // Default to the first role-appropriate recipient (e.g. 'provider' for biller)
      // rather than 'all' so messages are targeted by default.
      const [commTo, setCommTo] = React.useState(() => {
        const r = _crbUser.role || 'biller';
        const opts = COMM_TO_OPTIONS[r] || COMM_TO_OPTIONS.biller;
        return (opts[0] && opts[0].v) || 'all';
      });
      const commListRef = React.useRef(null);

      // Determine "To" options for biller
      const myRole = _crbUser.role || 'biller';
      const toOptions = COMM_TO_OPTIONS[myRole] || COMM_TO_OPTIONS.biller;

      // Mark all incoming as read and persist readBy so sender's icon loses the !
      // Also sync d.comms with the readBy-updated version so addComm doesn't overwrite.
      React.useEffect(() => {
        markCommsReadPersist(appt, (u) => {
          setD(p => ({ ...p, comms: u.comms }));
          if (onUpdate) onUpdate(u);
        });
      }, []);

      // Auto-scroll comment list to bottom
      React.useEffect(() => {
        if (commListRef.current) commListRef.current.scrollTop = commListRef.current.scrollHeight;
      }, [(d.comms || []).length]);

      function upd(field, val) { setD(p => ({ ...p, [field]: val })); }
      function updMs(key, subfield, val) { setD(p => ({ ...p, [key]: { ...(p[key] || {}), [subfield]: val } })); }

      const msKey = d.method === 'alma' ? 'alma' : d.method === 'hw' ? 'hw' : d.method === 'grow' ? 'grow' : 'direct';
      const ms = d[msKey] || { text: '', valid: null };

      function addComm() {
        if (!commNote.trim()) return;
        const nc = buildComment(commNote, commTo);
        // d.comms synced with readBy updates in useEffect above
        const newComms = [...(d.comms || []), nc];
        setD(p => ({ ...p, comms: newComms }));
        setCommNote('');
        // Send is FINAL — persist immediately via onUpdate without closing
        if (onUpdate) onUpdate({ ...d, comms: newComms });
      }

      const ns = d.noteStatus || '';
      const nsInfo = NS_LABELS[ns] || NS_LABELS[''];

      return (
        <div className="overlay" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="m-hdr">
              <div>

            </div>
            <div className="m-body">

              {/* ── Section 1: Billing Info (editable) ── */}

                <div className="step-hd" style={{ background: 'linear-gradient(135deg,#3D768A,#7494AA)', color: '#fff', borderRadius: 8, padding: '8px 12px', marginBottom: 10 }}>

                <div className="frm">
                  <label className="fl">Billing Channel</label>
                  <div style={{ display: 'flex', gap: 8 }}>
                    {METHODS.map(({ id, label }) => (

                        style={{

                          background: d.method === id ? '#3D768A' : '#F1F5F9',

                  </div>
                </div>
                <div className="frm">
                  <label className="fl">Patient Insurance Carrier</label>
                  <input className="fi" value={insurance} onChange={e => setInsurance(e.target.value)}
                    placeholder="e.g. Ambetter" />
                </div>
                {d.method === 'direct' && (
                  <div className="frm">
                    <label className="fl">Insurance Carrier / Cost-Share Classification</label>
                    <input className="fi" value={d.directIns || ''}
                      onChange={e => { upd('directIns', e.target.value); updMs('direct', 'text', e.target.value); }}
                      placeholder="e.g. Blue Cross Blue Shield, Cash Pay" />
                  </div>
                )}
                {d.method === 'direct' && d.directIns && d.directIns.length > 2 && !d.directIns.toLowerCase().includes('cash') && <BestChannelHint carrier={d.directIns} state={''} />}
                <div className="frm">
                  <label className="fl">Billing Status Note (with initials)</label>
                  <input className="fi" value={ms.text || ''} onChange={e => updMs(msKey, 'text', e.target.value)}
                    placeholder="e.g. Insurance updated 6/16/26 DM" />
                </div>
                <div className="frm">
                  <label className="fl" style={{ marginBottom: 7 }}>Validity</label>
                  <div className="ropt">
                    {[[true, '🟢 Valid'], [false, '🔴 Issue'], [null, '⏳ In Process']].map(([v, l]) => (
                      <label key={String(v)} style={{ fontSize: 14, gap: 6 }}>
                        <input type="radio" checked={ms.valid === v} onChange={() => {

                {d.method === 'direct' && (

                      <select className="fi" value={d.paymentType || ''} onChange={e => upd('paymentType', e.target.value)}>

                        placeholder="e.g. 30 or 20%" />

                )}
              </div>

              {/* ── Section 2: Clinic Note Status (read-only) ── */}
              <div className="step">

                  <span style={{ fontSize: 12, color: '#64748B' }}>

                </div>
                {d.out && <div style={{ marginTop: 8, fontSize: 12, color: '#16A34A', fontWeight: 700 }}>✓ Provider has signed this note.</div>}

              {/* ── Section 3: Comments ── */}
              <div className="step">
                <div className="step-hd" style={{ background: 'linear-gradient(135deg,#92400E,#B45309)', color: '#fff', borderRadius: 8, padding: '8px 12px', marginBottom: 10 }}>

                  {(d.comms || []).length === 0 && (

    // PAYMENT IMPORT PANEL — drag-and-drop CSV/XLSX import for bulk billing
    // ════════════════════════════════════════════════════════════════════
    function PaymentImportPanel({ appts, onUpdate, onClose }) {
      const [phase, setPhase] = useState('upload'); // upload|preview|running|done
      const [rows, setRows] = useState([]);
      const [importResult, setImportResult] = useState(null);
      const [dragOver, setDragOver] = useState(false);
      const [error, setError] = useState('');
      const fileInputRef = React.useRef(null);

      // ── CSV parser (handles quoted fields) ──────────────────────────────
      function parseCSVLine(line) {
        const result = [];
        let inQuote = false, current = '';
        for (let i = 0; i < line.length; i++) {
          const c = line[i];
          if (c === '"') { inQuote = !inQuote; }
          else if (c === ',' && !inQuote) { result.push(current); current = ''; }
          else { current += c; }
        }
        result.push(current);
        return result;
      }

      function parseCSVText(text) {
        const lines = text.trim().split(/\r?\n/);
        if (lines.length < 2) return [];
        const headers = parseCSVLine(lines[0]).map(h => h.replace(/^"|"$/g, '').trim());
        const parsed = [];
        for (let i = 1; i < lines.length; i++) {
          if (!lines[i].trim()) continue;
          const vals = parseCSVLine(lines[i]);
          const obj = {};
          headers.forEach((h, idx) => { obj[h] = (vals[idx] || '').replace(/^"|"$/g, '').trim(); });
          parsed.push(obj);
        }
        return parsed;
      }

      // ── Normalize raw rows to camelCase keys ─────────────────────────────
      function normalizeRows(rawRows) {
        return rawRows.map(r => ({
          date: r['APPOINTMENT DATE'] || r['Appointment Date'] || r['appointment date'] || '',
          providerName: r['PROVIDER NAME'] || r['Provider Name'] || r['provider name'] || '',
          patientName: r['PATIENT NAME'] || r['Patient Name'] || r['patient name'] || '',
          paymentAmount: r['PAYMENT AMOUNT'] || r['Payment Amount'] || r['payment amount'] || '',
        })).filter(r => r.date && r.providerName && r.patientName && r.paymentAmount);
      }

      // ── File processor ───────────────────────────────────────────────────
      async function processFile(file) {
        setError('');
        const ext = file.name.split('.').pop().toLowerCase();
        try {
          if (ext === 'csv') {
            const text = await file.text();
            const raw = parseCSVText(text);
            const norm = normalizeRows(raw);
            if (!norm.length) {
              setError('No valid rows found. Verify columns: APPOINTMENT DATE, PROVIDER NAME, PATIENT NAME, PAYMENT AMOUNT');
              return;
            }
            setRows(norm); setPhase('preview');

          } else if (ext === 'xlsx' || ext === 'xls') {
            // Lazy-load SheetJS from CDN
            if (!window.XLSX) {
              await new Promise((res, rej) => {
                const s = document.createElement('script');
                s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
                s.onload = res; s.onerror = () => rej(new Error('Failed to load XLSX library'));
                document.head.appendChild(s);
              });
            }
            const buf = await file.arrayBuffer();
            const wb = window.XLSX.read(buf, { type: 'array' });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const raw = window.XLSX.utils.sheet_to_json(ws);
            const norm = normalizeRows(raw);
            if (!norm.length) {
              setError('No valid rows found. Verify columns: APPOINTMENT DATE, PROVIDER NAME, PATIENT NAME, PAYMENT AMOUNT');
              return;
            }
            setRows(norm); setPhase('preview');

          } else {
            setError('Unsupported file type — please use .csv or .xlsx');
          }
        } catch (e) {
          setError('File error: ' + (e.message || String(e)));
        }
      }

      function handleDrop(e) {
        e.preventDefault(); setDragOver(false);
        if (e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]);
      }

      // ── Run import against GAS backend ───────────────────────────────────
      async function runImport() {
        setPhase('running');
        try {
          const json = await gsr('bulkImportPayments', JSON.stringify(rows));
          const result = JSON.parse(json);
          if (result.error) { setError(result.error); setPhase('preview'); return; }
          setImportResult(result);
          setPhase('done');
          // Refresh local React state for any matched appointments on the current day
          if (result.matched && onUpdate) {
            result.matched.forEach(m => {
              const a = (appts || []).find(x => x.id === m.apptId);
              if (a) onUpdate({ ...a, claimPaidAmount: m.amount, claimStatus: 'Paid' });
            });
          }
        } catch (e) {
          setError('Import failed: ' + (e.message || String(e)));
          setPhase('preview');
        }
      }

      const IND = '#09371F'; // indigo
      const IND_LT = '#F2EDDB';

      return (
        <div style={{
          position: 'fixed', inset: 0, background: 'rgba(0,0,0,.52)', zIndex: 9900,
          display: 'flex', alignItems: 'center', justifyContent: 'center'
        }}
          onClick={onClose}>
          <div style={{
            background: '#fff', borderRadius: 14, boxShadow: '0 10px 48px rgba(0,0,0,.28)',
            width: 'min(700px,96vw)', maxHeight: '88vh', overflow: 'hidden',
            display: 'flex', flexDirection: 'column'
          }}
            onClick={e => e.stopPropagation()}>

            {/* ── Header ─────────────────────────────────────────────── */}
            <div style={{ background: IND, padding: '16px 22px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexShrink: 0 }}>
              <div>
                <div style={{ color: '#fff', fontSize: 16, fontWeight: 800, letterSpacing: '.2px' }}>📥 Import Payments</div>
                <div style={{ color: '#FBFBF3', fontSize: 12, marginTop: 2 }}>Bulk-post payment amounts from CRB_Import.csv</div>
              </div>
              <button onClick={onClose} style={{ background: 'none', border: 'none', color: '#8AAF9C', fontSize: 22, cursor: 'pointer', lineHeight: 1, padding: '0 2px' }}>✕</button>
            </div>

            {/* ── Body ───────────────────────────────────────────────── */}
            <div style={{ padding: '20px 22px', overflowY: 'auto', flex: 1 }}>

              {/* UPLOAD PHASE */}
              {phase === 'upload' && <>
                <div
                  onDragOver={e => { e.preventDefault(); setDragOver(true); }}
                  onDragLeave={() => setDragOver(false)}
                  onDrop={handleDrop}
                  onClick={() => fileInputRef.current && fileInputRef.current.click()}
                  style={{
                    border: `2.5px dashed ${dragOver ? IND : '#FBFBF3'}`, borderRadius: 10,
                    padding: '38px 20px', textAlign: 'center', cursor: 'pointer',
                    background: dragOver ? IND_LT : '#F2EDDB', transition: 'all .15s'
                  }}>
                  <div style={{ fontSize: 40, marginBottom: 8 }}>📂</div>
                  <div style={{ fontWeight: 800, color: IND, fontSize: 15 }}>Drag & Drop your import file here</div>
                  <div style={{ color: '#6b7280', fontSize: 13, marginTop: 5 }}>or click to browse — CSV or XLSX accepted</div>
                  <input ref={fileInputRef} type="file" accept=".csv,.xlsx,.xls" style={{ display: 'none' }}
                    onChange={e => e.target.files[0] && processFile(e.target.files[0])} />
                </div>

                <div style={{
                  marginTop: 16, background: '#f0f9ff', border: '1px solid #bae6fd',
                  borderRadius: 8, padding: '13px 15px'
                }}>
                  <div style={{ fontWeight: 700, color: '#0369a1', marginBottom: 8, fontSize: 13 }}>Required Columns</div>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6 }}>
                    {['APPOINTMENT DATE', 'PROVIDER NAME', 'PATIENT NAME', 'PAYMENT AMOUNT'].map(c => (
                      <div key={c} style={{
                        background: '#e0f2fe', borderRadius: 5, padding: '4px 10px',
                        fontSize: 12, fontFamily: 'monospace', color: '#0c4a6e', fontWeight: 600
                      }}>{c}</div>
                    ))}
                  </div>
                  <div style={{ fontSize: 12, color: '#6b7280', marginTop: 10, lineHeight: 1.5 }}>
                    Run <strong style={{ color: '#0369a1' }}>merge_billing.py</strong> in the project folder to create this file from your Headway + Alma exports.
                  </div>
                </div>

                {error && <div style={{
                  marginTop: 12, background: '#fef2f2', border: '1px solid #fca5a5',
                  borderRadius: 8, padding: '10px 14px', color: '#dc2626', fontSize: 13
                }}>{error}</div>}
              </>}

              {/* PREVIEW PHASE */}
              {phase === 'preview' && <>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
                  <div style={{ fontWeight: 700, color: '#111827', fontSize: 14 }}>
                    Preview — <span style={{ color: IND }}>{rows.length} payment rows</span>
                  </div>
                  <button onClick={() => { setRows([]); setPhase('upload'); setError(''); }}
                    style={{
                      background: '#f3f4f6', border: '1px solid #e5e7eb', borderRadius: 7,
                      padding: '5px 13px', cursor: 'pointer', fontSize: 12, color: '#374151', fontWeight: 600
                    }}>
                    ← Change File
                  </button>
                </div>
                <div style={{ overflow: 'auto', maxHeight: 300, borderRadius: 8, border: '1px solid #e5e7eb' }}>
                  <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 12 }}>
                    <thead>
                      <tr style={{ background: IND, color: '#fff', position: 'sticky', top: 0 }}>
                        {['Date', 'Provider', 'Patient', 'Amount'].map(h => (
                          <th key={h} style={{ padding: '7px 11px', textAlign: 'left', fontWeight: 600, letterSpacing: '.2px' }}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {rows.slice(0, 60).map((r, i) => (
                        <tr key={i} style={{ borderBottom: '1px solid #f3f4f6', background: i % 2 === 0 ? '#fff' : '#fafafa' }}>
                          <td style={{ padding: '6px 11px', color: '#374151' }}>{r.date}</td>
                          <td style={{ padding: '6px 11px', color: '#374151' }}>{r.providerName}</td>
                          <td style={{ padding: '6px 11px', color: '#374151' }}>{r.patientName}</td>
                          <td style={{ padding: '6px 11px', color: '#15803d', fontWeight: 700 }}>${r.paymentAmount}</td>
                        </tr>
                      ))}
                      {rows.length > 60 && <tr><td colSpan={4} style={{ padding: '8px 11px', color: '#9ca3af', fontSize: 11 }}>
                        … and {rows.length - 60} more rows
                      </td></tr>}
                    </tbody>
                  </table>
                </div>
                {error && <div style={{
                  marginTop: 12, background: '#fef2f2', border: '1px solid #fca5a5',
                  borderRadius: 8, padding: '10px 14px', color: '#dc2626', fontSize: 13
                }}>{error}</div>}
              </>}

              {/* RUNNING PHASE */}
              {phase === 'running' && (
                <div style={{ textAlign: 'center', padding: '48px 20px' }}>
                  <div style={{ fontSize: 44, marginBottom: 14 }}>⏳</div>
                  <div style={{ fontWeight: 800, color: IND, fontSize: 16 }}>Importing payments…</div>
                  <div style={{ color: '#6b7280', fontSize: 13, marginTop: 6 }}>
                    Matching {rows.length} rows to appointments in the sheet
                  </div>
                </div>
              )}

              {/* DONE PHASE */}
              {phase === 'done' && importResult && <>
                <div style={{ display: 'flex', gap: 14, marginBottom: 18 }}>
                  <div style={{
                    flex: 1, background: '#f0fdf4', border: '1px solid #86efac', borderRadius: 10,
                    padding: '16px', textAlign: 'center'
                  }}>
                    <div style={{ fontSize: 32, fontWeight: 800, color: '#16a34a' }}>{importResult.matched.length}</div>
                    <div style={{ fontSize: 12, color: '#15803d', fontWeight: 700, marginTop: 3 }}>✅ Matched &amp; Updated</div>
                  </div>
                  <div style={{
                    flex: 1,
                    background: importResult.unmatched.length > 0 ? '#fef2f2' : '#f9fafb',
                    border: `1px solid ${importResult.unmatched.length > 0 ? '#fca5a5' : '#e5e7eb'}`,
                    borderRadius: 10, padding: '16px', textAlign: 'center'
                  }}>
                    <div style={{ fontSize: 32, fontWeight: 800, color: importResult.unmatched.length > 0 ? '#dc2626' : '#9ca3af' }}>
                      {importResult.unmatched.length}
                    </div>
                    <div style={{
                      fontSize: 12, fontWeight: 700, marginTop: 3,
                      color: importResult.unmatched.length > 0 ? '#b91c1c' : '#9ca3af'
                    }}>
                      {importResult.unmatched.length > 0 ? '⚠️ Unmatched' : '✓ No Unmatched'}
                    </div>
                  </div>
                </div>

                {importResult.unmatched.length > 0 && <>
                  <div style={{ fontWeight: 700, color: '#b91c1c', fontSize: 13, marginBottom: 7 }}>Unmatched Rows</div>
                  <div style={{ overflow: 'auto', maxHeight: 200, borderRadius: 8, border: '1px solid #fca5a5' }}>
                    <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 11 }}>
                      <thead>
                        <tr style={{ background: '#fef2f2', color: '#b91c1c' }}>
                          {['Date', 'Provider', 'Patient', 'Amount', 'Reason'].map(h => (
                            <th key={h} style={{ padding: '5px 8px', textAlign: 'left', fontWeight: 600 }}>{h}</th>
                          ))}
                        </tr>
                      </thead>
                      <tbody>
                        {importResult.unmatched.map((u, i) => (
                          <tr key={i} style={{ borderBottom: '1px solid #fde8e8', background: i % 2 === 0 ? '#fff' : '#fff7f7' }}>
                            <td style={{ padding: '5px 8px', color: '#374151' }}>{(u.row || {}).date || ''}</td>
                            <td style={{ padding: '5px 8px', color: '#374151' }}>{(u.row || {}).providerName || ''}</td>
                            <td style={{ padding: '5px 8px', color: '#374151' }}>{(u.row || {}).patientName || ''}</td>
                            <td style={{ padding: '5px 8px', color: '#374151' }}>${(u.row || {}).paymentAmount || ''}</td>
                            <td style={{ padding: '5px 8px', color: '#b91c1c', fontSize: 10 }}>{u.reason || ''}</td>

            </div>

            {/* ── Footer ─────────────────────────────────────────────── */}
            <div style={{
              padding: '12px 22px', borderTop: '1px solid #e5e7eb', display: 'flex',
              justifyContent: 'flex-end', gap: 8, background: '#f9fafb', flexShrink: 0

              {phase === 'upload' && (
                <button onClick={onClose}
                  style={{
                    background: '#f3f4f6', border: '1px solid #e5e7eb', borderRadius: 8,

                  }}>

                </button>
              )}
              {phase === 'preview' && <>

                  style={{
                    background: '#f3f4f6', border: '1px solid #e5e7eb', borderRadius: 8,
                    padding: '8px 18px', cursor: 'pointer', fontSize: 13, color: '#374151'
                  }}>

                <button onClick={runImport}

                  }}>

              </>}
              {phase === 'done' && (
                <button onClick={onClose}
                  style={{
                    background: IND, border: 'none', borderRadius: 8, padding: '8px 22px',
                    cursor: 'pointer', fontSize: 13, fontWeight: 800, color: '#fff'
                  }}>
                  Done ✓
                </button>

            </div>
          </div>
        </div>
      );
    }

    function BillingView({ appts, date, onUpdate, patientDb, onRefreshPatients }) {
      const [cptModal, setCptModal] = useState(null);
      const [rxModal, setRxModal] = useState(null);
      const [claimModal, setClaimModal] = useState(null);
      const [billerModal, setBillerModal] = useState(null);   // BillerApptModal for non-direct appointments
      const [rateCardOpen, setRateCardOpen] = useState(false);
      const [showLedger, setShowLedger] = useState(false);
      const [showRateAnalysis, setShowRateAnalysis] = useState(false);
      const [showNoteBoard, setShowNoteBoard] = useState(false);
      const [showImportPanel, setShowImportPanel] = useState(false);
      const [showBillingChannels, setShowBillingChannels] = useState(false);
      const sorted = [...appts].sort((a, b) => timeToMinutes(a.time) - timeToMinutes(b.time));
      // Void appointments (No-show / Rescheduled / Cancelled) are excluded from all
      // billing sections — no signature is required and no claim can be submitted.
      // Placeholder patients (calendar blocks) are also excluded from all billing.
      const activeAppts = sorted.filter(a => !isVoidAppt(a) && !isPlaceholderPatient(a.patient));
      const submtd = activeAppts.filter(a => a.billing === 'submitted');
      const notSubmitted = activeAppts.filter(a => a.billing !== 'submitted');
      const signedReady = notSubmitted.filter(a => a.out);   // signed → Submit Claim available (CPT optional)
      const needsSig = notSubmitted.filter(a => !a.out);  // not signed → cannot submit yet
      function saveCpt(appt, codes) {
        const billing = codes.length > 0 && appt.out ? 'ready' : 'pending';
        onUpdate({ ...appt, cpt: codes, billing });
        setCptModal(null);
      }
      function saveRxBilling(appt, meds) {
        // Biller saved Rx — set alert flag so Provider sees the notification
        onUpdate({ ...appt, rxMeds: meds, rxBillerAlert: true });
        setRxModal(null);
      }

      function getPatientInfo(a) {
        const pt = (patientDb || []).find(p =>
          `${p.firstName} ${p.lastName}`.toLowerCase() === (a.patient || '').toLowerCase()
        );
        return {
          insurance: a.directIns || (pt && pt.insurance) || '',
          portion: a.paymentType || (pt && pt.patientPortion) || '',
          rate: a.paymentRate || (pt && pt.rate) || '',
        };
      }

      // ── Scroll-preserving update ──────────────────────────────────────────
      // Saves window.scrollY before the React re-render triggered by onUpdate,
      // then restores it synchronously after the DOM is rebuilt (useLayoutEffect
      // runs before the browser paints, so the user never sees the jump).
      const savedScrollRef = React.useRef(null);
      React.useLayoutEffect(() => {
        if (savedScrollRef.current !== null) {
          const pos = savedScrollRef.current;
          savedScrollRef.current = null;
          window.scrollTo(0, pos);
        }
      });
      function scrollSafeUpdate(updated) {
        savedScrollRef.current = window.scrollY;
        onUpdate(updated);
      }

      function ClaimDayBanner() {
        // Count insurance-billing appointments not yet submitted (exclude direct pay,
        // which is handled separately in DirectPaySection).
        const notSub = notSubmitted.filter(a => a.method !== 'direct').length;
        if (!submtd.length && !notSub) return null;
        const pend = submtd.filter(a => !a.claimStatus || a.claimStatus === 'Pending').length;
        const paid = submtd.filter(a => a.claimStatus === 'Paid').length;
        const denied = submtd.filter(a => a.claimStatus === 'Denied').length;
        const resub = submtd.filter(a => a.claimStatus === 'Resubmitted').length;
        const paidAmt = submtd.reduce((s, a) => s + (parseFloat(a.claimPaidAmount) || 0), 0);
        return (
          <div className="claim-day-banner">
            <span className="claim-day-banner-label">Claims</span>
            {notSub > 0 && <span className="claim-day-stat cds-nosub">📤 {notSub} Not Submitted</span>}
            {pend > 0 && <span className="claim-day-stat cds-pend">⏳ {pend} Pending</span>}
            {denied > 0 && <span className="claim-day-stat cds-denied">✗ {denied} Denied</span>}
            {resub > 0 && <span className="claim-day-stat cds-resub">🔄 {resub} Resubmitted</span>}
            {paid > 0 && (
              <span className="claim-day-stat cds-paid">
                ✅ {paid} Paid
                {/* Large aggregate $ total — desktop only (hidden on phone via
                    .cds-paid-amt, see mobile media query). The small per-row
                    editable Paid-amount field (.csb-amt-input in BRow) stays
                    visible on phone either way. */}
                {paidAmt > 0 && (
                  <span className="cds-paid-amt"> · ${paidAmt.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
                )}
              </span>
            )}
          </div>
        );
      }
      function BRow({ a, action, onOpen }) {
        const ms = methodStatus(a);
        const isDirect = a.method === 'direct';
        const isSubmitted = a.billing === 'submitted';
        // Splits the old single "submitted" state into pending vs paid, per
        // Dean's 4-state card color spec — anything submitted but not yet
        // marked Paid (Pending / Denied / Resubmitted) reads as "pending".
        const isPaid = isSubmitted && a.claimStatus === 'Paid';
        const info = getPatientInfo(a);
        const [statusMenuOpen, setStatusMenuOpen] = React.useState(false);
        const [bestRateOpen, setBestRateOpen] = React.useState(false);
        const [bestRateData, setBestRateData] = React.useState(null);
        const [bestRateLoading, setBestRateLoading] = React.useState(false);
        const savedChannel = (() => {
          try {
            const pt = (patientDb || []).find(p =>
              `${p.firstName} ${p.lastName}`.toLowerCase() === (a.patient || '').toLowerCase()
            );
            return pt && pt.bestChannel ? JSON.parse(pt.bestChannel) : null;
          } catch (e) { return null; }
        })();
        const CS_CLS = { Paid: 'csb-paid', Pending: 'csb-pend', Denied: 'csb-denied', Resubmitted: 'csb-resub' };
        const CS_ICON = { Paid: '✅', Pending: '⏳', Denied: '✗', Resubmitted: '🔄' };
        const st = a.claimStatus || 'Pending';

        function openBestRate(e) {
          e.stopPropagation();
          setBestRateOpen(true);
          if (bestRateData) return; // already loaded
          const carrier = info.insurance;
          const state = ''; // no state on appt — shows all-state rates
          const cpts = normCpt(a.cpt).join(',') || '99214';
          if (!carrier || carrier.toLowerCase().includes('cash')) {
            setBestRateData({ mapped: false, raw_carrier: carrier || 'No carrier' });
            return;
          }
          setBestRateLoading(true);
          fetch('http://192.168.88.178:8000/api/best-channel?carrier=' + encodeURIComponent(carrier) +
            '&state=FL&cpts=' + encodeURIComponent(cpts) + '&provider=' + encodeURIComponent(a.provID || ''))
            .then(r => r.json())
            .then(d => { setBestRateLoading(false); setBestRateData(d); })
            .catch(() => { setBestRateLoading(false); setBestRateData({ error: true }); });
        }

        function ClaimBadge() {
          if (!isSubmitted) return null;
          const cls = CS_CLS[st] || 'csb-pend';
          const icon = CS_ICON[st] || '⏳';
          const amt = parseFloat(a.claimPaidAmount) || 0;
          if (isDirect) {
            return (
              <div className="csb-wrap">
                <span className={`csb ${cls}`} title="Click card to edit claim details">
                  {icon} {st}{st === 'Paid' && amt > 0 ? ` · $${amt.toFixed(2)}` : ''}
                </span>
              </div>
            );
          }
          return (
            <div className="csb-wrap" onClick={e => e.stopPropagation()}>
              <span className={`csb ${cls}`}>{icon} {st}</span>
              {st === 'Paid' && (
                <input
                  className="csb-amt-input"
                  placeholder="$0.00"
                  defaultValue={a.claimPaidAmount && !isNaN(parseFloat(a.claimPaidAmount))
                    ? `$${parseFloat(a.claimPaidAmount).toFixed(2)}` : ''}
                  onFocus={e => { e.target.value = e.target.value.replace(/[^0-9.]/g, ''); e.target.select(); }}
                  onBlur={e => {
                    const v = e.target.value.replace(/[^0-9.]/g, '');
                    e.target.value = (v && !isNaN(parseFloat(v))) ? `$${parseFloat(v).toFixed(2)}` : '';
                    if (v !== (a.claimPaidAmount || '')) scrollSafeUpdate({ ...a, claimPaidAmount: v });
                  }}
                />
              )}
              {!statusMenuOpen
                ? <button className="csb-change-btn" onClick={() => setStatusMenuOpen(true)}>▾ Change</button>
                : <div className="csb-status-menu">
                  {['Pending', 'Denied', 'Resubmitted'].filter(s => s !== st).map(s => (
                    <button key={s} className={`csb-sm-btn csb-sm-${s.toLowerCase()}`}
                      onClick={() => { scrollSafeUpdate({ ...a, claimStatus: s }); setStatusMenuOpen(false); }}>
                      {CS_ICON[s]} {s}
                    </button>
                  ))}
                  {st !== 'Paid' && (
                    <button className="csb-sm-btn csb-sm-paid"
                      onClick={() => { scrollSafeUpdate({ ...a, claimStatus: 'Paid' }); setStatusMenuOpen(false); }}>
                      ✅ Paid
                    </button>
                  )}
                  <button className="csb-sm-btn csb-sm-cancel" onClick={() => setStatusMenuOpen(false)}>✕</button>
                </div>
              }
            </div>
          );
        }

        return (
          <>
            {bestRateOpen && (
              <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,.45)', zIndex: 9800, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 12 }}
                onClick={e => { e.stopPropagation(); setBestRateOpen(false); }}>
                <div style={{
                  background: '#fff', borderRadius: 0, boxShadow: '0 10px 44px rgba(43,39,22,.28)',
                  width: 'min(480px,95vw)', maxHeight: '85vh', overflow: 'auto', border: '1px solid #09371F'
                }}
                  onClick={e => e.stopPropagation()}>
                  <div style={{
                    background: 'linear-gradient(135deg, #09371F, #0d5c33)', padding: '14px 18px', borderRadius: 0,
                    display: 'flex', alignItems: 'center', justifyContent: 'space-between'
                  }}>
                    <div>
                      <div style={{ color: '#F2EDDB', fontWeight: 800, fontSize: 15 }}>💰 Best Billing Channel</div>
                      <div style={{ color: 'rgba(242,237,219,.7)', fontSize: 11, marginTop: 2 }}>
                        {a.patient} · {info.insurance || 'No carrier'}
                      </div>
                    </div>
                    <button onClick={e => { e.stopPropagation(); setBestRateOpen(false); }}
                      style={{ background: 'none', border: 'none', color: 'rgba(242,237,219,.7)', fontSize: 22, cursor: 'pointer', lineHeight: 1 }}>×</button>
                  </div>
                  <div style={{ padding: '16px 18px' }}>
                    {bestRateLoading && <div style={{ textAlign: 'center', color: '#777355', padding: '24px 0' }}>Checking rates…</div>}
                    {bestRateData && !bestRateLoading && (() => {
                      const C = {
                        'Clinic Submit': { bg: '#7494AA', bd: '#7494AA', tx: '#fff', lb: 'CLINIC' },
                        'Headway': { bg: '#16A562', bd: '#16A562', tx: '#fff', lb: 'HEADWAY' },
                        'Alma': { bg: '#2D4F33', bd: '#2D4F33', tx: '#fff', lb: 'ALMA' },
                        'Grow Therapy': { bg: '#BCA9F7', bd: '#BCA9F7', tx: '#2B2716', lb: 'GROW' },
                      };
                      if (bestRateData.error || !bestRateData.mapped) return (
                        <div style={{ color: '#777355', fontSize: 13, textAlign: 'center', padding: '20px 0' }}>
                          No rates on file for <strong>{info.insurance || 'this carrier'}</strong>
                          <div style={{ fontSize: 11, marginTop: 6 }}>Check CPT Dashboard for details</div>
                        </div>
                      );
                      const ch = bestRateData.overall_best_channel;
                      const c = C[ch] || { bg: '#F2EDDB', bd: '#FBFBF3', tx: '#2B2716', lb: ch };
                      return (
                        <>
                          <div style={{
                            display: 'flex', alignItems: 'center', gap: 10, marginBottom: 14,
                            padding: '10px 14px', background: c.bg, borderRadius: 0, border: `1.5px solid ${c.bd}`
                          }}>
                            <span style={{ color: c.tx, fontWeight: 800, fontSize: 14 }}>★ {c.lb} pays best</span>
                            <span style={{ color: c.tx, fontSize: 12, opacity: .8 }}>{bestRateData.canonical_payer} · {bestRateData.state}</span>
                          </div>
                          <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13 }}>
                            <thead>
                              <tr style={{ background: '#09371F' }}>
                                <th style={{ padding: '6px 8px', textAlign: 'left', color: 'rgba(242,237,219,.8)', fontWeight: 700, fontSize: 11 }}>CPT</th>
                                {['Clinic Submit', 'Headway', 'Alma', 'Grow Therapy'].map(ch2 => {
                                  const labels = { 'Clinic Submit': 'CLINIC', 'Headway': 'HEADWAY', 'Alma': 'ALMA', 'Grow Therapy': 'GROW' };
                                  return <th key={ch2} style={{ padding: '6px 8px', textAlign: 'right', color: '#F2EDDB', fontWeight: 700, fontSize: 11 }}>{labels[ch2]}</th>;
                                })}
                                <th style={{ padding: '6px 8px', textAlign: 'right', color: 'rgba(242,237,219,.55)', fontWeight: 700, fontSize: 11 }}>MED</th>
                              </tr>
                            </thead>
                            <tbody>
                              {(bestRateData.cpt_results || []).map((row, i) => {
                                const rates = { 'Clinic Submit': row.clinic_rate, 'Headway': row.headway_rate, 'Alma': row.alma_rate, 'Grow Therapy': row.grow_rate };
                                const maxRate = Math.max(...Object.values(rates).filter(v => v != null));
                                return (
                                  <tr key={row.cpt_code} style={{ background: i % 2 === 0 ? '#fff' : '#F2EDDB', borderBottom: '1px solid #FBFBF3' }}>
                                    <td style={{ padding: '7px 8px', fontWeight: 800, color: '#2B2716' }}>{row.cpt_code}</td>
                                    {['Clinic Submit', 'Headway', 'Alma', 'Grow Therapy'].map(ch2 => {
                                      const rate = rates[ch2];
                                      const isBest = rate != null && rate === maxRate;
                                      const co = C[ch2];
                                      return (
                                        <td key={ch2} style={{
                                          padding: '7px 8px', textAlign: 'right',
                                          background: isBest && co ? co.bg : 'transparent',
                                          fontWeight: isBest ? 800 : 400,
                                          color: isBest && co ? co.tx : '#777355'
                                        }}>
                                          {rate != null ? `$${rate.toFixed(2)}` : '—'}{isBest ? ' ★' : ''}
                                        </td>
                                      );
                                    })}
                                    <td style={{ padding: '7px 8px', textAlign: 'right', color: '#777355' }}>
                                      {row.medicare_rate ? `$${row.medicare_rate.toFixed(2)}` : '—'}
                                    </td>
                                  </tr>
                                );
                              })}
                            </tbody>
                            <tfoot>
                              <tr style={{ borderTop: '2px solid #09371F', background: '#F2EDDB' }}>
                                <td style={{
                                  padding: '8px 8px', fontWeight: 800, color: '#2B2716', fontSize: 11,
                                  textTransform: 'uppercase', letterSpacing: '.5px'
                                }}>TOTAL</td>
                                {['Clinic Submit', 'Headway', 'Alma', 'Grow Therapy'].map(ch2 => {
                                  const total = (bestRateData.channel_totals || {})[ch2];
                                  const isWinner = total != null && ch2 === ch;
                                  const co = C[ch2];
                                  return (
                                    <td key={ch2} style={{
                                      padding: '8px 8px', textAlign: 'right', fontWeight: 800,
                                      background: isWinner && co ? co.bg : 'transparent',
                                      color: isWinner && co ? co.tx : '#2B2716'
                                    }}>
                                      {total != null ? `$${total.toFixed(2)}` : '—'}{isWinner ? ' ★' : ''}
                                    </td>
                                  );
                                })}
                                <td></td>
                              </tr>
                            </tfoot>
                          </table>
                          <div style={{
                            marginTop: 12, padding: '8px 12px', background: '#F2EDDB', borderRadius: 0,
                            fontSize: 11, color: '#777355', display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap'
                          }}>
                            <span>Current method:</span>
                            <span style={{
                              background: METHOD_COLOR[a.method] || '#4B5563', color: '#fff',
                              padding: '2px 9px', borderRadius: 0, fontWeight: 700, fontSize: 11
                            }}>
                              {METHOD_LABEL[a.method] || a.method}
                            </span>
                            {METHOD_LABEL[a.method] !== ch
                              ? <span style={{ color: '#FBBF24', fontWeight: 700 }}>⚠ Consider switching to {ch}</span>
                              : <span style={{ color: '#059669', fontWeight: 700 }}>✓ Already on best channel</span>}
                          </div>
                        </>
                      );
                    })()}
                  </div>
                </div>
              </div>
            )}
            <div
              className={`b-card${isDirect ? ' b-card-direct' : ''}${!a.out ? ' b-card-baseline' : (isSubmitted ? (isPaid ? ' b-card-paid' : ' b-card-pending') : ' b-card-unsubmitted')}`}
              style={{ cursor: (isDirect || onOpen) ? 'pointer' : 'default' }}
              onClick={isDirect ? () => setClaimModal(a) : (onOpen ? () => onOpen(a) : undefined)}>
              <div style={{ minWidth: 150 }}>
                <div className="b-name" style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                  {a.patient}
                  {onOpen && (
                    <span onClick={e => e.stopPropagation()}>
                      <CommChatIcon appt={a} onOpen={() => onOpen(a)} />
                    </span>
                  )}
                </div>
                <div className="b-time">{fmtTime(a.time)}</div>
                <div style={{ marginTop: 4 }}>
                  {a.tebraStatus
                    ? <TBadge status={a.tebraStatus} />
                    : <span className="ts-none">Tebra —</span>}
                </div>
                <div style={{ marginTop: 3 }}>
                  <span className="b-method-badge"
                    style={{ background: METHOD_COLOR[a.method] || '#4B5563', color: '#fff' }}>
                    {METHOD_LABEL[a.method] || a.method}
                  </span>
                </div>
                {info.insurance && (() => {
                  const ic2 = insColor(info.insurance);
                  return (
                    <div style={{ marginTop: 4 }}>
                      <span className="b-ins-badge" style={{ background: ic2.bg, color: ic2.fg }}>{info.insurance}</span>
                    </div>
                  );
                })()}
                {savedChannel && savedChannel.channel && (() => {
                  const BC = {
                    'Clinic Submit': { bg: '#7494AA', bd: '#7494AA', tx: '#fff', lb: 'CLINIC' },
                    'Headway': { bg: '#16A562', bd: '#16A562', tx: '#fff', lb: 'HEADWAY' },
                    'Alma': { bg: '#2D4F33', bd: '#2D4F33', tx: '#fff', lb: 'ALMA' },
                    'Grow Therapy': { bg: '#BCA9F7', bd: '#BCA9F7', tx: '#2B2716', lb: 'GROW' },
                  };
                  const bc = BC[savedChannel.channel] || { bg: '#f1f5f9', bd: '#cbd5e1', tx: '#475569', lb: savedChannel.channel };
                  const rate = savedChannel.rate ? parseFloat(savedChannel.rate) : null;
                  return (
                    <div style={{ marginTop: 4 }}>
                      <span style={{ background: bc.bg, border: `1.5px solid ${bc.bd}`, color: bc.tx, padding: '2px 8px', borderRadius: '20px', fontSize: '10px', fontWeight: 700 }}>
                        ★ {bc.lb}{rate ? ` · $${rate.toFixed(2)}` : ''}
                      </span>
                    </div>
                  );
                })()}
                {isDirect && isZeroRate(info.rate)
                  ? <div className="b-zero-copay-badge">💚 $0 Copay</div>
                  : (info.portion || info.rate) && (
                    <div style={{ fontSize: 11, color: isSubmitted ? '#3D5C4C' : '#777355', marginTop: 2 }}>
                      {info.portion && <span style={{ background: isSubmitted ? '#fff' : '#F2EDDB', border: isSubmitted ? '1px solid #09371F' : 'none', color: isSubmitted ? '#09371F' : '#534B28', padding: '1px 6px', borderRadius: 0, fontWeight: 700, fontSize: 11, marginRight: 5 }}>{info.portion}</span>}
                      {info.rate && <span>Rate: <strong>{info.rate}</strong></span>}
                    </div>
                  )
                }
                {ms.text && <div style={{ fontSize: 11, color: isSubmitted ? '#3D5C4C' : (ms.valid === true ? '#09371F' : ms.valid === false ? '#dc2626' : '#777355'), fontWeight: 600, marginTop: 3 }}>{ms.text}</div>}
                <div style={{ marginTop: 5 }}>
                  {a.out
                    ? <span style={{ background: '#fff', border: '1px solid #16a34a', color: '#16a34a', borderRadius: 0, padding: '2px 8px', fontSize: 10, fontWeight: 800 }}>✓ Note Signed</span>
                    : <span style={{ background: '#fff', border: '1px solid #BE992A', color: '#BE992A', borderRadius: 0, padding: '2px 8px', fontSize: 10, fontWeight: 800 }}>⚠ Awaiting Signature</span>}
                </div>
                {/* 💰 Best Rate button — works for ALL billing methods */}
                {(
                  <button
                    onClick={openBestRate}
                    style={{
                      marginTop: 6, background: '#09371F', border: 'none', color: '#F2EDDB',
                      padding: '3px 10px', borderRadius: 0, fontSize: 10, fontWeight: 800,
                      cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 4, fontFamily: 'inherit'
                    }}>
                    💰 Best Rate
                  </button>
                )}
              </div>
              {/* ── CENTER: CPT Codes + Claim Status (prominent) ── */}
              <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 8, justifyContent: 'center', alignItems: 'center', padding: '0 12px' }}>
                {(() => {
                  const cptArr = (a.cpt || []).filter(c => String(c).trim() !== '');
                  const hasCodes = cptArr.length > 0;
                  return (
                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, justifyContent: 'center', alignItems: 'center' }}>
                      {cptArr.map(c => (
                        <span key={c} style={{ background: '#09371F', color: '#F2EDDB', borderRadius: 0, padding: '5px 14px', fontSize: 15, fontWeight: 900, letterSpacing: .3 }}>{String(c).trim()}</span>
                      ))}
                      <button className="sub-btn plain"
                        style={{ fontSize: 13, padding: '5px 12px' }}
                        onClick={e => { e.stopPropagation(); setCptModal(a); }}>
                        {hasCodes ? '✎ Edit' : '+ Add CPT'}
                      </button>
                    </div>
                  );
                })()}
                {isSubmitted && (() => {
                  const clSt = a.claimStatus || 'Pending';
                  const stStyle = {
                    Paid: { bd: '#16a34a', fg: '#16a34a' },
                    Pending: { bd: '#BE992A', fg: '#BE992A' },
                    Denied: { bd: '#D9383A', fg: '#791F1F' },
                    Resubmitted: { bd: '#7494AA', fg: '#3D768A' },
                  }[clSt] || { bd: '#777355', fg: '#777355' };
                  const stIcon = { Paid: '✅', Pending: '⏳', Denied: '✗', Resubmitted: '🔄' }[clSt] || '⏳';
                  const paidAmt = clSt === 'Paid' && a.claimPaidAmount ? ` · $${parseFloat(a.claimPaidAmount).toFixed(2)}` : '';
                  return (
                    <div style={{ background: '#fff', border: `1px solid ${stStyle.bd}`, color: stStyle.fg, borderRadius: 0, padding: '6px 18px', fontSize: 15, fontWeight: 900, textAlign: 'center' }}>
                      {stIcon} {clSt}{paidAmt}
                    </div>
                  );
                })()}
              </div>
              {/* ── RIGHT: CS Prescribed (compact) + Action ── */}
              <div style={{ display: 'flex', flexDirection: 'column', gap: 6, flexShrink: 0, alignItems: 'flex-end', minWidth: 140 }}>
                <div style={{ background: '#F2EDDB', border: '1px solid #09371F', borderRadius: 0, padding: '5px 10px', fontSize: 11 }}>
                  <div style={{ fontSize: 9, fontWeight: 800, color: '#09371F', textTransform: 'uppercase', letterSpacing: .4, marginBottom: 3 }}>CS Prescribed</div>
                  {(a.rxMeds || []).length === 0
                    ? <span style={{ color: '#94a3b8', fontStyle: 'italic' }}>None</span>
                    : <div style={{ display: 'flex', flexWrap: 'wrap', gap: 3 }}>
