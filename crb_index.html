    function ClaimsLedger({ onClose, provFilter }) {
      const [rows, setRows] = useState(null);   // null=loading
      const [loading, setLoading] = useState(true);
      const [carrierFilter, setCarrierFilter] = useState('');
      const [statusFilter, setStatusFilter] = useState('');
      const [ptSearch, setPtSearch] = useState('');
      // Local edit buffer for notes — keyed by appt id; syncs to GAS on blur
      const [localNotes, setLocalNotes] = useState({});

      useEffect(() => {
        setLoading(true);
        gsr('getClaimsLedger', provFilter || '')
          .then(json => {
            try { const d = JSON.parse(json); setRows(Array.isArray(d) ? d : []); }
            catch (e) { setRows([]); }
            setLoading(false);
          })
          .catch(() => { setRows([]); setLoading(false); });
      }, [provFilter]);

      // ── Filtering ────────────────────────────────────────────
      const allRows = rows || [];
      const filtered = allRows.filter(r => {
        if (carrierFilter && (r.carrier || 'Unknown') !== carrierFilter) return false;
        if (statusFilter && (r.claimStatus || 'none') !== statusFilter) return false;
        if (ptSearch && !(r.patient || '').toLowerCase().includes(ptSearch.toLowerCase())) return false;
        return true;
      });

      // Unique sorted carriers from ALL rows (for filter dropdown)
      const carriers = [...new Set(allRows.map(r => r.carrier || 'Unknown'))].sort();

      // Group filtered rows by carrier → patient
      const carrierOrder = [...new Set(filtered.map(r => r.carrier || 'Unknown'))].sort();
      const byCarrier = {};
      filtered.forEach(r => {
        const c = r.carrier || 'Unknown';
        if (!byCarrier[c]) byCarrier[c] = [];
        byCarrier[c].push(r);
      });

      // ── Stats (always from all rows) ─────────────────────────
      const totalCount = allRows.length;
      const paidCount = allRows.filter(r => r.claimStatus === 'Paid').length;
      const pendCount = allRows.filter(r => !r.claimStatus || r.claimStatus === 'Pending').length;
      const totalPaid = allRows.reduce((s, r) => s + (parseFloat(r.claimPaidAmount) || 0), 0);
      const totalDep = allRows.reduce((s, r) => s + (parseFloat(r.claimDepositAmount) || 0), 0);

      // ── Helpers ──────────────────────────────────────────────
      function isComplete(r) {
        return r.claimStatus === 'Paid' && r.claimCheckID && r.claimDepositDate && r.claimDepositBank;
      }
      function fmtD(s) {
        if (!s) return '';
        const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (m) return `${parseInt(m[2])}/${parseInt(m[3])}/${m[1].slice(2)}`;
        return s;
      }
      function sBlockCls(st) { return `cl-status-block st-${st || 'none'}`; }
      function fmtAmt(v) { const n = parseFloat(v); return isNaN(n) ? '' : `$${n.toFixed(2)}`; }

      // Format a dollar value without trailing cents when whole number: $20 vs $20.50
      function fmtCopayAmt(v) {
        const n = parseFloat(v);
        if (isNaN(n)) return '$0';
        return n % 1 === 0 ? `$${n}` : `$${n.toFixed(2)}`;
      }
      // Format ISO date as "Month D YYYY" for copay display
      const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'];
      function fmtPayDate(s) {
        if (!s) return '';
        const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!m) return '';
        return `${MONTH_NAMES[parseInt(m[2]) - 1]} ${parseInt(m[3])} ${m[1]}`;
      }
      // CSC (Cost Share Class) raw values → display labels. Matches the
      // paymentType options set in the Billing window's copay dropdown.
      const CSC_LABELS = { copay: 'Copay', coinsurance: 'Coinsurance', 'cash-pay': 'Cash Pay', deductible: 'Deductible' };

      // Split a full "First Last" (or "First Middle Last") patient name into
      // First / Last lines for the Patient column. Everything after the first
      // space is treated as the last name so multi-word last names stay intact.
      function splitPatientName(full) {
        const parts = String(full || '').trim().split(/\s+/);
        return { first: parts[0] || '', last: parts.slice(1).join(' ') };
      }

      // Build the labeled Copay/Notes block: Date collected / PPC / CSC / Amount.
      // Returns null only when there's truly nothing to show (no rate, no PPC,
      // no CSC) — same "entirely absent" rule buildCopayLine used to use for
      // the incomplete/blue-cell state.
      function buildCopayDetails(r) {
        const raw = String(r.paymentRate !== undefined ? r.paymentRate : '').trim();
        const hasPpcCsc = !!(r.paymentPlatform || r.paymentType);
        if (raw === '' && !hasPpcCsc) return null;

        const isPct = raw.includes('%');
        const rateNum = parseFloat(raw);
        const rateStr = raw === '' ? '' : (isPct ? raw : fmtCopayAmt(rateNum));
        const paidNum = r.paymentCollected
          ? (parseFloat(r.paymentAmount) || (isPct ? 0 : rateNum))
          : 0;
        const paidStr = raw === '' ? '' : fmtCopayAmt(paidNum);
        const amountStr = raw !== '' ? `${paidStr} / ${rateStr}` : '';
        const dateStr = (r.paymentCollected && r.paymentDate) ? fmtPayDate(r.paymentDate) : '';
        const ppc = r.paymentPlatform ? (r.paymentPlatform === 'other' ? 'Other' : r.paymentPlatform) : '';
        const csc = CSC_LABELS[r.paymentType] || r.paymentType || '';
        return { dateStr, ppc, csc, amountStr };
      }

      return (
        <div className="cl-overlay" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
          <div className="cl-panel">

            {/* ── Header ── */}
            <div className="cl-hdr">
              <div>
                <div className="cl-hdr-title">📋 Claims Ledger</div>
                <div className="cl-hdr-sub">
                  {provFilter
                    ? `Provider: ${provFilter.charAt(0).toUpperCase() + provFilter.slice(1)}`
                    : 'All Providers'}
                  {' · '}View-Only Reference
                </div>
              </div>
              <div className="cl-hdr-controls">
                <div className="cl-search-wrap">
                  <span className="cl-search-icon">🔍</span>
                  <input
                    type="text"
                    className="cl-search-input"
                    placeholder="Search patient…"
                    value={ptSearch}
                    onChange={e => setPtSearch(e.target.value)}
                  />
                  {ptSearch && (
                    <button className="cl-search-clear" onClick={() => setPtSearch('')} title="Clear search">✕</button>
                  )}
                </div>
                <select className="cl-filter-select" value={carrierFilter}
                  onChange={e => setCarrierFilter(e.target.value)}>
                  <option value="">All Carriers</option>
                  {carriers.map(c => <option key={c} value={c}>{c}</option>)}
                </select>
                <select className="cl-filter-select" value={statusFilter}
                  onChange={e => setStatusFilter(e.target.value)}>
                  <option value="">All Statuses</option>
                  <option value="Pending">Pending</option>
                  <option value="Paid">Paid</option>
                  <option value="Denied">Denied</option>
                  <option value="Resubmitted">Resubmitted</option>
                </select>
                <button className="cl-close-btn" onClick={onClose}>✕ Close</button>
              </div>
            </div>

            {/* ── Stats bar ── */}
            {!loading && totalCount > 0 && (
              <div className="cl-stats">
                <div className="cl-stat-item"><span className="cl-stat-num">{totalCount}</span>&nbsp;Claims</div>
                <span className="cl-stat-sep">|</span>
                <div className="cl-stat-item" style={{ color: '#16a34a' }}>
                  <span className="cl-stat-num" style={{ color: '#15803d' }}>{paidCount}</span>&nbsp;Paid
                </div>
                <span className="cl-stat-sep">|</span>
                <div className="cl-stat-item" style={{ color: '#B45309' }}>
                  <span className="cl-stat-num" style={{ color: '#92400E' }}>{pendCount}</span>&nbsp;Pending
                </div>
                <span className="cl-stat-sep">|</span>
                <div className="cl-stat-item" style={{ color: '#16a34a' }}>
                  <span className="cl-stat-num" style={{ color: '#15803d' }}>{fmtAmt(totalPaid)}</span>&nbsp;Total Paid
                </div>
                {totalDep > 0 && <>
                  <span className="cl-stat-sep">|</span>
                  <div className="cl-stat-item" style={{ color: '#0369A1' }}>
                    <span className="cl-stat-num" style={{ color: '#0369A1' }}>{fmtAmt(totalDep)}</span>&nbsp;Deposited
                  </div>
                </>}
              </div>
            )}

            {/* ── Body ── */}
            <div className="cl-body">
              {loading && (
                <div className="cl-loading">
                  <div className="spinner" style={{ width: 20, height: 20 }} />
                  Loading claims data…
                </div>
              )}
              {!loading && totalCount === 0 && (
                <div className="cl-empty">
                  <span style={{ fontSize: 32 }}>📋</span>
                  No submitted claims found
                  <span style={{ fontSize: 12 }}>Claims appear here once a Claim Submitted Date is entered in the Billing window</span>
                </div>
              )}
              {!loading && totalCount > 0 && carrierOrder.length === 0 && (
                <div className="cl-empty">
                  <span style={{ fontSize: 28 }}>🔍</span>
                  No results match the current filters
                </div>
              )}

              {/* ── Single unified table — one <colgroup> drives widths for ALL carrier sections ── */}
              {!loading && carrierOrder.length > 0 && (
                <table className="cl-table">
                  <colgroup>
                    <col className="cl-col-pt" />
                    <col className="cl-col-date" />
                    <col className="cl-col-sub" />
                    <col className="cl-col-status" />
                    <col className="cl-col-check" />
                    <col className="cl-col-dep" />
                    <col className="cl-col-notes" />
                  </colgroup>
                  <thead>
                    <tr>
                      <th className="cl-td-pt">Patient</th>
                      <th className="cl-td-date">Date/CPT</th>
                      <th className="cl-td-sub">Claim Submit</th>
                      <th className="cl-td-status">Status / Paid</th>
                      <th className="cl-td-check">Check ID / Bundle</th>
                      <th className="cl-td-dep">Deposit</th>
                      <th className="cl-td-notes">Copay / Notes</th>
                    </tr>
                  </thead>
                  <tbody>
                    {carrierOrder.map(carrier => {
                      const cRows = byCarrier[carrier];

                      // Group by patient (preserve order of first appearance)
                      const ptOrder = [];
                      const byPt = {};
                      cRows.forEach(r => {
                        const pt = r.patient || '';
                        if (!byPt[pt]) { byPt[pt] = []; ptOrder.push(pt); }
                        byPt[pt].push(r);
                      });

                      return (
                        <React.Fragment key={carrier}>
                          {/* Carrier group header — spans all 7 columns */}
                          <tr>
                            <td colSpan={7} className="cl-carrier-group-td">
                              <div className="cl-carrier-hdr">
                                <span>🏥 {carrier}</span>
                                <span className="cl-carrier-count">
                                  {cRows.length} claim{cRows.length !== 1 ? 's' : ''}
                                </span>
                              </div>
                            </td>
                          </tr>

                          {/* Data rows for this carrier */}
                          {ptOrder.map(pt => {
                            const ptRows = byPt[pt];
                            return ptRows.map((r, ri) => {
                              const complete = isComplete(r);
                              const cpts = Array.isArray(r.cpt) ? r.cpt : [];

                              const okDate = !!(r.date && cpts.length > 0);
                              const okSub = !!r.claimSubmittedDate;
                              const okStatus = !!(r.claimStatus === 'Paid' && r.claimPaidDate && r.claimPaidAmount);
                              const okCheck = !!r.claimCheckID;
                              const okDep = !!(r.claimDepositBank || r.claimDepositDate || r.claimDepositAmount);
                              // Copay / Notes cell state:
                              //   Blue (incomplete) = no rate data entered at all
                              //   Red  (owed)       = rate known & non-zero/% but not yet collected
                              //   Clear             = $0 copay, or payment collected
                              const rawRate = String(r.paymentRate !== undefined ? r.paymentRate : '').trim();
                              const isPctRate = rawRate.includes('%');
                              const rateNum = parseFloat(rawRate);
                              const hasRateData = rawRate !== '';
                              const copayOwed = hasRateData && !r.paymentCollected &&
                                (isPctRate || (!isNaN(rateNum) && rateNum > 0));
                              // Blue incomplete only when data is entirely absent
                              const okNotes = hasRateData || !!r.claimStatusNotes;
                              const displayStatus = r.claimStatus || (okSub ? 'auto-pend' : '');
                              const ic = (ok, base) => `${base}${ok ? '' : ' cl-td-incomplete'}`;

                              const rowClass = [
                                complete ? 'cl-complete' : '',
                                ri === 0 ? 'cl-pt-sep' : '',
                              ].filter(Boolean).join(' ');

                              return (
                                <tr key={r.id || `${pt}-${ri}`} className={rowClass || undefined}>

                                  {ri === 0 ? (() => {
                                    const { first, last } = splitPatientName(r.patient);
                                    return (
                                      <td className="cl-td-pt" rowSpan={ptRows.length}>
                                        <div className="cl-pt-name">{first}</div>
                                        {last && <div className="cl-pt-last">{last}</div>}
                                        {r.memberID && <div className="cl-member-id">ID: {r.memberID}</div>}
                                      </td>
                                    );
                                  })() : null}

                                  <td className={ic(okDate, 'cl-td-date')}>
                                    <div className="cl-date-main">{fmtD(r.date)}</div>
                                    {cpts.length > 0 && (
                                      <div className="cl-cpt-chips">
                                        {cpts.map(c => <span key={c} className="cl-cpt-chip">{c}</span>)}
                                      </div>
                                    )}
                                  </td>

                                  <td className={ic(okSub, 'cl-td-sub')}>
                                    {r.claimSubmittedDate
                                      ? <div className="cl-sub-main">Date submitted: {fmtD(r.claimSubmittedDate)}</div>
                                      : <span className="cl-none">—</span>}
                                    {r.claimPlatform && <div className="cl-sub-detail">CSG: {r.claimPlatform}</div>}
                                    {r.claimID && <div className="cl-sub-detail">Claim #: {r.claimID}</div>}
                                  </td>

                                  <td className={ic(okStatus, 'cl-td-status')}>
                                    <div className="cl-status-row">
                                      <span className="cl-status-label">Status:</span>
                                      {displayStatus === 'auto-pend'
                                        ? <span className="cl-status-block st-Pending">⏳ Pending</span>
                                        : displayStatus
                                          ? <span className={sBlockCls(r.claimStatus)}>{r.claimStatus}</span>
                                          : <span className="cl-none">—</span>}
                                    </div>
                                    {r.claimPaidDate && <div className="cl-paid-date">Date: {fmtD(r.claimPaidDate)}</div>}
                                    {r.claimPaidAmount && <div className="cl-paid-amt">Amount: {fmtAmt(r.claimPaidAmount)}</div>}
                                  </td>

                                  <td className={ic(okCheck, 'cl-td-check')}>
                                    {r.claimCheckID
                                      ? <div className="cl-check-main">Check ID: {r.claimCheckID}</div>
                                      : <span className="cl-none">—</span>}
                                    {r.claimBundled && (
                                      <div className="cl-bundle-badge">
                                        Bundle Amount: {r.claimBundledAmount ? fmtAmt(r.claimBundledAmount) : '—'}
                                      </div>
                                    )}
                                  </td>

                                  <td className={ic(okDep, 'cl-td-dep')}>
                                    {r.claimDepositBank
                                      ? <div className="cl-dep-main">Bank: {r.claimDepositBank}</div>
                                      : <span className="cl-none">—</span>}
                                    {r.claimDepositDate && <div className="cl-dep-detail">Date: {fmtD(r.claimDepositDate)}</div>}
                                    {r.claimDepositAmount && <div className="cl-dep-amt">Amount: {fmtAmt(r.claimDepositAmount)}</div>}
                                  </td>

                                  <td className={`${ic(okNotes, 'cl-td-notes')}${copayOwed ? ' cl-copay-owed' : ''}`}>
                                    {(() => {
                                      const cd = buildCopayDetails(r);
                                      return (
                                        <>
                                          {cd
                                            ? <div className={`cl-copay-line${copayOwed ? ' cl-copay-line-owed' : ''}`}>
                                              {copayOwed && <div className="cl-copay-owed-flag">⚠ Owed</div>}
                                              {cd.dateStr && <div className="cl-copay-row">Date collected: {cd.dateStr}</div>}
                                              {cd.ppc && <div className="cl-copay-row">PPC: {cd.ppc}</div>}
                                              {cd.csc && <div className="cl-copay-row">CSC: {cd.csc}</div>}
                                              {cd.amountStr && <div className="cl-copay-row cl-copay-amount">Amount: {cd.amountStr}</div>}
                                            </div>
                                            : <span className="cl-none">—</span>}
                                          <textarea
                                            className="cl-notes-input"
                                            value={localNotes[r.id] !== undefined ? localNotes[r.id] : (r.claimStatusNotes || '')}
                                            onChange={e => setLocalNotes(prev => ({ ...prev, [r.id]: e.target.value }))}
                                            onBlur={e => {
                                              const val = e.target.value;
                                              if (val !== (r.claimStatusNotes || '')) {
                                                gsr('saveClaimNotes', r.provID, r.date, r.id, val)
                                                  .then(() => setRows(prev => (prev || []).map(row =>
                                                    row.id === r.id ? { ...row, claimStatusNotes: val } : row
                                                  )))
                                                  .catch(() => { });
                                              }
                                            }}
                                            placeholder="Add notes…"
                                            rows={1}
                                          />
                                        </>
                                      );
                                    })()}
                                  </td>
                                </tr>
                              );
                            });
                          })}
                        </React.Fragment>
                      );
                    })}
                  </tbody>
                </table>
              )}
            </div>

            {/* ── Footer ── */}
            <div className="cl-footer">
              <div className="cl-legend">
                <div className="cl-legend-item">
                  <div className="cl-legend-swatch cl-legend-swatch-tan" />
                  <span>Blue cell = awaiting input</span>
                </div>
                <div className="cl-legend-item">
                  <div className="cl-legend-swatch cl-legend-swatch-green" />
                  <span>Green row = fully complete (Paid · Check · Deposit)</span>
                </div>
              </div>
              <span>View-only · Edit claims via Billing window</span>
            </div>

          </div>
        </div>
      );
    }

    /* ─────────────────────────────────────────────────────────────────────
       PatientInfoModal — Provider clicks a patient name in the Day View to
       see pre-encounter screener scores, clinical notes, and checklist status.
    ───────────────────────────────────────────────────────────────────────── */
    function PatientInfoModal({ appt, onClose }) {
      const SCR_NAMES = ['PHQ-9', 'GAD-7', 'PCL-5'];
      const scrData = appt.scrData || {};
      const scr = appt.scr || {};

      // Determine which screeners have usable data
      const scrRows = SCR_NAMES.map(s => {
        const checked = scr[s];       // true | false | null
        const sd = scrData[s] || { score: '' };
        const hasScore = sd.score !== '' && sd.score !== null && sd.score !== undefined;
        const result = hasScore ? getScrResult(s, sd.score) : null;
        const cfg = SCR_CONFIG[s];
        return { name: s, checked, hasScore, score: sd.score, result, cfg };
      });

      const anyScr = scrRows.some(r => r.checked !== null && r.checked !== undefined);

      // Checklist items
      const checklist = [
        { label: 'Intake Paperwork', val: appt.intake },
        { label: 'Insurance Verified', val: appt.ins },
        { label: 'Autopay on File', val: appt.autopay },
        { label: 'CC in Tebra', val: appt.ccEhr === 'Y' ? true : appt.ccEhr === 'N' ? false : null },
      ];

      return (
        <div className="pim-overlay" onClick={onClose}>
          <div className="pim-modal" onClick={e => e.stopPropagation()}>
            {/* ── Header ── */}
            <div className="pim-hdr">
              <div>
                <div className="pim-title">{appt.patient}</div>
                <div className="pim-sub">
                  {fmtTime(appt.time)}
                  {appt.method ? ` · ${METHOD_LABEL[appt.method] || appt.method}` : ''}
                  {appt.directIns ? ` · ${appt.directIns}` : ''}
                  {' · '}{appt.out ? '✅ Note Signed' : '✎ Unsigned'}
                </div>
              </div>
              <button className="pim-close" onClick={onClose}>×</button>
            </div>

            <div className="pim-body">

              {/* ── Screener Results ── */}
              <div>
                <div className="pim-sec-hdr">🧠 Screener Results</div>
                {!anyScr ? (
                  <div style={{ fontSize: 13, color: '#94A3B8', fontStyle: 'italic', padding: '6px 0' }}>
                    No screener data recorded for this appointment.
                  </div>
                ) : (
                  scrRows.map(({ name, checked, hasScore, score, result, cfg }) => {
                    if (checked === null || checked === undefined) return null;
                    let borderColor = '#D4C99A';
                    if (checked === false) borderColor = '#fca5a5';
                    else if (result) borderColor = result.color;
                    else if (checked) borderColor = '#BE992A';
                    return (
                      <div key={name} className="scr-result-card" style={{ borderLeftColor: borderColor }}>
                        <div className="scr-result-name">{name}</div>
                        {checked === false ? (
                          <div style={{ fontSize: 13, color: '#dc2626', fontWeight: 700 }}>✗ Not completed</div>
                        ) : hasScore && result ? (
                          <>
                            <div style={{ display: 'flex', alignItems: 'baseline', gap: 2 }}>
                              <span className="scr-result-score" style={{ color: result.color }}>{score}</span>
                              <span className="scr-result-of">/ {cfg.max}</span>
                            </div>
                            <span className="scr-result-tag" style={{ background: result.color + '18', color: result.color, border: `1px solid ${result.color}35` }}>
                              {result.text}
                            </span>
                          </>
                        ) : hasScore ? (
                          <>
                            <div style={{ display: 'flex', alignItems: 'baseline', gap: 2 }}>
                              <span className="scr-result-score" style={{ color: '#64748b' }}>{score}</span>
                              <span className="scr-result-of">/ {cfg.max}</span>
                            </div>
                            <span className="scr-result-tag" style={{ background: '#fef9c3', color: '#92400e', border: '1px solid #fde68a' }}>Out of range</span>
                          </>
                        ) : (
                          <div style={{ fontSize: 13, color: '#BE992A', fontWeight: 700 }}>✓ Completed — score not entered</div>
                        )}
                      </div>
                    );
                  })
                )}
              </div>

              {/* ── Clinical Notes from Assistant ── always shown */}
              <div>
                <div className="pim-sec-hdr">📝 Clinical Notes</div>
                {appt.scrNote
                  ? <div className="pim-note-box">{appt.scrNote}</div>
                  : <div style={{ fontSize: 13, color: '#94A3B8', fontStyle: 'italic', padding: '4px 2px' }}>No clinical notes entered by assistant.</div>
                }
              </div>

              {/* ── Pre-Encounter Checklist ── */}
              <div>
                <div className="pim-sec-hdr">✅ Pre-Encounter Checklist</div>
                <div className="pim-checklist-grid">
                  {checklist.map(({ label, val }) => {
                    const color = val === true ? '#16a34a' : val === false ? '#dc2626' : '#BE992A';
                    const icon = val === true ? '✓' : val === false ? '✗' : '?';
                    return (
                      <div key={label} className="pim-check-item">
                        <span className="pim-check-icon" style={{ color }}>{icon}</span>
                        <span style={{ fontWeight: 600, color: '#374151', fontSize: 13 }}>{label}</span>
                      </div>
                    );
                  })}
                </div>
                {/* Issue notes — always shown so provider knows if there are concerns */}
                <div style={{ marginTop: 10 }}>
                  <div style={{ fontSize: 10.5, fontWeight: 900, textTransform: 'uppercase', letterSpacing: .7, color: '#777355', marginBottom: 5, display: 'flex', alignItems: 'center', gap: 5 }}>
                    ⚠️ Issue Notes
                  </div>
                  {appt.checklistNote
                    ? <div className="pim-note-box" style={{ borderLeftColor: '#f97316', background: '#FFF7ED' }}>{appt.checklistNote}</div>
                    : <div style={{ fontSize: 13, color: '#94A3B8', fontStyle: 'italic', padding: '4px 2px' }}>No issues noted.</div>
                  }
                </div>
              </div>

              {/* ── Rx summary (if any) ── */}
              {(appt.rxMeds || []).length > 0 && (
                <div>
                  <div className="pim-sec-hdr">💊 Controlled Substances on File</div>
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
                    {(appt.rxMeds || []).map((m, i) => (
                      <span key={i} className="rx-pv-chip" style={{ fontSize: 13 }}>{m}</span>
                    ))}
                  </div>
                </div>
              )}
            </div>

            <div className="pim-foot">
              <button
                className="btn"
                style={{ background: 'linear-gradient(135deg,#09371F,#0d5c33)', color: '#F2EDDB', border: 'none', borderRadius: 8, padding: '8px 22px', fontWeight: 800, cursor: 'pointer', fontSize: 14 }}
                onClick={onClose}>
                Close
              </button>
            </div>
          </div>
        </div>
      );
    }

    /* ── ProvClaimPill ─────────────────────────────────────────────────────
       Collapsible claim status indicator for the Provider Day View pv-status
       column. Starts collapsed showing just the current claim phase.
       Click to expand and see submitted date / paid amount detail.
    ──────────────────────────────────────────────────────────────────────── */
    function ProvClaimPill({ a }) {
      const [open, setOpen] = React.useState(false);
      const isSubmitted = a.billing === 'submitted';
      const clSt = isSubmitted ? (a.claimStatus || 'Pending') : null;

      const CFG = {
        Pending: { cls: 'pct-pend', icon: '⏳', label: 'Pending' },
        Paid: { cls: 'pct-paid', icon: '✅', label: 'Paid' },
        Denied: { cls: 'pct-denied', icon: '✗', label: 'Denied' },
        Resubmitted: { cls: 'pct-resub', icon: '🔄', label: 'Resubmitted' },
      };
      const cfg = CFG[clSt] || null;

      if (!isSubmitted) {
        return (
          <div className="pv-claim-pill">
            {/* stopPropagation — this pill lives inside .pv-detail-panel, which
                closes the whole row on any click; without this, opening the pill
                would also immediately collapse the row it's in. */}
            <button className="pv-claim-toggle pct-nosub" onClick={e => { e.stopPropagation(); setOpen(o => !o); }}>
              📋 Claim {open ? '▴' : '▾'}
            </button>
            {open && <div className="pv-claim-detail">Not yet submitted</div>}
          </div>
        );
      }

      const paidAmt = clSt === 'Paid' && a.claimPaidAmount
        ? ` · $${parseFloat(a.claimPaidAmount).toFixed(2)}` : '';

      return (
        <div className="pv-claim-pill">
          <button className={`pv-claim-toggle ${cfg.cls}`} onClick={e => { e.stopPropagation(); setOpen(o => !o); }}>
            {cfg.icon} {cfg.label}{paidAmt} {open ? '▴' : '▾'}
          </button>
          {open && (
            <div className="pv-claim-detail">
              {a.claimSubmittedDate ? `Submitted ${a.claimSubmittedDate}` : 'Submitted'}
              {clSt === 'Paid' && a.claimPaidDate ? ` · Paid ${a.claimPaidDate}` : ''}
            </div>
          )}
        </div>
      );
    }

    function ProviderView({ appts, date, prov, onUpdate, onSignNote, totalUnsigned, onClearPhantom, userRole, onForceRefresh, patientDb }) {
      const [cptModal, setCptModal] = useState(null);
      const [rxModal, setRxModal] = useState(null);
      const [notesDraft, setNotesDraft] = useState({});
      const [showLedger, setShowLedger] = useState(false);
      const [showRateAnalysis, setShowRateAnalysis] = useState(false);
      const [showNoteBoard, setShowNoteBoard] = useState(false);
      const [pamModal, setPamModal] = useState(null); // ProviderApptModal from day view 💬 button
      const [infoModalId, setInfoModalId] = useState(null); // PatientInfoModal — store ID for live lookup

      // Billing Channel (assigned via the biller's "Assign Channel" tool) + Insurance
      // Carrier lookup, keyed by patient name — same pattern as BillingView's
      // getPatientInfo(). Shown in both Pre- and Post-visit detail panels.
      function getPatientBilling(a) {
        const pt = (patientDb || []).find(p =>
          `${p.firstName} ${p.lastName}`.toLowerCase() === (a.patient || '').toLowerCase()
        );
        return {
          insurance: a.directIns || (pt && pt.insurance) || '',
          channel: (pt && pt.platform) || '',
        };
      }
      // Rail-and-stile redesign: split the single always-show-everything row
      // into Pre-visit / Post-visit workflows (functionality below is 100%
      // unchanged — this only controls which fields render primary vs. tucked
      // behind a per-row "Details" toggle).
      const [dayMode, setDayMode] = useState('pre');
      const [expandedDetail, setExpandedDetail] = useState({});
      const [expandedUnsigned, setExpandedUnsigned] = useState({});
      // Void appointments (No-show / Rescheduled / Cancelled) and placeholder
      // patients (calendar blocks / personal day holds) are excluded from the
      // Provider view — they cannot be signed and must not inflate unsigned counts.
      const sorted = [...appts]
        .filter(a => !isVoidAppt(a))
        .filter(a => !isPlaceholderPatient(a.patient))
        .sort((a, b) => timeToMinutes(a.time) - timeToMinutes(b.time));

      // ── FIXED (race condition): saving CPT codes and auto-signing the note
      // used to fire as two independent, un-sequenced backend saves. Because
      // saveAppointment() writes the WHOLE row from a JSON snapshot, if that
      // write happened to land on the server AFTER signNoteAndClearUnsigned's
      // write (timing varies with server load — this is why it only happened
      // "sometimes"), its stale snapshot — built before signing occurred —
      // would silently overwrite the signed flag back to unsigned. The CPT
      // codes always survived because that write only ever originates from
      // this one call; only the signed status was at risk of being clobbered.
      // Fix: await the CPT-codes write fully before firing the sign-note
      // write, so the sign-note write always lands last and can never be
      // overwritten. Also await the sign-note write itself, and only close
      // the modal once both are confirmed done, so a provider can't
      // navigate away mid-sequence without at least seeing a "Saving…" state.
      async function saveCpt(appt, codes) {
        const updated = { ...appt, cpt: codes, billing: codes.length > 0 ? 'ready' : 'pending' };
        await onUpdate(updated);
        // Auto-sign the note when CPT codes are saved (reduces clicks for providers)
        if (codes.length > 0 && !appt.out) {
          if (onSignNote) await onSignNote(updated);
          else await onUpdate({ ...updated, out: true });
        }
        setCptModal(null);
      }
      function saveRx(appt, meds) {
        // Clear biller alert when Provider explicitly saves — they've reviewed and acted
        onUpdate({ ...appt, rxMeds: meds, rxBillerAlert: false });
        setRxModal(null);
      }
      function handleNotesBlur(a) {
        const draft = notesDraft[a.id];
        if (draft !== undefined && draft !== a.notes) {
          onUpdate({ ...a, notes: draft });
        }
      }

      // Banner-level "Issues" / "In Process" stat click. Two behaviors,
      // depending on current state:
      //  - If ANY row is currently expanded, collapse everything back to its
      //    original state — a global "reset" button.
      //  - Otherwise, jump to the first matching appointment, open just its
      //    row, and scroll it into view. Issue/In-Process are both Pre-visit
      //    concepts, so this switches to Pre-visit if needed.
      // This is distinct from a per-row click (which only ever toggles that
      // one row) — see the per-row onClick on .pv-status-inline below.
      function jumpToStatus(targetStatus) {
        const anyExpanded = Object.values(expandedDetail).some(Boolean);
        if (anyExpanded) {
          setExpandedDetail({});
          return;
        }
        const match = sorted.find(a => a.status === targetStatus);
        if (!match) return;
        setDayMode('pre');
        setExpandedDetail(p => ({ ...p, [match.id]: true }));
        setTimeout(() => {
          const el = document.getElementById(`pv-row-${match.id}`);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 50);
      }
      function jumpToIssue() { jumpToStatus('issue'); }
      function jumpToPending() { jumpToStatus('pending'); }

      // Post-visit banner clicks (Signed / Pending / Paid) — highlight the
      // matching rows instead of expanding a single one, since these are
      // simple boolean/status facts on every row rather than a single
      // "reason" to surface. Clicking the same stat again clears the highlight.
      const [postHighlight, setPostHighlight] = useState(null); // 'signed' | 'claimPend' | 'paid' | null
      function toggleHighlight(kind) {
        setPostHighlight(p => p === kind ? null : kind);
      }
      function isHighlighted(a) {
        if (!postHighlight) return false;
        if (postHighlight === 'signed') return !!a.out;
        if (postHighlight === 'claimPend') return a.billing === 'submitted' && (!a.claimStatus || a.claimStatus === 'Pending' || a.claimStatus === 'Resubmitted');
        if (postHighlight === 'paid') return a.billing === 'submitted' && a.claimStatus === 'Paid';
        return false;
      }

      return (
        <div>
          <UnsignedTotalBanner count={totalUnsigned} />
          <UnsignedAlert appts={sorted} date={date} onClearPhantom={onClearPhantom} />
          <DayDirectPayBanner appts={sorted} date={date} />
          <SummaryBar appts={sorted} date={date} dayMode={dayMode} onIssueClick={jumpToIssue} onPendingClick={jumpToPending}
            onSignedClick={() => toggleHighlight('signed')} onClaimPendClick={() => toggleHighlight('claimPend')} onPaidClick={() => toggleHighlight('paid')} />
          {/* ── Pre-visit / Post-visit workflow tabs (Rail-and-stile) ── */}
          <div className="pv-tabs">
            <button className={`pv-tab ${dayMode === 'pre' ? 'on' : ''}`} onClick={() => setDayMode('pre')}>
              Pre-visit
            </button>
            <button className={`pv-tab ${dayMode === 'post' ? 'on' : ''}`} onClick={() => setDayMode('post')}>
              Post-visit
            </button>
          </div>
          <div className="pv-card" style={{ paddingBottom: 72 }}>
            {sorted.length === 0 && <div className="empty">No appointments scheduled for this date.</div>}
            {sorted.map(a => {
              const ms = methodStatus(a);
              const sCls = a.status === 'valid' ? 'ok' : a.status === 'issue' ? 'err' : 'pend';
              // Display-time filter: exclude entries whose ISO equals this
              // row's own date (= current Provider-Day `date`). Sheet untouched.
              const displayUnsigned = filterDisplayUnsigned(a.unsigned, date);
              const hasU = displayUnsigned.length > 0;
              const showPay = a.method === 'direct';
              const pBadge = a.paymentCollected ? 'coll' : a.paymentFailed ? 'fail' : 'pend';
              const pTxt = a.paymentCollected ? '✓ Collected' : a.paymentFailed ? '✗ Failed' : '$ Pending';
              const copayColor = showPay
                ? (a.paymentCollected ? '#16a34a' : a.paymentFailed ? '#dc2626' : '#BE992A')
                : '#64748b';
              const statusColor = sCls === 'ok' ? '#16a34a' : sCls === 'err' ? '#dc2626' : '#BE992A';
              const currentNotes = notesDraft[a.id] !== undefined ? notesDraft[a.id] : (a.notes || '');
              const detailOpen = !!expandedDetail[a.id];
              const unsignedOpen = !!expandedUnsigned[a.id];
              const toggleDetail = e => { e.stopPropagation(); setExpandedDetail(p => ({ ...p, [a.id]: !p[a.id] })); };
              const billingInfo = getPatientBilling(a);
              // Post-visit card color system — left border + thin inner
              // border track the Assistant's note-prep progress (independent
              // of billing), background tracks claim status (independent of
              // note progress). Provider "Mark Note Signed" always wins over
              // the Assistant's noteStatus once it's set.
              const postBorderCls = a.out
                ? 'pv-post-signed'
                : (a.noteStatus === 'ready' ? 'pv-post-ready' : (a.noteStatus === 'in_progress' ? 'pv-post-in-progress' : 'pv-post-not-started'));
              const postBgCls = a.billing === 'submitted'
                ? (a.claimStatus === 'Paid' ? 'pv-post-bg-paid' : 'pv-post-bg-pending')
                : 'pv-post-bg-baseline';
              const postDirectCls = a.method === 'direct' ? 'pv-post-direct' : '';
              // Screener score badges — shared by both Pre-visit and Post-visit detail panels
              const screenerChips = (() => {
                const sd = a.scrData || {};
                const chips = ['PHQ-9', 'GAD-7', 'PCL-5'].flatMap(s => {
                  if ((a.scr || {})[s] !== true) return [];
                  const sc = (sd[s] || {}).score;
                  const r = getScrResult(s, sc);
                  if (!r) return [];
                  return [{ s, sc, r }];
                });
                const scrDateLabel = fmtScrDate(sd.date);
                if (!chips.length && !scrDateLabel) return null;
                return (
                  <div style={{ display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: 4, marginBottom: 6 }}>
                    {scrDateLabel && (
                      <span style={{ fontSize: 10, fontWeight: 800, color: '#777355' }}>
                        {scrDateLabel}
                      </span>
                    )}
                    {chips.map(({ s, sc, r }) => (
                      <span key={s} style={{
                        fontSize: 10, fontWeight: 800, padding: '2px 7px', borderRadius: 0,
                        border: `1px solid ${r.color}`, color: r.color,
                      }} title={`${s}: ${sc}/${SCR_CONFIG[s].max} — ${r.text}`}>
                        {s} {sc}
                      </span>
                    ))}
                  </div>
                );
              })();
              return (
                <div key={a.id} id={`pv-row-${a.id}`} className={`pv-row ${dayMode === 'pre' && a.out ? 'dim' : ''} ${dayMode === 'pre' ? `pv-row-pre pv-stile-${sCls}` : ''} ${dayMode === 'post' ? `${postBorderCls} ${postBgCls} ${postDirectCls}` : ''} ${dayMode === 'post' && isHighlighted(a) ? 'pv-row-highlight' : ''}`}>
                  {dayMode === 'pre' ? (
                    <>
                      {/* ── PRE-VISIT: time / patient / valid-issue status / unsigned-notes badge / details ── */}
                      <div className="pv-row-main">
                        <span className="pv-time">{fmtTime(a.time)}</span>
                        <span
                          className="pv-name pv-name-link"
                          onClick={e => { e.stopPropagation(); if (onForceRefresh) onForceRefresh(); setInfoModalId(a.id); }}
                          title="View pre-encounter info: screener scores, clinical notes, checklist"
                          style={{ flex: 1 }}>
                          {a.patient}
                        </span>
                        <span
                          className="pv-status-inline"
                          onClick={sCls !== 'ok' ? toggleDetail : undefined}
                          style={sCls !== 'ok' ? { cursor: 'pointer' } : undefined}
                          title={sCls !== 'ok' ? `Click to see why this appointment is ${a.status === 'issue' ? 'an issue' : 'in process'} — click again (or click inside the details) to close` : undefined}>
                          <StatusDot s={sCls} />
                          <span className={`pv-stat-val ${sCls} ${sCls !== 'ok' ? 'pv-stat-val-link' : ''}`}>
                            {a.status === 'valid' ? 'Valid' : a.status === 'issue' ? 'Issue' : 'In Process'}
                          </span>
                        </span>
                        <button className="pv-details-toggle" onClick={toggleDetail} aria-label="Toggle details">
                          {detailOpen ? '▲' : '▼'}
                        </button>
                      </div>
                      {/* ── 3-column strip (Rail-and-stile "Option A") — Channel &
                          Coverage | Clinical | Unsigned, mirroring the Post-visit
                          strip's shape so both workflows share one visual language. ── */}
                      <div className="pv-strip">
                        <div className="pv-strip-col">
                          <div className="pv-strip-label">Channel &amp; Coverage</div>
                          {(billingInfo.channel || billingInfo.insurance) ? (
                            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 5, alignItems: 'center' }}>
                              {billingInfo.channel && <span className="pv-channel" style={{ margin: 0 }}>{billingInfo.channel}</span>}
                              {billingInfo.insurance && <span className="pv-ins" style={{ marginTop: 0 }}>{billingInfo.insurance}</span>}
                            </div>
                          ) : <span className="pv-strip-empty">—</span>}
                        </div>
                        <div className="pv-strip-col">
                          <div className="pv-strip-label">Clinical</div>
                          {screenerChips ? React.cloneElement(screenerChips, { style: { ...screenerChips.props.style, marginBottom: 0 } }) : <span className="pv-strip-empty">—</span>}
                        </div>
                        <div className="pv-strip-col pv-strip-col-action">
                          {hasU ? (
                            <button className="pv-unsigned-badge" onClick={e => { e.stopPropagation(); setExpandedUnsigned(p => ({ ...p, [a.id]: !p[a.id] })); }}>
                              ⚠ {displayUnsigned.length} unsigned
                            </button>
                          ) : (
                            <span className="pv-unsigned-zero">0 unsigned</span>
                          )}
                        </div>
                      </div>
                      {unsignedOpen && hasU && (
                        <div className="pv-unote">
                          <i className="pv-unote-icon">⚠</i>
                          {displayUnsigned.map((d, i) => (
                            <React.Fragment key={i}>
                              {i > 0 && <span className="pv-unote-sep">·</span>}
                              {fmtUnsignedDate(d)}
                              {onClearPhantom && (
                                <button
                                  className="pv-unote-dismiss"
                                  title={`Remove phantom date ${fmtUnsignedDate(d)}`}
                                  onClick={e => { e.stopPropagation(); onClearPhantom(a, d); }}
                                >✕</button>
                              )}
                            </React.Fragment>
                          ))}
                        </div>
                      )}
                      {detailOpen && (
                        <div
                          className="pv-detail-panel"
                          onClick={toggleDetail}
                          title="Click anywhere here to close">
                          {/* ── Focal content — the actual reason this row is Issue or
                              In Process, front and center per clinic policy: assistants
                              need this visible without hunting through the modal.
                              Issue and In Process share ONE checklist layout — the
                              difference is just which item(s) are incomplete — and
                              every element is centered in the banner, with the
                              incomplete item(s) called out with a solid highlight
                              bar so they can't be missed. ── */}
                          {sCls !== 'ok' && (
                            <div className={`pv-reason-box ${sCls === 'err' ? 'pv-reason-err' : 'pv-reason-pend'}`}>
                              <div className="pv-reason-label">Intake Checklist</div>
                              {[
                                ['Intake Paperwork Complete', a.intake],
                                ['Insurance Verified & Valid', a.ins],
                                ['Autopay / Credit Card on File', a.autopay],
                              ].map(([label, val]) => (
                                <div key={label} className={`pv-checklist-row ${val !== true ? 'pv-checklist-incomplete' : ''}`}>
                                  <span>{label}</span>
                                  <span>{val === true ? '✓' : val === false ? '✗' : '?'}</span>
                                </div>
                              ))}
                              {a.checklistNote && <div className="pv-reason-note">{a.checklistNote}</div>}
                            </div>
                          )}
                          {a.notes && (
                            <div className="pv-reason-box pv-notes-box">
                              <div className="pv-reason-label">📝 Provider Notes</div>
                              <div>{a.notes}</div>
                            </div>
                          )}
                          {/* Screener chips, Channel, and Insurance now live in the
                              always-visible strip above — this panel keeps only the
                              secondary detail: Tebra status, payment, method, claim. */}
                          {a.tebraStatus && <div style={{ marginBottom: 6 }}><TBadge status={a.tebraStatus} /></div>}
                          {(a.paymentType || a.paymentRate) && (
                            <div className={`pv-copay ${showPay ? (a.paymentCollected ? 'pay-coll' : a.paymentFailed ? 'pay-fail' : 'pay-pend') : 'pay-none'}`}>
                              {a.paymentType && <span style={{ textTransform: 'capitalize' }}>{a.paymentType}</span>}
                              {a.paymentRate && <span> · {a.paymentRate}</span>}
                            </div>
                          )}
                          <div className="pv-method">{METHOD_LABEL[a.method] || a.method}</div>
                          {ms.text && <div className={`pv-stxt ${ms.valid === true ? 'ok' : ms.valid === false ? 'err' : 'pend'}`}>{ms.text}</div>}
                          {showPay && <div className={`pay-badge ${pBadge}`}>{pTxt}</div>}
                          {a.method !== 'direct' && <ProvClaimPill a={a} />}
                        </div>
                      )}
                    </>
                  ) : (
                    <>
                      {/* ── POST-VISIT: time / patient / note status / Rx+CPT+Sign actions strip / details ── */}
                      <div className="pv-row-main">
                        <span className="pv-time">{fmtTime(a.time)}</span>
                        <span
                          className="pv-name pv-name-link"
                          onClick={toggleDetail}
                          title="Click to view billing channel, insurance carrier, and visit details"
                          style={{ flex: 1 }}>
                          {a.patient}
                        </span>
                        {(() => {
                          const ns = a.noteStatus || '';
                          const info = (NS_LABELS[ns] || NS_LABELS['']);
                          return <span className={`ns-badge ${info.cls}`}>{info.icon} {info.label}</span>;
                        })()}
                        <button className="pv-details-toggle" onClick={toggleDetail} aria-label="Toggle details">
                          {detailOpen ? '▲' : '▼'}
                        </button>
                      </div>
                      {/* ── 3-column strip (Rail-and-stile "Option A") — Rx | CPT | Sign,
                          each column owns a fixed share of the width so an empty
                          section reads as "nothing to add" instead of leaving a
                          dead gap in the middle of the row. ── */}
                      <div className="pv-strip">
                        <div className="pv-strip-col">
                          <div className="pv-strip-label">Rx</div>
                          <span className="rx-wrap">
                            {(a.rxMeds || []).slice(0, 2).map((m, i) => (
                              <span key={i} className="rx-pv-chip" title={m}>{m}</span>
                            ))}
                            {(a.rxMeds || []).length > 2 && (
                              <span className="rx-pv-chip" style={{ background: '#8b5cf6' }} title={`${(a.rxMeds || []).length - 2} more`}>
                                +{(a.rxMeds || []).length - 2}
                              </span>
                            )}
                            <span className="rx-btn-wrap">
                              <button className="rx-edit-btn" onClick={() => setRxModal(a)}>
                                {(a.rxMeds || []).length > 0 ? '💊 Edit' : '💊 Rx'}
                              </button>
                              {a.rxBillerAlert && <span className="rx-alert-dot" title="Billing updated Rx — save to dismiss" />}
                            </span>
                          </span>
                        </div>
                        <div className="pv-strip-col">
                          <div className="pv-strip-label">CPT</div>
                          <span className="cpt-wrap">
                            {normCpt(a.cpt).map(c => <span key={c} className="cpt-chip">{c}</span>)}
                            <button className="cpt-edit-btn" onClick={() => setCptModal(a)}>
                              {(a.cpt || []).length > 0 ? '✎ Edit' : '+ Add'}
                            </button>
                          </span>
                        </div>
                        <div className="pv-strip-col pv-strip-col-action">
                          {a.out ? (
                            <>
                              <button className="pv-sign-btn signed" style={{ cursor: 'default' }}>✓ Signed</button>
                              <button className="pv-sign-undo" onClick={() => onUpdate({ ...a, out: false })}>↩ Undo</button>
                            </>
                          ) : (
                            <button className="pv-sign-btn unsigned"
                              onClick={() => onSignNote ? onSignNote(a) : onUpdate({ ...a, out: true })}>
                              Mark Note Signed
                            </button>
                          )}
                        </div>
                      </div>
                      {detailOpen && (
                        <div
                          className="pv-detail-panel"
                          onClick={toggleDetail}
                          title="Click anywhere here to close">
                          {screenerChips}
                          <div className="pv-method">{METHOD_LABEL[a.method] || a.method}</div>
                          {billingInfo.channel && <span className="pv-channel">{billingInfo.channel}</span>}
                          {billingInfo.insurance && <div className="pv-ins">{billingInfo.insurance}</div>}
                          {hasU && (
                            <div className="pv-unote">
                              <i className="pv-unote-icon">⚠</i>
                              {displayUnsigned.map((d, i) => (
                                <React.Fragment key={i}>
                                  {i > 0 && <span className="pv-unote-sep">·</span>}
                                  {fmtUnsignedDate(d)}
                                  {onClearPhantom && (
                                    <button
                                      className="pv-unote-dismiss"
                                      title={`Remove phantom date ${fmtUnsignedDate(d)}`}
                                      onClick={e => { e.stopPropagation(); onClearPhantom(a, d); }}
                                    >✕</button>
                                  )}
                                </React.Fragment>
                              ))}
                            </div>
                          )}
                          {a.method !== 'direct' && <ProvClaimPill a={a} />}
                          <div style={{ display: 'flex', alignItems: 'center', marginTop: 6 }}>
                            <CommChatIcon appt={a} onOpen={() => setPamModal(a)} />
                          </div>
                        </div>
                      )}
                    </>
                  )}
                </div>
              );
            })}
          </div>
          {cptModal && <CPTModal appt={cptModal} onSave={codes => saveCpt(cptModal, codes)} onClose={() => setCptModal(null)} />}
          {rxModal && <RxMedModal appt={rxModal} onSave={meds => saveRx(rxModal, meds)} onClose={() => setRxModal(null)} />}

          {/* ── Patient Info Modal — live lookup by ID so it always shows fresh data ── */}
          {infoModalId && (() => {
            const liveAppt = sorted.find(a => a.id === infoModalId);
            return liveAppt
              ? <PatientInfoModal appt={liveAppt} onClose={() => setInfoModalId(null)} />
              : null;
          })()}

          {/* ── Provider Appointment Modal (from day view 💬 button) ── */}
          {pamModal && (
            <ProviderApptModal
              appt={pamModal}
              onUpdate={u => { onUpdate(u); setPamModal(prev => prev ? { ...prev, comms: u.comms, scrData: u.scrData, scrNote: u.scrNote, checklistNote: u.checklistNote } : prev); }}
              onSave={u => { onUpdate(u); setPamModal(null); }}
              onClose={() => setPamModal(null)}
            />
          )}

          {/* ── Rate Analysis panel ── */}
          {showRateAnalysis && <RateAnalysisPanel onClose={() => setShowRateAnalysis(false)} />}

          {/* ── Claims Ledger ── */}
          {showLedger && <ClaimsLedger onClose={() => setShowLedger(false)} provFilter={prov} />}

          {/* ── Note Board panel ── */}
          {showNoteBoard && <NoteBoardPanel onClose={() => setShowNoteBoard(false)} role={userRole || 'provider'} provFilter={prov} />}

          {/* Rate Analysis FAB — right:24; Claims Ledger — right:158; Note Board — right:295 */}
          <button
            className={`ra-fab${showRateAnalysis ? ' open' : ''}`}
            style={{ right: 24 }}
            onClick={e => { e.stopPropagation(); setShowRateAnalysis(o => !o); }}
            title="Insurance Rate Analysis — what each carrier pays per CPT code">
            📊 {showRateAnalysis ? 'Close Rates' : 'Rate Analysis'}
          </button>
          <button
            className={`cl-fab cl-fab-offset${showLedger ? ' open' : ''}`}
            onClick={e => { e.stopPropagation(); setShowLedger(o => !o); }}
            title="Claims Ledger">
            📋 {showLedger ? 'Close Ledger' : 'Claims Ledger'}
          </button>
          <button
            className={`nb-fab${showNoteBoard ? ' open' : ''}`}
            onClick={e => { e.stopPropagation(); setShowNoteBoard(o => !o); }}
            title="Note Board — clinic note formatting status">
            📝 {showNoteBoard ? 'Close Notes' : 'Note Board'}
          </button>

          {/* Phone-only equivalent of the 3 buttons above (see MobileToolsMenu) */}
          <MobileToolsMenu items={[
            { key: 'rate-analysis', label: 'Rate Analysis', icon: '📊', active: showRateAnalysis, onClick: () => setShowRateAnalysis(o => !o) },
            { key: 'ledger', label: 'Claims Ledger', icon: '📋', active: showLedger, onClick: () => setShowLedger(o => !o) },
            { key: 'notes', label: 'Note Board', icon: '📝', active: showNoteBoard, onClick: () => setShowNoteBoard(o => !o) },
          ]} />
        </div>
      );
    }

    // ── Best Channel Hint Component ──────────────────────────
    function BestChannelHint({ carrier, state }) {
      const [data, setData] = React.useState(null);
      const [loading, setLoading] = React.useState(false);
      React.useEffect(() => {
        if (!carrier || !state || carrier.toLowerCase().includes('cash')) { setData(null); return; }
        setLoading(true); setData(null);
        fetch('http://192.168.88.178:8000/api/best-channel?carrier=' + encodeURIComponent(carrier) +
          '&state=' + encodeURIComponent(state) + '&cpts=99214,90833,90836,90838')
          .then(r => r.json()).then(d => { setLoading(false); setData(d); }).catch(() => setLoading(false));
      }, [carrier, state]);
      if (!loading && !data) return null;
      const C = { 'Clinic Submit': { bg: '#7494AA', bd: '#7494AA', tx: '#fff', lb: 'CLINIC' }, 'Headway': { bg: '#16A562', bd: '#16A562', tx: '#fff', lb: 'HEADWAY' }, 'Alma': { bg: '#2D4F33', bd: '#2D4F33', tx: '#fff', lb: 'ALMA' }, 'Grow Therapy': { bg: '#BCA9F7', bd: '#BCA9F7', tx: '#2B2716', lb: 'GROW' } };
      return (

    /* ── Shared Direct Pay banner data builder ────────────────────────────
       Used by both WeekView (provider) and AllProviderWeekView (billing/assistant).
       $0-rate patients are auto-placed in the right (collected) column as $0/$0.
       Returns null only when there are zero direct-pay appointments at all.
    ──────────────────────────────────────────────────────────────────────── */
    function dpSummary(dAppts) {
      // Exclude void appointments (No-show / Rescheduled / Cancelled) from all
      // direct-pay summaries so they never inflate "needs collection" counts.
      const allDirect = dAppts.filter(a => a.method === 'direct' && !isVoidAppt(a));
      if (!allDirect.length) return null;
      const zeroPts = allDirect.filter(a => isZeroRate(a.paymentRate));
      const collectPts = allDirect.filter(a => !isZeroRate(a.paymentRate));
      const realCollected = collectPts.filter(a => a.paymentCollected);
      const failedPts = collectPts.filter(a => a.paymentFailed && !a.paymentCollected);
      const pendingPts = collectPts.filter(a => !a.paymentCollected && !a.paymentFailed);
      const needActionPts = [...pendingPts, ...failedPts]; // left col
      // Right col: real collected + $0 patients (auto-confirmed, tagged _isZero)
      const collectedPts = [...realCollected, ...zeroPts.map(a => ({ ...a, _isZero: true }))];
      const allDone = needActionPts.length === 0;
      const hasFail = failedPts.length > 0;
      return { dp: allDirect, needActionPts, collectedPts, allDone, hasFail };
    }

    /* ── Payment rate display helpers ────────────────────────────────────
       Used in "Needs Collection" columns of week banners and DayDirectPayBanner.
       paymentRate (col AB) = expected amount / copay rate set on the patient.
       paymentAmount (col AC) = what was actually entered at collection time.
       For *uncollected* patients we show the expected rate, not the (empty)
       collected amount.

       fmtPayRate(a)  → display string: "%25" → "%25",  "35" / "$35" → "$35",
                       "0" → "$0",  empty → "—"
       numPayRate(a)  → numeric value for summing totals; % rates return 0
                        (can't sum percentages with dollar amounts).
    ──────────────────────────────────────────────────────────────────────── */
    function fmtPayRate(a) {
      const raw = (a.paymentRate !== null && a.paymentRate !== undefined)
        ? String(a.paymentRate).trim() : '';
      if (!raw) return '—';
      if (raw.includes('%')) return raw;                          // percentage → show verbatim
      const n = parseFloat(raw.replace(/[$,\s]/g, ''));
      if (!isNaN(n)) return `$${n.toFixed(0)}`;                  // dollar amount
      return raw;                                                 // unexpected format → show raw
    }
    function numPayRate(a) {
      const raw = (a.paymentRate !== null && a.paymentRate !== undefined)
        ? String(a.paymentRate).trim() : '';
      if (!raw || raw.includes('%')) return 0;                    // % rates can't be summed
      const n = parseFloat(raw.replace(/[$,\s]/g, ''));
      return isNaN(n) ? 0 : n;
    }

       Shows the provider's total outstanding (past) unsigned notes count
       across ALL dates — not just the current day/week.
    ──────────────────────────────────────────────────────────────────────── */
    function UnsignedTotalBanner({ count }) {
      if (!count) return null; // hide when zero, null (loading), or undefined
      const urgCls = count >= 10 ? 'utb-high' : count >= 4 ? 'utb-med' : 'utb-low';
      return (
        <div className="utb-pill-wrap">

            📋 <span className="utb-pill-num">{count}</span> outstanding note{count !== 1 ? 's' : ''}
          </div>
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════
       CommentsPopup — lightweight comments modal for Assistant/Biller week view
       Opens when clicking a CommChatIcon on an appointment banner.
       Send is FINAL: saves immediately via onUpdate without closing the popup.
    ════════════════════════════════════════════════════════════════════ */
    function CommentsPopup({ appt, onUpdate, onClose }) {
      const [comms, setComms] = useState(appt.comms || []);
      const [commNote, setCommNote] = useState('');
      // Default to the first role-appropriate recipient (e.g. 'provider' for assistant)
      // rather than 'all' so messages are targeted by default.
      const [commTo, setCommTo] = useState(() => {
        const r = _crbUser.role || 'assistant';
        const opts = COMM_TO_OPTIONS[r] || COMM_TO_OPTIONS.assistant;
        return (opts[0] && opts[0].v) || 'all';
      });
      const commListRef = React.useRef(null);

      const myRole = _crbUser.role || 'assistant';
      const toOptions = COMM_TO_OPTIONS[myRole] || COMM_TO_OPTIONS.assistant;

      // Mark all incoming as read and persist readBy so sender's icon loses the !
      // Sync local comms state so subsequent sends use the readBy-updated base.
      React.useEffect(() => {
        markCommsReadPersist(appt, (u) => {
          setComms(u.comms || []);
          if (onUpdate) onUpdate(u);
        });
      }, []);

      // Auto-scroll to bottom on new comment
      React.useEffect(() => {
        if (commListRef.current) commListRef.current.scrollTop = commListRef.current.scrollHeight;
      }, [comms.length]);

      function sendComment() {
        if (!commNote.trim()) return;
        const nc = buildComment(commNote, commTo);
        // Use appt.comms (prop) as base when current — it carries readBy updates
        // from markCommsReadPersist so they aren't lost when we persist the new comment.
        const base = (appt.comms || []).length >= comms.length ? (appt.comms || []) : comms;
        const newComms = [...base, nc];
        setComms(newComms);
        setCommNote('');
        // Send is FINAL — persist immediately, popup stays open
        if (onUpdate) onUpdate({ ...appt, comms: newComms });
      }

      return (
        <div className="cp-overlay" onClick={onClose}>
          <div className="cp-modal" onClick={e => e.stopPropagation()}>
            <div className="cp-hdr">
              <div>
                <div style={{ fontWeight: 800, fontSize: 14, color: '#1E3A5F' }}>{appt.patient}</div>
                <div style={{ fontSize: 11, color: '#64748B' }}>{fmtTime(appt.time)}</div>
              </div>
              <button className="pam-close" onClick={onClose} style={{ fontSize: 18, lineHeight: 1 }}>×</button>
            </div>
            <div className="cp-body">
              <div className="cp-list" ref={commListRef}>
                {comms.length === 0
                  ? <div className="cp-empty">No comments yet.</div>
                  : comms.map((c, i) => <CommItem key={i} c={c} />)
                }
              </div>
              <div className="cp-input-row">
                <select
                  className="cp-to-select"
                  value={commTo}
                  onChange={e => setCommTo(e.target.value)}
                  title="Send to…"
                >
                  {toOptions.map(o => <option key={o.v} value={o.v}>{o.l}</option>)}
                </select>
                <input
                  className="fi" style={{ flex: 1, fontSize: 12 }}
                  placeholder="Add a comment…"
                  value={commNote}
                  onChange={e => setCommNote(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && sendComment()}
                  autoFocus
                />
                <button className="cp-send-btn" onClick={sendComment}>Send</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

                        <div className="wk-status-summary">
                          {counts.ok > 0 && <span className="wk-ss-chip wk-ss-ok" title={`${counts.ok} valid`}>✓ {counts.ok}</span>}
                          {counts.pend > 0 && <span className="wk-ss-chip wk-ss-pend" title={`${counts.pend} pending`}>⏳ {counts.pend}</span>}
                          {counts.err > 0 && <span className="wk-ss-chip wk-ss-err" title={`${counts.err} issue${counts.err !== 1 ? 's' : ''}`}>⚠ {counts.err}</span>}
                        </div>
                      );
                    })()}
                    {isBilling && (claimsTotal > 0 || claimsNotSub > 0) && (
                      <div className="wk-claim-row" title={`${claimsNotSub} not submitted · ${claimsPend} pending · ${claimsDenied} denied · ${claimsResub} resubmitted · ${claimsPaid} paid`}>
                        {claimsNotSub > 0 && <span className="wk-ci wk-ci-nosub">📤{claimsNotSub}</span>}
                        {claimsPend > 0 && <span className="wk-ci wk-ci-pend">{claimsPend}⌛</span>}
                        {claimsDenied > 0 && <span className="wk-ci wk-ci-denied">{claimsDenied}✗</span>}
                        {claimsResub > 0 && <span className="wk-ci wk-ci-resub">{claimsResub}↺</span>}
                        {claimsPaid > 0 && <span className="wk-ci wk-ci-paid">{claimsPaid}✓</span>}
                      </div>
                    )}
                  </div>
                </div>
              );
            })}

            {/* Row 2 (billing only) — Direct Pay collection banners */}
            {isBilling && dayData.map(({ ds, dAppts }) => {
              const s = dpSummary(dAppts);
              if (!s) return <div key={`dp-${ds}`} className="wk-dp-banner-cell"><div className="wk-dp-banner-empty" /></div>;
              const cls = s.allDone ? 'dp-all-done' : s.hasFail ? 'dp-has-failed' : 'dp-has-pending';
              const dayName = DAYS[new Date(...ds.split('-').map(Number).map((v, i) => i === 1 ? v - 1 : v)).getDay()];
              return (
                <div key={`dp-${ds}`} className="wk-dp-banner-cell">
                  <div className={`wk-dp-banner ${cls}`} onClick={() => onSwitchToDay(ds)}
                    title={`Click to open ${dayName} — ${s.dp.length} direct pay patient${s.dp.length !== 1 ? 's' : ''}`}>
                    <div className="wk-dp-banner-cols">
                      {/* Left col — needs collection (pending + failed) */}
                      <div className="wk-dp-banner-col">
                        <div className="wk-dp-banner-col-hdr">
                          💰 {s.needActionPts.length} pt{s.needActionPts.length !== 1 ? 's' : ''}
                        </div>
                        {s.needActionPts.map(a => {
                          const amt = parseFloat(a.paymentAmount) || 0;
                          return (
                            <div key={a.id} className="wk-dp-banner-pt-row">
                              <span className="wk-dp-banner-pt-name">{a.paymentFailed ? '❌ ' : ''}{a.patient.split(' ')[0]}</span>
                              <span className="wk-dp-banner-pt-amt">${amt > 0 ? amt.toFixed(0) : '—'}</span>
                            </div>
                          );
                        })}
                        {s.needActionPts.length === 0 && <div className="wk-dp-banner-none">All done!</div>}
                      </div>
                      {/* Right col — collected + $0 copay (auto-confirmed) */}
                      <div className={`wk-dp-banner-col${!s.allDone ? ' wk-dp-banner-col-done' : ''}`}>
                        <div className="wk-dp-banner-col-hdr">
                          ✅ {s.collectedPts.length} pt{s.collectedPts.length !== 1 ? 's' : ''}
                        </div>
                        {s.collectedPts.map(a => {
                          const amt = parseFloat(a.paymentAmount) || 0;
                          const isZero = a._isZero;
                          return (
                            <div key={a.id} className="wk-dp-banner-pt-row">
                              <span className="wk-dp-banner-pt-name">{a.patient.split(' ')[0]}</span>
                              <span className="wk-dp-banner-pt-amt">{isZero ? '$0/$0' : `$${amt.toFixed(0)}/$${amt.toFixed(0)}`}</span>
                            </div>
                          );
                        })}
                        {s.collectedPts.length === 0 && <div className="wk-dp-banner-none">None yet</div>}
                      </div>
                    </div>
                  </div>
                </div>
              );
            })}

            {/* Row 3 (Row 2 for non-billing) — body columns */}
            {dayData.map(({ ds, dAppts, dVoidAppts, isToday, isSel }) => (
              <div key={ds} className={`wk-col${isToday ? ' wk-today' : ''}${isSel ? ' wk-sel' : ''}`}>
                <div className="wk-appts">
                  {dAppts.length === 0 && dVoidAppts.length === 0 && <div className="wk-empty">·</div>}
                  {/* Active appointments */}
                  {dAppts.map(a => {
                    // Use computeStatus (same logic as day view) so card color matches
                    // what the day view shows — avoids stale col Y (Status) mismatches.
                    const cs = computeStatus(a);
                    const s = cs === 'valid' ? 'ok' : cs === 'issue' ? 'err' : 'pend';
                    const isDirect = a.method === 'direct';
                    const ic = insColor(a.directIns);
                    const provName = (PROVIDERS.find(p => p.id === a.provID) || {}).name || '';
                    const copayAmt = isDirect ? (a.rate ? `$${a.rate}` : '') : (a.copay ? `copay $${a.copay}` : '');
                    const copayClass = isDirect
                      ? (a.paymentCollected ? 'pay-coll' : a.paymentFailed ? 'pay-fail' : 'pay-pend')
                      : 'pay-ins';
                    // Display-time filter: exclude entries whose ISO equals
                    // THIS column's ds. Same rule as WeekView.
                    const unsignedDates = filterDisplayUnsigned(a.unsigned, ds);
                    // Right-border status: POST-VISIT only — same rule as Provider's
                    // week view, extended here so Assistant and Billing week views
                    // carry the identical pre/post visual language.
                    const isSubmittedPv = a.billing === 'submitted';
                    const isPaidPv = isSubmittedPv && a.claimStatus === 'Paid';
                    const postCls = !a.out
                      ? 'wk-post-notsigned'
                      : (isSubmittedPv ? (isPaidPv ? 'wk-post-paid' : 'wk-post-pending') : 'wk-post-signed');
                    return (
                      <div key={a.id} className={`wk-appt wk-${s} ${postCls}${isDirect ? ' wk-direct' : ''}`} onClick={() => onSwitchToDay(ds)}>
                        <div className="wk-r1">
                          <span className="wk-time">{fmtTime(a.time)}</span>
                          {a.directIns && <span className="wk-ins-badge" style={{ background: ic.bg, color: ic.fg }}>{a.directIns}</span>}
                        </div>
                        <div className="wk-pat">{a.patient}</div>
                        {provName && <div className="wk-prov">{provName}</div>}
                        {copayAmt && <div className={`wk-copay ${copayClass}`}>{copayAmt}</div>}
                        {unsignedDates.length > 0 && (
                          <div className="wk-notes">
                            {unsignedDates.map((ud, i) => (
                              <span key={i} className={`wk-nd${s === 'err' ? ' nd-red' : ''}`}>{fmtUnsignedDate(ud)}</span>
                            ))}
                          </div>
                        )}
                        {/* Billing comm-preview zone: centered chat icon + latest comment snippet */}
                        {isBilling && onUpdateForDate && (
                          <div className="wk-comm-zone" onClick={e => e.stopPropagation()}>
                            <CommChatIcon appt={a} onOpen={() => setCommPopup({ appt: a, ds })} />
                            <div className="wk-comm-preview-box">
                              {(() => {
                                const lastComm = (a.comms || []).filter(c => c && c.note).slice(-1)[0];
                                return lastComm ? lastComm.note : 'Add comment...';
                              })()}
                            </div>
                          </div>
                        )}
                        {isBilling && a.billing === 'submitted' && (() => {
                          const clSt = a.claimStatus || 'Pending';
                          const stCls = { Paid: 'wk-cs-paid', Pending: 'wk-cs-pend', Denied: 'wk-cs-denied', Resubmitted: 'wk-cs-resub' }[clSt] || 'wk-cs-pend';
                          const stIcon = { Paid: '✅', Pending: '⏳', Denied: '✗', Resubmitted: '🔄' }[clSt] || '⏳';
